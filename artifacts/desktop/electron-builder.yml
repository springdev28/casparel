# Packaging for the Casparel desktop shell.
#
# The shell loads the hosted web app, so the payload is only the compiled main
# process: installers land in the tens of megabytes (Electron runtime) rather
# than carrying a copy of the front end that would go stale between deploys.
appId: com.casparel.desktop
productName: Casparel
copyright: Copyright © 2026 Casparel

directories:
  output: release
  buildResources: build

# The workspace package is named @workspace/desktop, and electron-builder
# derives artifact filenames, the Linux executable and the .desktop entry from
# that name. The scope turns into a path separator, so the .deb build tried to
# write into a release/@workspace/ directory that does not exist, and the
# desktop entry came out as "@workspacedesktop". Naming these explicitly keeps
# the workspace package name (which pnpm resolves by) separate from what users
# actually see.
artifactName: ${productName}-${version}-${arch}.${ext}
executableName: casparel

files:
  - dist/**/*
  # The compiler's incremental cache lives in dist so that cleaning the output
  # also clears it; it is a build artefact, not part of the app.
  - "!dist/.tsbuildinfo"
  - package.json

# Signing and notarisation need credentials that do not belong in the repo.
# Set CSC_LINK / CSC_KEY_PASSWORD (macOS, Windows) in the release environment;
# unsigned builds are produced without them, which is fine for local testing.
mac:
  # The .app is named after this, not after productName, so the top-level
  # executableName above reached macOS and shipped `casparel.app` -- what a
  # person sees in Finder and in /Applications after dragging it across. The
  # Dock and menu bar read CFBundleName and said "Casparel", so the same
  # application answered to two different names depending on where you looked,
  # and the one users install under was the wrong one. macOS will not paper
  # over it either: CFBundleDisplayName is ignored when it disagrees with the
  # bundle's own filename, precisely so an app cannot present itself as
  # something it is not.
  #
  # The lowercase name is for Linux, where the executable, the .desktop entry
  # and the icon paths are all derived from it. Naming it here per-platform
  # keeps that where it belongs instead of leaking into the other two.
  executableName: Casparel
  category: public.app-category.education
  target:
    - target: dmg
      arch: [x64, arm64]
    # A .app in a .zip, for the people a .dmg does not serve: anyone deploying
    # Casparel across a fleet with a management tool, which wants a bundle it
    # can copy rather than a disk image it has to mount, and anyone on a
    # connection where mounting a 100 MB image to drag one file out of it is a
    # poor trade.
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.png
  darkModeSupport: true
  # Required for the app to reach casparel.com under the hardened runtime.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    # Unpack and run, no installer. Windows in a school is frequently a machine
    # the person using it cannot install software on, and an installer that
    # needs rights they do not have is the same as no download at all. This is
    # also the form that can be inspected before it is run.
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.png

# Debian's own categorisation, separate from the .desktop Categories above:
# one sorts the applications menu, this one sorts the package archive.
deb:
  priority: optional

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  category: Education
  # A directory, not build/icon.png. Handed a single file, electron-builder
  # installs exactly that file, so the .deb shipped one 1024px icon and every
  # launcher, dock and notification downscaled it. Handed a directory it
  # installs the whole set under hicolor/ and each surface picks its size.
  icon: build/icons
  # What a Linux user reads in their applications menu and in GNOME Software.
  # Left to the package description alone, the menu entry read "Casparel -
  # Casparel for macOS, Windows and Linux", which names two operating systems
  # that are not the one they are looking at.
  synopsis: Education workspace for classes, resources and study plans
  # Flat name-to-value, not a nested `entry:` map. electron-builder 25 writes
  # whatever this holds straight into the .desktop file, so a nested map became
  # a literal `entry=[object Object]` line in an otherwise valid entry.
  desktop:
    # What an application search has to match. Nobody types "Casparel" when
    # they do not yet know the product is installed.
    Keywords: education;study;learning;library;research;classes;
  # Four formats and both architectures, because "Linux" is not one thing to
  # install onto. A .deb serves Debian and Ubuntu, a .rpm serves Fedora, RHEL
  # and openSUSE, an AppImage serves everything without touching the package
  # manager, and a .tar.gz serves the case none of those do: no root, or a
  # distribution whose packaging none of them match.
  #
  # arm64 is not a rounding error here. It is every Raspberry Pi and every
  # Windows-on-ARM or Apple-silicon machine running Linux in a VM, and until
  # now the only architecture with a desktop app was the one the release runner
  # happened to be.
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]

# Where updates and releases come from. electron-builder needs this even for
# a local build: the .deb target generates auto-update metadata, and without a
# provider it has no channel to write and the build fails after producing
# perfectly good installers. `--publish never` still keeps it from uploading.
publish:
  provider: github
  owner: springdev28
  repo: casparel

# Deep links: casparel://resources/123 opens that resource in the app.
protocols:
  - name: Casparel
    schemes: [casparel]
