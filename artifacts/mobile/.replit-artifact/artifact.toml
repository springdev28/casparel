kind = "mobile"
previewPath = "/mobile/"
title = "Schoolar Mobile — Student Companion"
description = "A mobile companion app for Schoolar that lets students browse learning resources, check their schedule, review class materials, and track their academic progress from their phone. Teachers can also manage classes and resources. Uses the same API server and authentication as the web app."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
