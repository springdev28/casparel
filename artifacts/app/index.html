<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>Casparel: Student &amp; Teacher App</title>
    <meta name="description" content="Discover resources, manage classes, and stay organised as a student or teacher." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Casparel: Student &amp; Teacher App" />
    <meta property="og:description" content="Discover resources, manage classes, and stay organised as a student or teacher." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://casparel.com/" />
    <meta property="og:image" content="https://casparel.com/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Casparel" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Casparel: Student &amp; Teacher App" />
    <meta name="twitter:description" content="Discover resources, manage classes, and stay organised as a student or teacher." />
    <meta name="twitter:image" content="https://casparel.com/og-image.png?v=2" />
    <!-- Stable, query-free icon URLs: Google needs a crawlable favicon at a URL
         that does not change in order to show it in search results. -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://casparel.com/" />
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Structured data. The app renders client-side, so the served HTML is
         otherwise an empty shell — crawlers read this without executing any
         JavaScript. Deliberately no aggregateRating or review markup: there is
         no real rating data behind it, and fabricated review markup is a
         manual-action risk. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://casparel.com/#organization",
            "name": "Casparel",
            "url": "https://casparel.com/",
            "logo": "https://casparel.com/apple-touch-icon.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://casparel.com/#website",
            "name": "Casparel",
            "url": "https://casparel.com/",
            "publisher": { "@id": "https://casparel.com/#organization" },
            "inLanguage": "en",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://casparel.com/resources?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "WebApplication",
            "@id": "https://casparel.com/#app",
            "name": "Casparel",
            "url": "https://casparel.com/",
            "applicationCategory": "EducationalApplication",
            "operatingSystem": "Web",
            "browserRequirements": "Requires JavaScript",
            "description": "Discover vetted open-education resources, organise classes and schedules, and research any source with AI.",
            "publisher": { "@id": "https://casparel.com/#organization" },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD",
              "description": "The open-education library is free to use."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Crawlers execute JavaScript, but not always and not immediately. This
         gives the page real content and working links on the first fetch. -->
    <noscript>
      <main>
        <h1>Casparel &mdash; learn, organise, study</h1>
        <p>
          Casparel is a free, vetted library of open education for students and
          teachers, with the classes, schedules and study tools to work through
          it &mdash; and AI source research that tells you who is behind any
          resource before you rely on it.
        </p>
        <ul>
          <li>A vetted catalog drawn from Open Library, Wikibooks and other open sources.</li>
          <li>Classes, reading lists, schedules and study sessions in one place.</li>
          <li>AI source research with a credibility assessment and cited evidence.</li>
        </ul>
        <p><a href="/resources">Browse the library</a> &middot; <a href="/auth/register">Create a free account</a></p>
        <p>Casparel needs JavaScript enabled to run the full app.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
