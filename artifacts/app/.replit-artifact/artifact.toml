kind = "web"
previewPath = "/"
title = "Schoolar — Student & Teacher App"
description = "A full-stack student/teacher productivity app for discovering and reviewing learning resources, organizing class lists and schedules, and syncing with Google Classroom."
version = "1.0.0"
id = "artifacts/app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23863

[services.development]
run = "pnpm run dev:app"

[services.production]
build = [ "pnpm", "--filter", "@workspace/app", "run", "build" ]
serve = "static"
publicDir = "artifacts/app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23863"
BASE_PATH = "/"
