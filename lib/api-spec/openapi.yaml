openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Schoolar API — student/teacher productivity platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: classes
    description: Class management
  - name: resources
    description: Learning resource discovery
  - name: reviews
    description: Resource reviews and ratings
  - name: lists
    description: Resource lists
  - name: schedule
    description: Study schedule blocks
  - name: study-sessions
    description: Collaborative study sessions
  - name: dashboard
    description: Dashboard summary and activity
  - name: google-classroom
    description: Google Classroom integration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current user
      responses:
        "204":
          description: Logged out

  /users/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update the authenticated user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/avatar:
    post:
      operationId: uploadAvatar
      tags: [auth]
      summary: Upload an avatar image for the current user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded; returns the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: No file provided or invalid image
        "401":
          description: Not authenticated

  /users/{id}:
    get:
      operationId: getPublicProfile
      tags: [auth]
      summary: Get a public profile for any signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          description: Not authenticated
        "404":
          description: User not found

  /users/me/role:
    patch:
      operationId: switchRole
      tags: [auth]
      summary: Switch the active role for the current user (student ↔ teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleSwitchInput"
      responses:
        "200":
          description: Role updated — returns a fresh auth token and the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid role value
        "401":
          description: Not authenticated

  # ── Classes ───────────────────────────────────────────────────────────────
  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List classes the current user belongs to
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a new class (teacher only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"

  /classes/{id}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get a class by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassWithMembers"
        "404":
          description: Not found
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Update a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Delete a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /classes/{id}/members:
    get:
      operationId: listClassMembers
      tags: [classes]
      summary: List members of a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassMember"
    post:
      operationId: addClassMember
      tags: [classes]
      summary: Add a member to a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassMemberInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassMember"

  /classes/{id}/members/bulk-invite:
    post:
      operationId: bulkInviteClassMembers
      tags: [classes]
      summary: Bulk-add students to a class by email (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInviteInput"
      responses:
        "200":
          description: Bulk invite result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkInviteResult"
        "403":
          description: Not the class teacher

  /classes/{id}/members/{userId}:
    delete:
      operationId: removeClassMember
      tags: [classes]
      summary: Remove a member from a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /classes/{id}/resources-list:
    get:
      operationId: getClassResourcesList
      tags: [classes]
      summary: Get the class resources list with items (teachers and members)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class resources list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListWithItems"
        "403":
          description: Not a class member

  /classes/{id}/assign:
    post:
      operationId: assignResourceToClass
      tags: [classes]
      summary: Assign a resource to the class list (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignResourceBody"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignResourceResponse"
        "403":
          description: Not the class teacher
        "404":
          description: Resource not found

  /classes/{id}/resources-list/items/{resourceId}:
    delete:
      operationId: removeClassResource
      tags: [classes]
      summary: Remove a resource from the class list (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: resourceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Not the class teacher

  # ── Resources ─────────────────────────────────────────────────────────────
  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List and search resources
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free-text search
        - name: format
          in: query
          schema:
            type: string
            enum: [article, video, pdf, podcast, interactive, other]
        - name: subject
          in: query
          schema:
            type: string
        - name: gradeLevel
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, top_rated, most_reviewed]
          description: Sort order for results
        - name: minRating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Only return resources with avgRating >= this value
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 50
          description: Maximum number of results to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of results to skip
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    post:
      operationId: createResource
      tags: [resources]
      summary: Submit a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /resources/prefetch:
    post:
      operationId: prefetchResourceMetadata
      tags: [resources]
      summary: Fetch metadata (title, description, format, thumbnail) for a given URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrefetchResourceBody"
      responses:
        "200":
          description: Extracted metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrefetchResourceResponse"
        "400":
          description: Missing or invalid URL
        "502":
          description: Failed to fetch metadata

  /resources/discover:
    get:
      operationId: discoverResources
      tags: [resources]
      summary: Search the internet for educational resources matching a query
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: format
          in: query
          schema:
            type: string
            enum: [article, video, pdf, podcast, interactive, other]
        - name: subject
          in: query
          schema:
            type: string
        - name: gradeLevel
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for paginated results
      responses:
        "200":
          description: Discovered resources from the web
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoveredResource"
        "400":
          description: Missing query
        "502":
          description: Search failed

  /resources/recommendations:
    get:
      operationId: getResourceRecommendations
      tags: [resources]
      summary: Get personalised resource recommendations (based on review history if authenticated, top-rated otherwise)
      responses:
        "200":
          description: Recommended resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /resources/featured:
    get:
      operationId: listFeaturedResources
      tags: [resources]
      summary: Get featured and popular resources
      responses:
        "200":
          description: Featured resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /resources/{id}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a resource by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Not found
    patch:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
    delete:
      operationId: deleteResource
      tags: [resources]
      summary: Delete a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /resources/{id}/source-review:
    get:
      operationId: getResourceSourceReview
      tags: [resources]
      summary: Research and summarise the resource's source/uploader
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [quick, deep]
            default: quick
          description: >
            quick — use model training knowledge only (fast, no web search);
            deep — use live web search for up-to-date information (slower, thorough)
      responses:
        "200":
          description: Source review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceReview"
        "404":
          description: Resource not found
        "502":
          description: AI search failed

  # ── Reviews ───────────────────────────────────────────────────────────────
  /resources/{id}/reviews:
    get:
      operationId: listResourceReviews
      tags: [reviews]
      summary: List reviews for a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createResourceReview
      tags: [reviews]
      summary: Submit a review for a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /resources/{id}/reviews/{reviewId}:
    delete:
      operationId: deleteResourceReview
      tags: [reviews]
      summary: Delete a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Resource Lists ─────────────────────────────────────────────────────────
  /lists:
    get:
      operationId: listResourceLists
      tags: [lists]
      summary: List resource lists for the current user
      responses:
        "200":
          description: Lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceList"
    post:
      operationId: createResourceList
      tags: [lists]
      summary: Create a new resource list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceListInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"

  /lists/{id}:
    get:
      operationId: getResourceList
      tags: [lists]
      summary: Get a resource list with its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource list with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListWithItems"
        "404":
          description: Not found
    patch:
      operationId: updateResourceList
      tags: [lists]
      summary: Update a resource list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceListPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
    delete:
      operationId: deleteResourceList
      tags: [lists]
      summary: Delete a resource list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /lists/{id}/items:
    post:
      operationId: addListItem
      tags: [lists]
      summary: Add a resource to a list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListItemInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItem"

  /lists/{id}/items/reorder:
    post:
      operationId: reorderListItems
      tags: [lists]
      summary: Reorder items in a list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderListItemsInput"
      responses:
        "204":
          description: Reordered

  /lists/{id}/items/{itemId}:
    delete:
      operationId: removeListItem
      tags: [lists]
      summary: Remove a resource from a list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /lists/{id}/share:
    post:
      operationId: shareListWithClass
      tags: [lists]
      summary: Share a list with a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareListInput"
      responses:
        "204":
          description: Shared

  /lists/shared:
    get:
      operationId: listSharedResourceLists
      tags: [lists]
      summary: Lists shared with the current user via their class memberships
      responses:
        "200":
          description: Shared lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceList"

  # ── Schedule ──────────────────────────────────────────────────────────────
  /schedule:
    get:
      operationId: listScheduleBlocks
      tags: [schedule]
      summary: List schedule blocks for the current user
      parameters:
        - name: weekStart
          in: query
          schema:
            type: string
            format: date
          description: ISO date of the Monday to load (YYYY-MM-DD)
      responses:
        "200":
          description: Schedule blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleBlock"
    post:
      operationId: createScheduleBlock
      tags: [schedule]
      summary: Create a schedule block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBlockInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleBlock"

  /schedule/{id}:
    patch:
      operationId: updateScheduleBlock
      tags: [schedule]
      summary: Update a schedule block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBlockPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleBlock"
    delete:
      operationId: deleteScheduleBlock
      tags: [schedule]
      summary: Delete a schedule block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Study Sessions ────────────────────────────────────────────────────────
  /study-sessions:
    get:
      operationId: listStudySessions
      tags: [study-sessions]
      summary: List study sessions for the current user (organised + invited)
      responses:
        "200":
          description: Study sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
    post:
      operationId: createStudySession
      tags: [study-sessions]
      summary: Create a study session and invite participants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated

  /study-sessions/{id}:
    get:
      operationId: getStudySession
      tags: [study-sessions]
      summary: Get a study session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Study session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
        "403":
          description: Not a participant or organiser
        "404":
          description: Not found
    patch:
      operationId: updateStudySession
      tags: [study-sessions]
      summary: Update a study session (organiser only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
        "403":
          description: Not the organiser
        "404":
          description: Not found
    delete:
      operationId: deleteStudySession
      tags: [study-sessions]
      summary: Cancel a study session (organiser only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cancelled
        "401":
          description: Not authenticated
        "403":
          description: Not the organiser
        "404":
          description: Not found

  /study-sessions/{id}/rsvp:
    patch:
      operationId: rsvpStudySession
      tags: [study-sessions]
      summary: Accept or decline an invitation to a study session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionRsvp"
      responses:
        "200":
          description: RSVP recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
        "403":
          description: Not an invitee
        "404":
          description: Not found

  /users/search:
    get:
      operationId: searchUsers
      tags: [auth]
      summary: Search users who share a class with the requester
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Name search query
        - name: classId
          in: query
          schema:
            type: integer
          description: Restrict to a specific class
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicUser"
        "401":
          description: Not authenticated

  # ── Google Classroom ──────────────────────────────────────────────────────
  /auth/google:
    get:
      operationId: getGCAuthUrl
      tags: [google-classroom]
      summary: Get the Google OAuth authorization URL to connect Google Classroom
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCAuthUrl"
        "503":
          description: Google OAuth not configured
    delete:
      operationId: disconnectGoogle
      tags: [google-classroom]
      summary: Disconnect Google Classroom and revoke tokens
      responses:
        "204":
          description: Disconnected

  /google-classroom/status:
    get:
      operationId: getGCStatus
      tags: [google-classroom]
      summary: Check if the current user has connected Google Classroom
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCStatus"

  /google-classroom/courses:
    get:
      operationId: listGCCourses
      tags: [google-classroom]
      summary: List the teacher's active Google Classroom courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GCCourse"
        "401":
          description: Not connected or token revoked

  /google-classroom/share:
    post:
      operationId: shareToGC
      tags: [google-classroom]
      summary: Post a resource list as an announcement to a Google Classroom course stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GCShareInput"
      responses:
        "200":
          description: Announcement posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCShareResult"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not the list owner or not a teacher

  /google-classroom/import-course:
    post:
      operationId: importGCCourse
      tags: [google-classroom]
      summary: Import a Google Classroom course as a new Schoolar class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GCImportInput"
      responses:
        "201":
          description: Schoolar class created from the Google Classroom course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not a teacher

  /google-classroom/courses/{courseId}/students:
    get:
      operationId: getGCCourseStudents
      tags: [google-classroom]
      summary: List students enrolled in a Google Classroom course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of enrolled students with EduHub link status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GCRosterStudent"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not a teacher of this course

  # ── Dashboard / Activity ──────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary stats for the current user
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /activity/recent:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed for the current user
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:          { type: integer }
        email:       { type: string }
        name:        { type: string }
        role:        { type: string, enum: [student, teacher] }
        avatarUrl:   { type: ["string", "null"] }
        bio:         { type: ["string", "null"] }
        subjects:    { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }
        timezone:    { type: ["string", "null"] }
        websiteUrl:  { type: ["string", "null"] }
        createdAt:   { type: string }

    PublicUser:
      type: object
      required: [id, name, role]
      properties:
        id:          { type: integer }
        name:        { type: string }
        role:        { type: string, enum: [student, teacher] }
        avatarUrl:   { type: ["string", "null"] }
        bio:         { type: ["string", "null"] }
        subjects:    { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:    { type: string }
        password: { type: string, minLength: 6 }
        name:     { type: string, minLength: 1 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:    { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:  { $ref: "#/components/schemas/User" }
        token: { type: string }

    UserUpdate:
      type: object
      properties:
        name:        { type: string, minLength: 1 }
        bio:         { type: ["string", "null"], maxLength: 300 }
        subjects:    { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }
        timezone:    { type: ["string", "null"] }
        websiteUrl:  { type: ["string", "null"] }

    RoleSwitchInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [student, teacher] }

    # ── Classes ─────────────────────────────────────────────────────────────
    Class:
      type: object
      required: [id, name, subject, gradeLevel, teacherId, createdAt]
      properties:
        id:          { type: integer }
        name:        { type: string }
        subject:     { type: string }
        gradeLevel:  { type: string }
        description: { type: ["string", "null"] }
        teacherId:   { type: integer }
        memberCount: { type: integer }
        createdAt:   { type: string }

    ClassWithMembers:
      type: object
      required: [id, name, subject, gradeLevel, teacherId, createdAt, members]
      properties:
        id:          { type: integer }
        name:        { type: string }
        subject:     { type: string }
        gradeLevel:  { type: string }
        description: { type: ["string", "null"] }
        teacherId:   { type: integer }
        memberCount: { type: integer }
        createdAt:   { type: string }
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClassMember"

    ClassInput:
      type: object
      required: [name, subject, gradeLevel]
      properties:
        name:        { type: string, minLength: 1 }
        subject:     { type: string, minLength: 1 }
        gradeLevel:  { type: string, minLength: 1 }
        description: { type: string }

    ClassPatch:
      type: object
      properties:
        name:        { type: string, minLength: 1 }
        subject:     { type: string }
        gradeLevel:  { type: string }
        description: { type: string }

    ClassMember:
      type: object
      required: [userId, classId, role, joinedAt, user]
      properties:
        userId:   { type: integer }
        classId:  { type: integer }
        role:     { type: string, enum: [student, teacher] }
        joinedAt: { type: string }
        user:     { $ref: "#/components/schemas/PublicUser" }

    ClassMemberInput:
      type: object
      required: [email]
      properties:
        email: { type: string }
        role:  { type: string, enum: [student, teacher] }

    # ── Resources ───────────────────────────────────────────────────────────
    PrefetchResourceBody:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1 }

    PrefetchResourceResponse:
      type: object
      required: [title, description, format]
      properties:
        title:        { type: string }
        description:  { type: string }
        format:       { type: string, enum: [article, video, pdf, podcast, interactive, other] }
        thumbnailUrl: { type: ["string", "null"] }

    Resource:
      type: object
      required: [id, title, url, format, subject, gradeLevel, submittedById, avgRating, reviewCount, createdAt]
      properties:
        id:             { type: integer }
        title:          { type: string }
        url:            { type: string }
        description:    { type: ["string", "null"] }
        format:         { type: string, enum: [article, video, pdf, podcast, interactive, other] }
        subject:        { type: string }
        gradeLevel:     { type: string }
        thumbnailUrl:   { type: ["string", "null"] }
        submittedById:  { type: integer }
        avgRating:      { type: number }
        reviewCount:    { type: integer }
        createdAt:      { type: string }

    ResourceInput:
      type: object
      required: [title, url, format, subject, gradeLevel]
      properties:
        title:        { type: string, minLength: 1 }
        url:          { type: string, minLength: 1 }
        description:  { type: string }
        format:       { type: string, enum: [article, video, pdf, podcast, interactive, other] }
        subject:      { type: string, minLength: 1 }
        gradeLevel:   { type: string, minLength: 1 }
        thumbnailUrl: { type: string }

    ResourcePatch:
      type: object
      properties:
        title:        { type: string, minLength: 1 }
        description:  { type: string }
        format:       { type: string, enum: [article, video, pdf, podcast, interactive, other] }
        subject:      { type: string }
        gradeLevel:   { type: string }
        thumbnailUrl: { type: string }

    DiscoveredResource:
      type: object
      required: [title, url, description, format, source]
      properties:
        title:        { type: string }
        url:          { type: string }
        description:  { type: string }
        format:       { type: string, enum: [article, video, pdf, podcast, interactive, other] }
        source:       { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        subject:      { type: ["string", "null"] }
        gradeLevel:   { type: ["string", "null"] }

    SourceReviewLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url:   { type: string }

    SourceReview:
      type: object
      required: [sourceName, sourceType, summary, trustLevel, mode]
      properties:
        sourceName:   { type: string }
        sourceType:   { type: string }
        description:  { type: ["string", "null"] }
        founded:      { type: ["string", "null"] }
        headquarters: { type: ["string", "null"] }
        trustLevel:   { type: string, enum: [high, medium, low, unknown] }
        trustReason:  { type: ["string", "null"] }
        summary:      { type: string }
        links:
          type: array
          items:
            $ref: "#/components/schemas/SourceReviewLink"
        mode:         { type: string, enum: [quick, deep] }

    # ── Reviews ─────────────────────────────────────────────────────────────
    Review:
      type: object
      required: [id, resourceId, userId, rating, createdAt, user]
      properties:
        id:         { type: integer }
        resourceId: { type: integer }
        userId:     { type: integer }
        rating:     { type: integer, minimum: 1, maximum: 5 }
        comment:    { type: ["string", "null"] }
        createdAt:  { type: string }
        user:       { $ref: "#/components/schemas/PublicUser" }

    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating:  { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }

    AssignResourceBody:
      type: object
      required: [resourceId]
      properties:
        resourceId: { type: integer }

    AssignResourceResponse:
      type: object
      required: [listId]
      properties:
        listId: { type: integer }

    # ── Resource Lists ───────────────────────────────────────────────────────
    ResourceList:
      type: object
      required: [id, name, ownerId, itemCount, createdAt]
      properties:
        id:        { type: integer }
        name:      { type: string }
        description: { type: ["string", "null"] }
        ownerId:   { type: integer }
        classId:   { type: ["integer", "null"] }
        itemCount: { type: integer }
        createdAt: { type: string }

    ResourceListWithItems:
      type: object
      required: [id, name, ownerId, itemCount, createdAt, items]
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: ["string", "null"] }
        ownerId:     { type: integer }
        classId:     { type: ["integer", "null"] }
        itemCount:   { type: integer }
        createdAt:   { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListItem"

    ResourceListInput:
      type: object
      required: [name]
      properties:
        name:        { type: string, minLength: 1 }
        description: { type: string }

    ResourceListPatch:
      type: object
      properties:
        name:        { type: string, minLength: 1 }
        description: { type: string }

    ListItem:
      type: object
      required: [id, listId, resourceId, addedAt, position, resource]
      properties:
        id:         { type: integer }
        listId:     { type: integer }
        resourceId: { type: integer }
        note:       { type: ["string", "null"] }
        addedAt:    { type: string }
        position:   { type: integer }
        resource:   { $ref: "#/components/schemas/Resource" }

    ListItemInput:
      type: object
      required: [resourceId]
      properties:
        resourceId: { type: integer }
        note:       { type: string }

    ReorderListItemsInput:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          items: { type: integer }
          description: Ordered array of list item IDs — first element gets position 0

    ShareListInput:
      type: object
      required: [classId]
      properties:
        classId: { type: integer }

    # ── Study Sessions ───────────────────────────────────────────────────────
    StudySessionParticipant:
      type: object
      required: [userId, status]
      properties:
        userId:      { type: integer }
        status:      { type: string, enum: [pending, accepted, declined] }
        name:        { type: ["string", "null"] }
        avatarUrl:   { type: ["string", "null"] }
        respondedAt: { type: ["string", "null"] }

    StudySession:
      type: object
      required: [id, organizerId, title, startsAt, durationMinutes, meetingUrl, createdAt]
      properties:
        id:              { type: integer }
        organizerId:     { type: integer }
        title:           { type: string }
        startsAt:        { type: string }
        durationMinutes: { type: integer }
        topic:           { type: ["string", "null"] }
        resourceId:      { type: ["integer", "null"] }
        meetingUrl:      { type: string }
        createdAt:       { type: string }

    StudySessionWithParticipants:
      allOf:
        - $ref: "#/components/schemas/StudySession"
        - type: object
          required: [participants, myStatus]
          properties:
            participants:
              type: array
              items:
                $ref: "#/components/schemas/StudySessionParticipant"
            myStatus: { type: ["string", "null"] }

    StudySessionInput:
      type: object
      required: [title, startsAt, durationMinutes, meetingUrl]
      properties:
        title:           { type: string, minLength: 1 }
        startsAt:        { type: string }
        durationMinutes: { type: integer, minimum: 5 }
        topic:           { type: string }
        resourceId:      { type: integer }
        meetingUrl:      { type: string, minLength: 1, pattern: "^https?://" }
        inviteeIds:
          type: array
          items: { type: integer }

    StudySessionPatch:
      type: object
      properties:
        title:           { type: string, minLength: 1 }
        startsAt:        { type: string }
        durationMinutes: { type: integer, minimum: 5 }
        topic:           { type: ["string", "null"] }
        resourceId:      { type: ["integer", "null"] }
        meetingUrl:      { type: string, minLength: 1, pattern: "^https?://" }

    StudySessionRsvp:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, declined] }

    # ── Schedule ────────────────────────────────────────────────────────────
    ScheduleBlock:
      type: object
      required: [id, userId, title, date, startTime, endTime, createdAt]
      properties:
        id:         { type: integer }
        userId:     { type: integer }
        title:      { type: string }
        date:       { type: string, format: date }
        startTime:  { type: string }
        endTime:    { type: string }
        resourceId: { type: ["integer", "null"] }
        listId:     { type: ["integer", "null"] }
        classId:    { type: ["integer", "null"] }
        notes:      { type: ["string", "null"] }
        createdAt:  { type: string }

    ScheduleBlockInput:
      type: object
      required: [title, date, startTime, endTime]
      properties:
        title:      { type: string, minLength: 1 }
        date:       { type: string, format: date }
        startTime:  { type: string }
        endTime:    { type: string }
        resourceId: { type: integer }
        listId:     { type: integer }
        classId:    { type: integer }
        notes:      { type: string }

    ScheduleBlockPatch:
      type: object
      properties:
        title:     { type: string, minLength: 1 }
        date:      { type: string, format: date }
        startTime: { type: string }
        endTime:   { type: string }
        notes:     { type: string }
        resourceId: { type: ["integer", "null"] }
        listId:     { type: ["integer", "null"] }

    # ── Dashboard ───────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [classCount, resourceCount, listCount, reviewCount, studentCount, scheduleBlockCount]
      properties:
        classCount:          { type: integer }
        resourceCount:       { type: integer }
        listCount:           { type: integer }
        reviewCount:         { type: integer }
        studentCount:        { type: integer }
        scheduleBlockCount:  { type: integer }

    ActivityItem:
      type: object
      required: [id, type, message, createdAt]
      properties:
        id:         { type: integer }
        type:       { type: string, enum: [review, resource, list, schedule, class] }
        message:    { type: string }
        createdAt:  { type: string }
        userId:     { type: ["integer", "null"] }
        userName:   { type: ["string", "null"] }

    # ── Google Classroom ─────────────────────────────────────────────────────
    GCAuthUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }

    GCStatus:
      type: object
      required: [connected, configured]
      properties:
        connected:  { type: boolean }
        configured: { type: boolean }

    GCCourse:
      type: object
      required: [id, name]
      properties:
        id:      { type: string }
        name:    { type: string }
        section: { type: ["string", "null"] }

    GCShareInput:
      type: object
      required: [listId, courseId]
      properties:
        listId:   { type: integer }
        courseId: { type: string }

    GCShareResult:
      type: object
      required: [announcementId, url]
      properties:
        announcementId: { type: string }
        url:            { type: string }

    GCImportInput:
      type: object
      required: [courseId]
      properties:
        courseId: { type: string }

    GCRosterStudent:
      type: object
      required: [gcUserId, name, email]
      properties:
        gcUserId:      { type: string }
        name:          { type: string }
        email:         { type: string }
        linkedUserId:  { type: ["integer", "null"] }

    BulkInviteInput:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          items: { type: string }
          minItems: 1

    BulkInviteResultItem:
      type: object
      required: [email, status]
      properties:
        email:  { type: string }
        status: { type: string, enum: [added, already_member, not_found] }

    BulkInviteResult:
      type: object
      required: [added, alreadyMember, notFound, results]
      properties:
        added:         { type: integer }
        alreadyMember: { type: integer }
        notFound:      { type: integer }
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkInviteResultItem"
