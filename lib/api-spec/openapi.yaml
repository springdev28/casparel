      required: [id, classId, title, subject, mode, cards, createdAt, updatedAt]
      properties:
        id: { type: integer }
        classId: { type: "null" }
        title: { type: string }
        subject: { type: ["string", "null"] }
        mode: { $ref: "#/components/schemas/StudyActivityMode" }
        cards:
          type: array
          items: { $ref: "#/components/schemas/StudyActivityCard" }
        createdAt: { type: string }
        updatedAt: { type: string }

    PublishStudyActivityInput:
      type: object
      properties:
        destination:
          type: string
          enum: [catalog, forum]
          default: catalog

    PublishStudyActivityResult:
      type: object
      required: [materialId, shareToken, destination]
      properties:
        materialId: { type: integer }
        shareToken: { type: string }
        destination: { type: string, enum: [catalog, forum] }

    # ── Google Classroom ─────────────────────────────────────────────────────
    GCAuthUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }

    GCStatus:
      type: object
      required: [connected, configured]
      properties:
        connected: { type: boolean }
        configured: { type: boolean }

    GCCourse:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        section: { type: ["string", "null"] }

    GCShareInput:
      type: object
      required: [listId, courseId]
      properties:
        listId: { type: integer }
        courseId: { type: string }

    GCShareResult:
      type: object
      required: [announcementId, url]
      properties:
        announcementId: { type: string }
        url: { type: string }

    GCImportInput:
      type: object
      required: [courseId]
      properties:
        courseId: { type: string }

    GCRosterStudent:
      type: object
      required: [gcUserId, name, email]
      properties:
        gcUserId: { type: string }
        name: { type: string }
        email: { type: string }
        linkedUserId: { type: ["integer", "null"] }

    BulkInviteInput:
      type: object
      required: [emails]
      properties:
        emails:
          type: array
          items: { type: string }
          minItems: 1

    BulkInviteResultItem:
      type: object
      required: [email, status]
      properties:
        email: { type: string }
        status: { type: string, enum: [added, already_member, not_found] }

    BulkInviteResult:
      type: object
      required: [added, alreadyMember, notFound, results]
      properties:
        added: { type: integer }
        alreadyMember: { type: integer }
        notFound: { type: integer }
        results:
          type: array
          items:
            $ref: "#/components/schemas/BulkInviteResultItem"

    # ── Calendar ─────────────────────────────────────────────────────────────
    CalendarStatus:
      type: object
      required: [googleConnected, googleConfigured]
      properties:
        googleConnected: { type: boolean }
        googleConfigured: { type: boolean }

    CalendarConnectUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }

    CalendarIcalUrl:
      type: object
      required: [url]
      properties:
        url: { type: string }
    LearningEvidence:
      type: object
      required: [id, userId, concept, confidence, understanding, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        resourceId: { type: ["integer", "null"] }
        learningGoalId: { type: ["integer", "null"] }
        pathStepId: { type: ["string", "null"] }
        studyDurationSeconds: { type: ["integer", "null"], minimum: 0, maximum: 28800 }
        clientSubmissionId: { type: ["string", "null"] }
        concept: { type: string }
        confidence: { type: integer, minimum: 1, maximum: 3 }
        understanding: { type: integer, minimum: 0, maximum: 4 }
        reflection: { type: ["string", "null"] }
        misconception: { type: ["string", "null"] }
        createdAt: { type: string }

    LearningEvidenceInput:
      type: object
      required: [concept, confidence, understanding]
      properties:
        resourceId: { type: ["integer", "null"] }
        learningGoalId: { type: ["integer", "null"] }
        pathStepId: { type: ["string", "null"], minLength: 1, maxLength: 100 }
        studyDurationSeconds: { type: ["integer", "null"], minimum: 0, maximum: 28800 }
        clientSubmissionId: { type: ["string", "null"], minLength: 12, maxLength: 100 }
        concept: { type: string, minLength: 2, maxLength: 160 }
        confidence: { type: integer, minimum: 1, maximum: 3 }
        understanding: { type: integer, minimum: 0, maximum: 4 }
        reflection: { type: ["string", "null"], maxLength: 2000 }
        misconception: { type: ["string", "null"], maxLength: 500 }

    LearningSignalItem:
      type: object
      required: [concept, learnerCount, averageUnderstanding, stalledCount]
      properties:
        concept: { type: string }
        learnerCount: { type: integer }
        averageUnderstanding: { type: number }
        stalledCount: { type: integer }
        commonMisconception: { type: ["string", "null"] }

    LearningSignals:
      type: object
      required: [evidenceCount, learnerCount, averageUnderstanding, signals]
      properties:
        evidenceCount: { type: integer }
        learnerCount: { type: integer }
        averageUnderstanding: { type: number }
        signals:
          type: array
          items: { $ref: "#/components/schemas/LearningSignalItem" }
