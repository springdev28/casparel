        class:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        inviter:
          type: object
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        invitee:
          type: object
          required: [id, name, email]
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }

    ClassInvitationInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }

    ClassInvitationResponseInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, decline] }

    ClassInvitationResponse:
      type: object
      required: [accepted, classId]
      properties:
        accepted: { type: boolean }
        classId: { type: integer }

    ClassJoinCode:
      type: object
      required: [joinCode]
      properties:
        joinCode: { type: ["string", "null"] }

    ClassJoinCodeIssued:
      type: object
      required: [joinCode]
      properties:
        joinCode: { type: string }

    JoinClassInput:
      type: object
      required: [code]
