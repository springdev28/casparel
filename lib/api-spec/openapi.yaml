      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListItemInput"
      responses:
        "200":
          description: Resource was already in the list; the existing item is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItem"
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListItem"
        "409":
          description: The item changed during a concurrent save/delete race; retry is safe

  /lists/{id}/items/reorder:
    post:
      operationId: reorderListItems
      tags: [lists]
      summary: Reorder items in a list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderListItemsInput"
      responses:
        "204":
          description: Reordered

  /lists/{id}/learning-goal:
    post:
      operationId: createLearningGoalFromList
      tags: [lists, learning-goals]
      summary: Turn an ordered resource list into an idempotent learning goal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Existing learning goal for this list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGoal"
        "201":
          description: Learning goal created from the list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGoal"
        "400":
          description: Empty list cannot become a learning path
        "403":
          description: List is not readable by the current user

  /lists/{id}/items/{itemId}:
    delete:
      operationId: removeListItem
      tags: [lists]
      summary: Remove a resource from a list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /lists/{id}/share:
    post:
      operationId: shareListWithClass
      tags: [lists]
      summary: Share a list with a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareListInput"
      responses:
        "204":
          description: Shared

  /lists/shared:
    get:
      operationId: listSharedResourceLists
      tags: [lists]
      summary: Lists shared with the current user via their class memberships
      responses:
        "200":
          description: Shared lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceList"

  # ── Schedule ──────────────────────────────────────────────────────────────
  /schedule:
    get:
      operationId: listScheduleBlocks
      tags: [schedule]
      summary: List schedule blocks for the current user
      parameters:
        - name: weekStart
          in: query
          schema:
            type: string
            format: date
          description: ISO date of the Monday to load (YYYY-MM-DD)
      responses:
        "200":
          description: Schedule blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleBlock"
    post:
      operationId: createScheduleBlock
      tags: [schedule]
      summary: Create a schedule block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBlockInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleBlock"

  /schedule/{id}:
    patch:
      operationId: updateScheduleBlock
      tags: [schedule]
      summary: Update a schedule block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBlockPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleBlock"
    delete:
      operationId: deleteScheduleBlock
      tags: [schedule]
      summary: Delete a schedule block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Study Sessions ────────────────────────────────────────────────────────
  /study-sessions:
    get:
      operationId: listStudySessions
      tags: [study-sessions]
      summary: List study sessions for the current user (organised + invited)
      responses:
        "200":
          description: Study sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
    post:
      operationId: createStudySession
      tags: [study-sessions]
      summary: Create a study session and invite participants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated

  /study-sessions/{id}:
    get:
      operationId: getStudySession
      tags: [study-sessions]
      summary: Get a study session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Study session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
        "403":
          description: Not a participant or organiser
        "404":
          description: Not found
    patch:
      operationId: updateStudySession
      tags: [study-sessions]
      summary: Update a study session (organiser only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
        "403":
          description: Not the organiser
        "404":
          description: Not found
    delete:
      operationId: deleteStudySession
      tags: [study-sessions]
      summary: Cancel a study session (organiser only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cancelled
        "401":
          description: Not authenticated
        "403":
          description: Not the organiser
        "404":
          description: Not found

  /study-sessions/{id}/rsvp:
    patch:
      operationId: rsvpStudySession
      tags: [study-sessions]
      summary: Accept or decline an invitation to a study session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionRsvp"
      responses:
        "200":
          description: RSVP recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
        "403":
          description: Not an invitee
        "404":
          description: Not found

  /users/search:
    get:
      operationId: searchUsers
      tags: [auth]
      summary: Search users who share a class with the requester
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Name search query
        - name: classId
          in: query
          schema:
            type: integer
          description: Restrict to a specific class
        - name: scope
          in: query
          schema:
            type: string
            enum: [shared, all]
            default: shared
          description: Search shared-class users or all discoverable profiles
        - name: role
          in: query
          schema:
            type: string
            enum: [student, teacher]
          description: Filter by student or teacher role
        - name: subject
          in: query
          schema:
            type: string
          description: Match profile subjects, bio, or grade and department
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
          description: Maximum number of matching accounts to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of matching accounts to skip
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicUser"
        "401":
          description: Not authenticated

  # ── Google Classroom ──────────────────────────────────────────────────────
  /auth/google:
    get:
      operationId: getGCAuthUrl
      tags: [google-classroom]
      summary: Get the Google OAuth authorization URL to connect Google Classroom
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCAuthUrl"
        "503":
          description: Google OAuth not configured
    delete:
      operationId: disconnectGoogle
      tags: [google-classroom]
      summary: Disconnect Google Classroom and revoke tokens
      responses:
        "204":
          description: Disconnected

  /google-classroom/status:
    get:
      operationId: getGCStatus
      tags: [google-classroom]
      summary: Check if the current user has connected Google Classroom
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCStatus"

  /google-classroom/courses:
    get:
      operationId: listGCCourses
      tags: [google-classroom]
      summary: List the teacher's active Google Classroom courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GCCourse"
        "401":
          description: Not connected or token revoked

  /google-classroom/share:
    post:
      operationId: shareToGC
      tags: [google-classroom]
      summary: Post a resource list as an announcement to a Google Classroom course stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GCShareInput"
      responses:
        "200":
          description: Announcement posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCShareResult"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not the list owner or not a teacher

  /google-classroom/import-course:
    post:
      operationId: importGCCourse
      tags: [google-classroom]
      summary: Import a Google Classroom course as a new Casparel class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GCImportInput"
      responses:
        "201":
          description: Casparel class created from the Google Classroom course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not a teacher

  /google-classroom/courses/{courseId}/students:
    get:
      operationId: getGCCourseStudents
      tags: [google-classroom]
      summary: List students enrolled in a Google Classroom course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of enrolled students with EduHub link status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GCRosterStudent"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not a teacher of this course

  # ── Dashboard / Activity ──────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary stats for the current user
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /activity/recent:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed for the current user
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── Study activities ─────────────────────────────────────────────────────
  /study-activities:
    get:
      operationId: listStudyActivities
      tags: [study-activities]
      summary: List personal or class-scoped study activities
      parameters:
        - name: classId
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Activities visible in the requested workspace or class
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudyActivity" }
        "400": { description: Invalid class ID }
        "401": { description: Not authenticated }
        "403": { description: Not a member or teacher of the class }
    post:
      operationId: createStudyActivity
      tags: [study-activities]
      summary: Create, copy, remix, or share a study activity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateStudyActivityInput" }
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyActivity" }
        "400": { description: Invalid activity or source resource }
        "401": { description: Not authenticated }
        "403": { description: Not allowed to share with the class }

  /study-activities/shared/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 20
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]+$"
    get:
      operationId: getSharedStudyActivity
      tags: [study-activities]
      summary: Open a published activity without authentication
      responses:
        "200":
          description: Privacy-filtered published activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedStudyActivity" }
        "400": { description: Invalid share token }
        "404": { description: Shared activity not found }

  /study-activities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateStudyActivity
      tags: [study-activities]
      summary: Replace the editable content of an owned or managed activity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStudyActivityInput" }
      responses:
        "200":
          description: Activity updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudyActivity" }
        "400": { description: Invalid activity ID or content }
        "401": { description: Not authenticated }
        "404": { description: Activity not found or not manageable }
    delete:
      operationId: deleteStudyActivity
      tags: [study-activities]
      summary: Delete an owned or teacher-managed activity
      responses:
        "204": { description: Activity deleted }
        "400": { description: Invalid activity ID }
        "401": { description: Not authenticated }
        "404": { description: Activity not found or not manageable }

  /study-activities/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: publishStudyActivity
      tags: [study-activities]
      summary: Publish an owned activity to the catalog and optionally the forum
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishStudyActivityInput" }
      responses:
        "201":
          description: Activity published idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishStudyActivityResult" }
        "400": { description: Invalid activity ID or destination }
        "401": { description: Not authenticated }
        "404": { description: Activity not found or not owned }

  # ── Direct messages ──────────────────────────────────────────────────────
  # ── Collaborative canvases ───────────────────────────────────────────────
  /canvases:
    get:
      operationId: listCanvases
      tags: [canvases]
      summary: List canvases visible to the current account
      responses:
        "200":
          description: Personal, shared, and class canvases ordered by recent activity
          content:
            application/json:
              schema:
                type: array
                maxItems: 250
                items: { $ref: "#/components/schemas/LearningCanvas" }
        "401": { description: Not authenticated }
    post:
      operationId: createCanvas
      tags: [canvases]
      summary: Create a personal canvas or a canvas for a class taught by the account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCanvasInput" }
      responses:
        "201":
          description: Canvas created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningCanvas" }
        "400": { description: Invalid canvas }
        "401": { description: Not authenticated }
        "403": { description: Not the class teacher }

  /canvases/shared/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 20
          maxLength: 100
          pattern: "^[A-Za-z0-9_-]+$"
    get:
      operationId: getSharedCanvas
      tags: [canvases]
      summary: Open a link-published canvas without authentication
      responses:
        "200":
          description: Privacy-filtered published canvas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SharedLearningCanvas" }
        "400": { description: Invalid share token }
        "404": { description: Shared canvas not found }

  /canvases/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getCanvas
      tags: [canvases]
      summary: Get a canvas visible to the current account
      responses:
        "200":
          description: Canvas and effective permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningCanvas" }
        "400": { description: Invalid canvas ID }
        "401": { description: Not authenticated }
        "403": { description: Canvas is not visible to this account }
        "404": { description: Canvas not found }
    patch:
      operationId: updateCanvas
      tags: [canvases]
      summary: Update canvas content with optimistic concurrency or manage its metadata
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCanvasInput" }
      responses:
        "200":
          description: Canvas updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningCanvas" }
        "400": { description: Invalid canvas ID or update }
        "401": { description: Not authenticated }
        "403": { description: Update is not allowed by the effective permissions }
        "404": { description: Canvas not found }
        "409":
          description: The expected canvas version is stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanvasConflictResponse" }
    delete:
      operationId: deleteCanvas
      tags: [canvases]
      summary: Delete a canvas managed by the current account
      responses:
        "204": { description: Canvas deleted }
        "400": { description: Invalid canvas ID }
        "401": { description: Not authenticated }
        "403": { description: Only a canvas manager can delete it }
        "404": { description: Canvas not found }

  /canvases/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: publishCanvas
      tags: [canvases]
      summary: Publish a canvas to the resource catalog and optionally the forum
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishCanvasInput" }
      responses:
        "201":
          description: Canvas published idempotently
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishCanvasResult" }
        "400": { description: Invalid canvas ID or destination }
        "401": { description: Not authenticated }
        "403": { description: Only a canvas manager can publish it }
        "404": { description: Canvas not found }

  /canvases/{id}/collaborators:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: listCanvasCollaborators
      tags: [canvases]
      summary: List the named collaborators on a visible canvas
      responses:
        "200":
          description: Named canvas collaborators
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CanvasCollaborator" }
        "400": { description: Invalid canvas ID }
        "401": { description: Not authenticated }
        "403": { description: Canvas is not visible to this account }
        "404": { description: Canvas not found }

  /canvases/{id}/collaborators/{userId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: userId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      operationId: upsertCanvasCollaborator
      tags: [canvases]
      summary: Add a named collaborator or change their role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CanvasCollaboratorInput" }
      responses:
        "200":
          description: Collaborator saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanvasCollaboratorResult" }
        "400": { description: "Invalid canvas, account, role, or owner target" }
        "401": { description: Not authenticated }
        "403": { description: Only a canvas manager can manage collaborators }
        "404": { description: Canvas or account not found }
    delete:
      operationId: removeCanvasCollaborator
      tags: [canvases]
      summary: Remove a named collaborator
      responses:
        "204": { description: Collaborator removed }
        "400": { description: Invalid canvas or account ID }
        "401": { description: Not authenticated }
        "403": { description: Only a canvas manager can manage collaborators }
        "404": { description: Canvas not found }

  # ── Forum and community catalog ──────────────────────────────────────
  /forum/access:
    get:
      operationId: getForumAccess
      tags: [forum]
      summary: Get the current account's Forum moderation capabilities
      responses:
        "200":
          description: Forum capability flags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumAccess" }
        "401": { description: Not authenticated }

  /forum/materials:
    get:
      operationId: listForumMaterials
      tags: [forum]
      summary: List visible community learning materials
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 160 }
        - name: unit
          in: query
          schema: { type: string, maxLength: 100 }
        - name: topic
          in: query
          schema: { type: string, maxLength: 100 }
        - name: type
          in: query
          schema: { $ref: "#/components/schemas/ForumMaterialType" }
        - name: uploader
          in: query
          schema: { type: string, maxLength: 100 }
        - name: date
          in: query
          schema: { type: string, enum: [day, week, month, year] }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest, downloads, views] }
      responses:
        "200":
          description: Visible materials ordered by the requested sort
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/ForumMaterial" }
        "400": { description: Invalid material filter }
        "401": { description: Not authenticated }
    post:
      operationId: createForumMaterial
      tags: [forum]
      summary: Publish a linked or uploaded community learning material
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CreateForumMaterialForm" }
      responses:
        "201":
          description: Material published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumMaterial" }
        "400": { description: Missing or invalid material fields }
        "401": { description: Not authenticated }
        "409": { description: Material title already exists }
        "415": { description: Unsupported uploaded file }

  /forum/materials/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      operationId: deleteForumMaterial
      tags: [forum]
      summary: Delete an uploaded material as its uploader or an administrator
      responses:
        "204": { description: Material deleted }
        "400": { description: Invalid material ID }
        "401": { description: Not authenticated }
        "403": { description: Not the uploader or an administrator }
        "404": { description: Material not found }

  /forum/materials/{id}/view:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: recordForumMaterialView
      tags: [forum]
      summary: Record that a visible linked material was opened
      responses:
        "204": { description: View recorded }
        "400": { description: Invalid material ID }
        "401": { description: Not authenticated }
        "404": { description: Visible material not found }

  /forum/materials/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: downloadForumMaterialFile
      tags: [forum]
      summary: Download the uploaded file for a visible material
      responses:
        "200":
          description: Uploaded material file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { description: Invalid material ID }
        "401": { description: Not authenticated }
        "404": { description: Visible material file not found }

  /forum/materials/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: approveForumMaterial
      tags: [forum]
      summary: Add a verified-teacher approval to a student material
      responses:
        "200":
          description: Material with its updated approvals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumMaterial" }
        "400": { description: Invalid material ID or material does not require approval }
        "401": { description: Not authenticated }
        "403": { description: Verified teacher or administrator access required }
        "404": { description: Material not found }

  /forum/posts:
    get:
      operationId: listForumPosts
      tags: [forum]
      summary: List visible global or class-scoped Forum posts
      parameters:
        - name: classId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: q
          in: query
          schema: { type: string, maxLength: 160 }
        - name: tag
          in: query
          schema: { type: string, maxLength: 40 }
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/ForumPostKind" }
      responses:
        "200":
          description: Visible posts ordered newest first
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items: { $ref: "#/components/schemas/ForumPost" }
        "400": { description: Invalid post filter }
        "401": { description: Not authenticated }
        "403": { description: Class membership required }
    post:
      operationId: createForumPost
      tags: [forum]
      summary: Publish a moderated post or survey with an optional attachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CreateForumPostForm" }
      responses:
        "201":
          description: Post published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumPost" }
        "400": { description: "Invalid post, survey, quote, class, or material attachment" }
        "401": { description: Not authenticated }
        "403": { description: Class membership required }
        "415": { description: Unsupported uploaded file }
        "422": { description: Moderation requires content changes }

  /forum/posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      operationId: deleteForumPost
      tags: [forum]
      summary: Delete a post as its author or an administrator
      responses:
        "204": { description: Post deleted }
        "400": { description: Invalid post ID }
        "401": { description: Not authenticated }
        "403": { description: Not the author or an administrator }
        "404": { description: Post not found }

  /forum/posts/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: downloadForumPostFile
      tags: [forum]
      summary: Download the attachment for a visible post
      responses:
        "200":
          description: Post attachment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { description: Invalid post ID }
        "401": { description: Not authenticated }
        "404": { description: Visible post attachment not found }

  /forum/posts/{id}/repost:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: toggleForumPostRepost
      tags: [forum]
      summary: Toggle the current account's repost for a visible post
      responses:
        "200":
          description: Confirmed repost state and count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumRepostResult" }
        "400": { description: Invalid post ID }
        "401": { description: Not authenticated }
        "404": { description: Visible post not found }

  /forum/posts/{id}/vote:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: castForumSurveyVote
      tags: [forum]
      summary: Cast or replace a vote on a visible survey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForumSurveyVoteInput" }
      responses:
        "200":
          description: Updated survey post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumPost" }
        "400": { description: Invalid post ID or survey option }
        "401": { description: Not authenticated }
        "404": { description: Visible post not found }
    delete:
      operationId: removeForumSurveyVote
      tags: [forum]
      summary: Remove a vote from a visible survey
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoveForumSurveyVoteInput" }
      responses:
        "200":
          description: Updated survey post
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumPost" }
        "400": { description: "Invalid post ID, survey, or survey option" }
        "401": { description: Not authenticated }
        "404": { description: Visible post not found }

  /forum/{targetType}/{id}/like:
    parameters:
      - name: targetType
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ForumTargetType" }
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: toggleForumLike
      tags: [forum]
      summary: Toggle a like on a visible post or material
      responses:
        "200":
          description: Confirmed like state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumLikeResult" }
        "400": { description: Invalid like target }
        "401": { description: Not authenticated }
        "404": { description: Visible target not found }

  /forum/{targetType}/{id}/comments:
    parameters:
      - name: targetType
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ForumTargetType" }
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: listForumComments
      tags: [forum]
      summary: List approved comments on a visible post or material
      responses:
        "200":
          description: Approved comments ordered oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ForumComment" }
        "400": { description: Invalid comment target }
        "401": { description: Not authenticated }
        "404": { description: Visible target not found }
    post:
      operationId: createForumComment
      tags: [forum]
      summary: Publish a moderated comment or reply on a visible target
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateForumCommentInput" }
      responses:
        "201":
          description: Comment published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumComment" }
        "400": { description: Invalid target or blank comment }
        "401": { description: Not authenticated }
        "404": { description: Visible target or account not found }
        "422": { description: Moderation requires content changes }

  /forum/comments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      operationId: deleteForumComment
      tags: [forum]
      summary: Delete a comment as its author or an administrator
      responses:
        "204": { description: Comment deleted }
        "400": { description: Invalid comment ID }
        "401": { description: Not authenticated }
        "403": { description: Not the author or an administrator }
        "404": { description: Comment not found }

  /forum/reports:
    post:
      operationId: createForumReport
      tags: [forum]
      summary: Report visible Forum content for automated and administrator review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateForumReportInput" }
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumReport" }
        "400": { description: Invalid report }
        "401": { description: Not authenticated }
        "404": { description: Visible reported content or account not found }
    get:
      operationId: listForumReports
      tags: [forum]
      summary: List reports for administrator moderation
      responses:
        "200":
          description: Reports ordered newest first
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: "#/components/schemas/ForumReport" }
        "401": { description: Not authenticated }
        "403": { description: Administrator access required }

  /forum/reports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateForumReport
      tags: [forum]
      summary: Resolve or dismiss a Forum report as an administrator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateForumReportInput" }
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForumReport" }
        "400": { description: Invalid report ID or status }
        "401": { description: Not authenticated }
        "403": { description: Administrator access required }
        "404": { description: Report not found }

  /direct-messages/conversations:
    get:
      operationId: listDirectConversations
      tags: [direct-messages]
      summary: List private conversations for the current user
      responses:
        "200":
          description: Conversations ordered by most recent activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectConversation" }
        "401": { description: Not authenticated }
    post:
      operationId: createDirectConversation
      tags: [direct-messages]
      summary: Start or reopen a private conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDirectConversationInput" }
      responses:
        "201":
          description: Conversation created or returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectConversation" }
        "400": { description: Invalid target account }
        "401": { description: Not authenticated }
        "403": { description: Messaging is blocked or requests are disabled }
        "404": { description: Target account not found }

  /direct-messages/conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getDirectConversation
      tags: [direct-messages]
      summary: Get a private conversation and mark received messages read
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectConversationDetails" }
        "400": { description: Invalid conversation ID }
        "401": { description: Not authenticated }
        "404": { description: Conversation not found }

  /direct-messages/conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: sendDirectMessage
      tags: [direct-messages]
      summary: Send a message in an accepted conversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendDirectMessageInput" }
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectMessage" }
        "400": { description: Invalid message }
        "401": { description: Not authenticated }
        "403": { description: Conversation is blocked or awaiting acceptance }
        "404": { description: Conversation not found }

  /direct-messages/conversations/{id}/request:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: respondToDirectMessageRequest
      tags: [direct-messages]
      summary: Accept or decline an incoming message request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RespondDirectMessageRequestInput" }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectConversation" }
        "400": { description: Invalid conversation ID or response action }
        "401": { description: Not authenticated }
        "404": { description: Incoming request not found }

  # ── Calendar ──────────────────────────────────────────────────────────────
  /calendar/status:
    get:
      operationId: getCalendarStatus
      tags: [calendar]
      summary: Get truthful Google Calendar connection availability and status
      responses:
        "200":
          description: Calendar status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarStatus"
        "401":
          description: Not authenticated

  /calendar/ical-url:
    get:
      operationId: getCalendarIcalUrl
      tags: [calendar]
      summary: Get the personal iCal subscription URL
      responses:
        "200":
          description: iCal feed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarIcalUrl"
        "401":
          description: Not authenticated

  /calendar/ical-url/rotate:
    post:
      operationId: rotateCalendarIcalUrl
      tags: [calendar]
      summary: Revoke the previous iCal capability URL and issue a new one
      responses:
        "200":
          description: Rotated personal iCal feed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarIcalUrl"
        "401":
          description: Not authenticated

  /calendar/google/connect:
    get:
      operationId: getCalendarGoogleConnectUrl
      tags: [calendar]
      summary: Get the Google OAuth URL to connect Google Calendar
      responses:
        "200":
          description: OAuth authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarConnectUrl"
        "503":
          description: Google OAuth not configured

  /calendar/google/disconnect:
    delete:
      operationId: disconnectCalendarGoogle
      tags: [calendar]
      summary: Disconnect Google Calendar and remove stored tokens
      responses:
        "204":
          description: Disconnected
        "401":
          description: Not authenticated

  /calendar/google/callback:
    get:
      operationId: getCalendarGoogleCallback
      tags: [calendar]
      summary: Complete the signed Google Calendar OAuth callback
      parameters:
        - { name: code, in: query, schema: { type: string, minLength: 1 } }
        - { name: state, in: query, schema: { type: string, minLength: 1 } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to the profile or an OAuth error state }

  /calendar/{icalSecret}/feed.ics:
    get:
      operationId: downloadCalendarFeed
      tags: [calendar]
      summary: Read the calendar belonging to an unguessable subscription capability
      security: []
      parameters:
        - name: icalSecret
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Personal calendar subscription
          content:
            text/calendar:
              schema: { type: string }
        "400": { description: Invalid capability format }
        "404": { description: Capability revoked or not found }

  /schedule/{id}/export.ics:
    get:
      operationId: exportScheduleBlockIcs
      tags: [calendar]
      summary: Download a single schedule block as an .ics file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: iCal file
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Not authenticated
        "404":
          description: Block not found

  /study-sessions/{id}/export.ics:
    get:
      operationId: exportStudySessionIcs
      tags: [calendar]
      summary: Download a single study session as an .ics file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: iCal file
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Not authenticated
        "404":
          description: Session not found

  /learning-evidence:
    get:
      operationId: listLearningEvidence
      tags: [learning-goals]
      summary: List comprehension and reflection evidence for the current learner
      responses:
        "200":
          description: Learning evidence, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearningEvidence" }
    post:
      operationId: createLearningEvidence
      tags: [learning-goals]
      summary: Record a post-resource comprehension checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningEvidenceInput" }
      responses:
        "200":
          description: Existing evidence returned for an idempotent retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningEvidence" }
        "201":
          description: Recorded learning evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningEvidence" }
        "403":
          description: Referenced learning goal is not owned by the current user
        "409":
          description: A concurrent submission could not be reconciled and may be retried

  /learning-signals:
    get:
      operationId: getLearningSignals
      tags: [learning-goals]
      summary: Get teacher-facing class learning signals from checkpoint evidence
      responses:
        "200":
          description: Aggregated learning signals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningSignals" }
        "403": { description: Teacher role required }

components:
  schemas:
    ProductEventInput:
      type: object
      additionalProperties: false
      required: [event]
      properties:
        event:
          type: string
          enum:
            [
              onboarding_started,
              onboarding_completed,
              search_result_opened,
              paywall_viewed,
              purchase_started,
              web_vital_measured,
              client_error_observed,
            ]
        resourceId: { type: integer, minimum: 1 }
        context:
          type: object
          additionalProperties: false
          properties:
            surface: { type: string, maxLength: 48 }
            resultType: { type: string, maxLength: 32 }
            material: { type: string, maxLength: 32 }
            position: { type: integer, minimum: 1, maximum: 100 }
            milestone: { type: string, maxLength: 48 }
            plan: { type: string, maxLength: 24 }
            workspaceRole: { type: string, enum: [student, teacher] }
            routeGroup: { type: string, maxLength: 32 }
            metric: { type: string, enum: [LCP, INP, CLS, TTFB] }
            value: { type: number, minimum: 0, maximum: 10000000 }
            rating:
              { type: string, enum: [good, needs-improvement, poor] }
            source:
              {
                type: string,
                enum: [react_boundary, window_error, unhandled_rejection],
              }
            errorKind:
              {
                type: string,
                enum:
                  [
                    chunk_load,
                    type_error,
                    reference_error,
                    range_error,
                    syntax_error,
                    network_error,
                    unknown,
                  ],
              }

    ProductEventAccepted:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ────────────────────────────────────────────────────────────────
    User:
      type: object
      required:
        [
          id,
          email,
          name,
          role,
          profileVisibility,
          showBio,
          showSubjects,
          showGradeOrDept,
          showWebsite,
          createdAt,
        ]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
        activeRole: { type: string, enum: [student, teacher] }
        educatorEnabled: { type: boolean }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        subjects: { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }
        timezone: { type: ["string", "null"] }
        websiteUrl: { type: ["string", "null"] }
        profileVisibility:
          { type: string, enum: [everyone, classmates, private] }
        libraryVisibility:
          { type: string, enum: [everyone, classmates, private] }
        showBio: { type: boolean }
        showSubjects: { type: boolean }
        showGradeOrDept: { type: boolean }
        showWebsite: { type: boolean }
        createdAt: { type: string }

    PublicUser:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
        websiteUrl: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        subjects: { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
