          recommenderName,
          status,
          resource,
          createdAt,
        ]
      properties:
        id: { type: integer }
        classId: { type: integer }
        resourceId: { type: integer }
        recommendedById: { type: integer }
        recommenderName: { type: string }
        status: { type: string, enum: [pending, approved, declined] }
        note: { type: ["string", "null"] }
        reviewedById: { type: ["integer", "null"] }
        reviewedAt: { type: ["string", "null"] }
        createdAt: { type: string }
        resource: { $ref: "#/components/schemas/Resource" }

    ClassInvitation:
      type: object
      required:
        [
          id,
          classId,
          userId,
          invitedById,
          role,
          status,
          createdAt,
          class,
          inviter,
          invitee,
        ]
      properties:
        id: { type: integer }
        classId: { type: integer }
        userId: { type: integer }
        invitedById: { type: integer }
        role: { type: string, enum: [student, teacher] }
        status: { type: string, enum: [pending, accepted, declined] }
