          avgRating,
          reviewCount,
          createdAt,
        ]
      properties:
        id: { type: integer }
        title: { type: string }
        url: { type: string }
        description: { type: ["string", "null"] }
        format:
          {
            type: string,
            enum: [article, video, pdf, podcast, interactive, other],
          }
        subject: { type: string }
        gradeLevel: { type: string }
