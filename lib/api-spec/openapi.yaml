# @fileOverview: Contract role: defines the OpenAPI source of truth used to generate client hooks and runtime Zod schemas.
# System connection: codegen feeds lib/api-client-react and lib/api-zod; Express handlers must implement the same operations.
openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Casparel API — student/teacher productivity platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: learning-goals
    description: Personal learning goals and coordinated next steps
  - name: classes
    description: Class management
  - name: resources
    description: Learning resource discovery
  - name: reviews
    description: Resource reviews and ratings
  - name: lists
    description: Resource lists
  - name: schedule
    description: Study schedule blocks
  - name: study-sessions
    description: Collaborative study sessions
  - name: study-activities
    description: Reusable flashcard, practice, quiz, and classroom learning activities
  - name: canvases
    description: Collaborative visual learning canvases and sharing controls
  - name: forum
    description: Community posts, surveys, learning materials, comments, reactions, reports, and moderation
  - name: assignments
    description: Teacher-assigned class work, learner completion, and progress summaries
  - name: workflow
    description: Cross-feature learning journeys and resumable next actions
  - name: dashboard
    description: Dashboard summary and activity
  - name: google-classroom
    description: Google Classroom integration
  - name: calendar
    description: Google Calendar sync and iCal feed
  - name: analytics
    description: Privacy-conscious first-party product events
  - name: direct-messages
    description: Private conversations and message requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analytics/events:
    post:
      operationId: recordProductEvent
      tags: [analytics]
      summary: Record an allowlisted first-party product event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductEventInput"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEventAccepted"
        "400":
          description: Invalid or non-allowlisted event
        "401":
          description: Not authenticated

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current user
      responses:
        "204":
          description: Logged out

  /users/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update the authenticated user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteMe
      tags: [auth]
      summary: Permanently delete the authenticated account
      description: >-
        Anonymises the account and ends the session. Implemented on the server
        since launch but absent from this document, so no generated client
        existed and the mobile app had no way to offer deletion - which App
        Store guideline 5.1.1(v) requires of any app that lets you create an
        account.
      responses:
        "204":
          description: Account deleted
        "401":
          description: Not authenticated

  /users/me/avatar:
    post:
      operationId: uploadAvatar
      tags: [auth]
      summary: Upload an avatar image for the current user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded; returns the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: No file provided or invalid image
        "401":
          description: Not authenticated

  /users/me/avatar/preset:
    put:
      operationId: setPresetAvatar
      tags: [auth]
      summary: Select an expressive preset avatar as the current user profile picture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresetAvatarInput"
      responses:
        "200":
          description: Avatar selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid avatar

  /users/{id}/library:
    get:
      operationId: getUserLibrary
      tags: [auth]
      summary: Get a user library when the viewer has permission
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: User library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserLibrary" }
        "403": { description: Library is not visible to this viewer }
        "404": { description: User not found }

  /users/{id}:
    get:
      operationId: getPublicProfile
      tags: [auth]
      summary: Get a public profile for any signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          description: Not authenticated
        "404":
          description: User not found

  /users/{id}/safety:
    get:
      operationId: getUserSafetyStatus
      tags: [auth]
      summary: Check whether the current user has blocked another user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Safety relationship
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSafetyStatus" }
    put:
      operationId: blockUser
      tags: [auth]
      summary: Block a user from profile access and collaboration
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: User blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSafetyStatus" }
    delete:
      operationId: unblockUser
      tags: [auth]
      summary: Unblock a user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: User unblocked }

  /users/{id}/report:
    post:
      operationId: reportUser
      tags: [auth]
      summary: Privately report a user for moderation review
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportUserInput" }
      responses:
        "201":
          description: Report received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportUserResponse" }

  /users/me/role:
    patch:
      operationId: switchRole
      tags: [auth]
      summary: Switch the learner or educator workspace for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleSwitchInput"
      responses:
        "200":
          description: Workspace updated — returns a fresh auth token and the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid role value
        "401":
          description: Not authenticated

  /users/me/usage:
    get:
      operationId: getMyUsage
      tags: [auth]
      summary: Get the current account plan and AI usage
      responses:
        "200":
          description: Current plan and usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountUsage" }
        "401": { description: Not authenticated }

  /users/me/entitlements/reconcile:
    post:
      operationId: reconcileMyEntitlements
      tags: [auth]
      summary: Reconcile the signed-in account plan from RevenueCat
      description: >-
        Fetches the current RevenueCat Customer Info for the authenticated
        Casparel account and updates only its subscription plan fields. Clients
        call this after purchase or restore so server-side feature gates do not
        have to wait for webhook delivery.
      responses:
        "200":
          description: Authoritative subscription state after reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EntitlementReconciliation" }
        "401": { description: Not authenticated }
        "503": { description: RevenueCat is unavailable or not configured }

  /users/me/preferences:
    get:
      operationId: getUserPreferences
      tags: [auth]
      summary: Get the current account's synchronized interface preferences
      responses:
        "200":
          description: Current preferences or safe defaults for a new account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "401": { description: Not authenticated }
    patch:
      operationId: updateUserPreferences
      tags: [auth]
      summary: Merge synchronized interface preferences for the current account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPreferencesPatch" }
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
        "400": { description: Invalid or unsupported preference value }
        "401": { description: Not authenticated }
        "413": { description: Preferences payload is too large }

  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get administrator usage and content totals
      responses:
        "200":
          description: Administrator overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Search and paginate administrator-visible accounts
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: role
          in: query
          description: Filter by platform authority, not the active workspace.
          schema: { type: string, enum: [student, teacher, admin] }
        - name: status
          in: query
          schema: { type: string, enum: [active, banned] }
        - name: educatorEnabled
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Matching account page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUsersPage" }
        "400": { description: Invalid filter or pagination value }
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }

  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      summary: Update an account profile, authority, or workspace capability
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserPatch" }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Invalid update or protected self-demotion }
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }
        "404": { description: Account not found }
        "409": { description: Email address already in use }

  /admin/users/{id}/plan:
    patch:
      operationId: overrideAdminUserPlan
      tags: [admin]
      summary: Override an account plan and record the administrator's reason
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPlanOverride" }
      responses:
        "200":
          description: Account with the effective plan override
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: "Invalid plan, expiry, or missing audit reason" }
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }
        "404": { description: Account not found }

  /admin/users/{id}/ban:
    patch:
      operationId: banAdminUser
      tags: [admin]
      summary: Ban an account with a persisted administrator reason
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminBanInput" }
      responses:
        "200":
          description: Banned account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Invalid request or protected self-ban }
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }
        "404": { description: Account not found }
    delete:
      operationId: unbanAdminUser
      tags: [admin]
      summary: Restore access to a banned account
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Restored account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }
        "404": { description: Account not found }

  /admin/users/{id}/teacher-verification:
    patch:
      operationId: updateAdminPublisherVerification
      tags: [admin]
      summary: Update account-level trusted publisher verification
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminPublisherVerificationInput" }
      responses:
        "200":
          description: Updated account trust state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { description: Invalid request or implicitly trusted administrator }
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }
        "404": { description: Account not found }

  /admin/resources/review-queue:
    get:
      operationId: listAdminResourceReviewQueue
      tags: [admin]
      summary: List resources in one moderation state, oldest first
      parameters:
        - name: status
          in: query
          schema:
            { type: string, enum: [unverified, verified, rejected], default: unverified }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Resource moderation queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResourceReviewQueue" }
        "400": { description: Invalid moderation filter or pagination value }
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }

  /admin/resources/{id}/verification:
    patch:
      operationId: updateAdminResourceVerification
      tags: [admin]
      summary: Approve, reject, or return a resource to the review queue
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminResourceVerificationInput" }
      responses:
        "200":
          description: Updated moderation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResourceVerificationResult" }
        "400": { description: Invalid state or missing rejection reason }
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }
        "404": { description: Resource not found }

  /admin/resources/verification/bulk:
    post:
      operationId: bulkUpdateAdminResourceVerification
      tags: [admin]
      summary: Apply one moderation decision to a bounded resource batch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminResourceVerificationBulkInput" }
      responses:
        "200":
          description: Number of resources updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResourceVerificationBulkResult" }
        "400": { description: Invalid or oversized batch }
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }

  /learning-goals:
    get:
      operationId: listLearningGoals
      tags: [learning-goals]
      summary: List the current user learning goals
      responses:
        "200":
          description: Learning goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningGoal"
    post:
      operationId: createLearningGoal
      tags: [learning-goals]
      summary: Create a learning goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningGoalInput"
      responses:
        "201":
          description: Created learning goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGoal"

  /learning-goals/{id}:
    patch:
      operationId: updateLearningGoal
      tags: [learning-goals]
      summary: Update a learning goal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningGoalPatch"
      responses:
        "200":
          description: Updated learning goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGoal"
        "404": { description: Goal not found }
    delete:
      operationId: deleteLearningGoal
      tags: [learning-goals]
      summary: Delete a learning goal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Goal deleted }

  # ── Classes ───────────────────────────────────────────────────────────────
  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List classes the current user belongs to
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a new class (teacher only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"

  /classes/{id}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get a class by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassWithMembers"
        "404":
          description: Not found
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Update a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Delete a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /classes/{id}/members:
    get:
      operationId: listClassMembers
      tags: [classes]
      summary: List members of a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassMember"

  /classes/{id}/members/bulk-invite:
    post:
      operationId: bulkInviteClassMembers
      tags: [classes]
      summary: Bulk-add students to a class by email (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInviteInput"
      responses:
        "200":
          description: Bulk invite result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkInviteResult"
        "403":
          description: Not the class teacher

  /classes/{id}/members/{userId}:
    delete:
      operationId: removeClassMember
      tags: [classes]
      summary: Remove a member from a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /classes/{id}/seating-chart:
    get:
      operationId: getSeatingChart
      tags: [classes]
      summary: Get the visual classroom seating chart (class members; private notes only for teacher)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Seating chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingChart"
        "403": { description: Not the class teacher }
    put:
      operationId: updateSeatingChart
      tags: [classes]
      summary: Update classroom dimensions and all student seat assignments (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatingChartInput"
      responses:
        "200":
          description: Updated seating chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingChart"

  /classes/{id}/seating-suggestions:
    post:
      operationId: submitSeatingSuggestion
      tags: [classes]
      summary: Submit a student's seating suggestion to the class teacher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "201":
          description: Suggestion sent to the teacher
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "403": { description: Not a student in this class }

  /classes/{id}/students/{userId}/note:
    put:
      operationId: updateStudentNote
      tags: [classes]
      summary: Save a private teacher note for a student
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentNoteInput"
      responses:
        "200":
          description: Updated student seating record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingStudent"

  /classes/{id}/seating-plan/suggest:
    post:
      operationId: suggestSeatingPlan
      tags: [classes]
      summary: Suggest an explainable seating plan from private teacher notes without applying it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatingPlanSuggestionInput"
      responses:
        "200":
          description: Reviewable seating suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingPlanSuggestion"
        "403": { description: Not the class teacher }
        "402": { description: Casparel Pro subscription required }

  /classes/{id}/student-goals:
    get:
      operationId: listClassStudentGoals
      tags: [learning-goals]
      summary: List learning goals for students in a teacher-owned class
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Student goals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentLearningGoal" }
        "403": { description: Not the class teacher }

  /classes/{id}/student-goals/{goalId}:
    patch:
      operationId: updateClassStudentGoal
      tags: [learning-goals]
      summary: Update a student learning goal as their class teacher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningGoalPatch" }
      responses:
        "200":
          description: Updated student goal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentLearningGoal" }
        "403": { description: Not the class teacher }
        "404": { description: Student goal not found }

  /classes/{id}/resources-list:
    get:
      operationId: getClassResourcesList
      tags: [classes]
      summary: Get the class resources list with items (teachers and members)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class resources list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListWithItems"
        "403":
          description: Not a class member

  /classes/{id}/assign:
    post:
      operationId: assignResourceToClass
      tags: [classes]
      summary: Assign a resource to the class list (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignResourceBody"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignResourceResponse"
        "403":
          description: Not the class teacher
        "404":
          description: Resource not found

  /classes/{id}/resources-list/items/{resourceId}:
    delete:
      operationId: removeClassResource
      tags: [classes]
      summary: Remove a resource from the class list (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: resourceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Not the class teacher

  /classes/{id}/leave:
    delete:
      operationId: leaveClass
      tags: [classes]
      summary: Leave a class; owners transfer ownership to another teacher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Left class }
        "409": { description: Owner must add another teacher first }

  /classes/{id}/resource-recommendations:
    get:
      operationId: listClassResourceRecommendations
      tags: [classes]
      summary: List student resource recommendations
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: "#/components/schemas/ClassResourceRecommendation" }
    post:
      operationId: recommendResourceToClass
      tags: [classes]
      summary: Recommend a resource for teacher approval (students only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ClassResourceRecommendationInput" }
      responses:
        "201":
          description: Recommendation created
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ClassResourceRecommendation" }

  /classes/{id}/resource-recommendations/{recommendationId}:
    patch:
      operationId: reviewClassResourceRecommendation
      tags: [classes]
      summary: Approve or decline a student resource recommendation (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: recommendationId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ClassResourceRecommendationReview" }
      responses:
        "200":
          description: Reviewed recommendation
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ClassResourceRecommendation" }

  /classes/{id}/invitations:
    get:
      operationId: listClassInvitations
      tags: [classes]
      summary: List pending invitations for a class (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassInvitation" }
        "403": { description: Only the class teacher can view invitations }
    post:
      operationId: inviteClassMember
      tags: [classes]
      summary: Invite an existing account to a class by email (teacher only)
      description: >-
        Creates a pending invitation the invitee must accept; role is derived
        from the invitee account, any role sent in the body is ignored.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassInvitationInput" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassInvitation" }
        "403": { description: Only the class teacher can invite members }
        "404": { description: No account with that email }
        "409": { description: This user is already a class member }

  /classes/{id}/join-code:
    get:
      operationId: getClassJoinCode
      tags: [classes]
      summary: Get the class join code (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current join code, null when none has been created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassJoinCode" }
        "403": { description: Only the class teacher can view the join code }
    post:
      operationId: createClassJoinCode
      tags: [classes]
      summary: Create or rotate the class join code (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Newly issued join code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassJoinCodeIssued" }
        "403": { description: Only the class teacher can create a join code }

  /classes/{id}/assignments:
    get:
      operationId: listClassAssignments
      tags: [assignments]
      summary: List assignments visible to a class member or teacher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Class assignments with the current learner's completion state
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassAssignment" }
        "400": { description: Invalid class ID }
        "403": { description: Class access required }
    post:
      operationId: createClassAssignment
      tags: [assignments]
      summary: Assign a resource, activity, or standalone task to a class
      description: Teacher-only. At most one of resourceId and activityId may be set.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateClassAssignmentInput" }
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedClassAssignment" }
        "400": { description: Invalid assignment or linked item }
        "403": { description: Only the class teacher can assign work }

  /classes/{classId}/assignments/{assignmentId}:
    delete:
      operationId: deleteClassAssignment
      tags: [assignments]
      summary: Delete an assignment from a class
      parameters:
        - name: classId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: assignmentId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Assignment deleted }
        "400": { description: Invalid class or assignment ID }
        "403": { description: Only the class teacher can delete assignments }
        "404": { description: Assignment not found }

  /assignments/{id}/completion:
    patch:
      operationId: updateAssignmentCompletion
      tags: [assignments]
      summary: Mark an assignment complete or incomplete for the current learner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentCompletionInput" }
      responses:
        "200":
          description: Updated completion state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignmentCompletionResult" }
        "400": { description: Invalid assignment ID or completion state }
        "403": { description: Assignment access required }

  /assignments/today:
    get:
      operationId: listTodayAssignments
      tags: [assignments]
      summary: List the current learner's class assignments ordered by deadline
      responses:
        "200":
          description: Current learner assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TodayAssignment" }

  /classes/{id}/analytics:
    get:
      operationId: getClassAssignmentAnalytics
      tags: [assignments]
      summary: Summarize assignment completion for a class
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Assignment completion counts and rates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassAssignmentAnalytics" }
        "400": { description: Invalid class ID }
        "403": { description: Only the class teacher can view analytics }

  /workflow/resources/{id}:
    get:
      operationId: getResourceWorkflow
      tags: [workflow]
      summary: Get the current user's workflow state for one resource
      description: Records a daily resource view and derives the next action from saved workflow events.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Resource workflow state and next action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceWorkflowState" }
        "400": { description: Invalid resource ID }
        "404": { description: Resource not found }

  /workflow/continue:
    get:
      operationId: listContinueWorkflows
      tags: [workflow]
      summary: List resumable learning workflows for the current user
      description: Returns at most six incomplete journeys that contain at least one completed workflow step.
      responses:
        "200":
          description: Resumable journeys, newest activity first
          content:
            application/json:
              schema:
                type: array
                maxItems: 6
                items: { $ref: "#/components/schemas/ContinueWorkflowItem" }

  /workflow/continue/{resourceId}:
    delete:
      operationId: dismissWorkflowContinuation
      tags: [workflow]
      summary: Remove a resource journey from the current user's continuation queue
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Current user's workflow events removed }
        "400": { description: Invalid resource ID }

  /classes/join:
    post:
      operationId: joinClassByCode
      tags: [classes]
      summary: Join a class with an 8-character join code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinClassInput" }
      responses:
        "200":
          description: Class joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinedClass" }
        "400": { description: Code is not 8 hex characters }
        "404": { description: Class code not found }

  # ── Class invitations ─────────────────────────────────────────────────────
  /class-invitations:
    get:
      operationId: listMyClassInvitations
      tags: [classes]
      summary: List the current user's pending class invitations
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassInvitation" }

  /class-invitations/{id}:
    patch:
      operationId: respondToClassInvitation
      tags: [classes]
      summary: Accept or decline a pending class invitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ClassInvitationResponseInput" }
      responses:
        "200":
          description: Invitation resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassInvitationResponse" }
        "400": { description: Choose whether to accept or decline }
        "404": { description: Pending invitation not found }

  # ── Resources ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List and search resources
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free-text search
        - name: format
          in: query
          schema:
            type: string
            enum: [article, video, pdf, podcast, interactive, other]
        - name: subject
          in: query
          schema:
            type: string
        - name: gradeLevel
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, top_rated, most_reviewed]
          description: Sort order for results
        - name: minRating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Only return resources with avgRating >= this value
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 50
          description: Maximum number of results to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of results to skip
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    post:
      operationId: createResource
      tags: [resources]
      summary: Submit a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /resources/prefetch:
    post:
      operationId: prefetchResourceMetadata
      tags: [resources]
      summary: Fetch metadata (title, description, format, thumbnail) for a given URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrefetchResourceBody"
      responses:
        "200":
          description: Extracted metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrefetchResourceResponse"
        "400":
          description: Missing or invalid URL
        "502":
          description: Failed to fetch metadata

  /resources/discover:
    get:
      operationId: discoverResources
      tags: [resources]
      summary: Search the stored open-education catalog
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: format
          in: query
          schema:
            type: string
            enum: [article, video, pdf, podcast, interactive, other]
        - name: subject
          in: query
          schema:
            type: string
        - name: gradeLevel
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
            enum: [any, en, es, fr, de, pt, tr]
            default: en
          description: Preferred catalog language, or any to avoid restricting language
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for paginated results
        - name: resultType
          in: query
          schema:
            type: string
            enum: [content, source, people]
            default: content
          description: Return specific learning content, direct publisher websites and channels, or public social, scholarly, or university profiles for people discovery
        - name: intent
          in: query
          schema:
            type: string
            enum: [auto, learn, practice, reference, research, primary-source]
            default: auto
          description: Infer learning intent from the query or apply an explicit intent
        - name: material
          in: query
          schema:
            type: string
            enum:
              [
                all,
                course,
                book,
                explanation,
                practice,
                interactive,
                video,
                reference,
                paper,
                primary-source,
                repository,
                other,
              ]
            default: all
          description: Restrict content discovery to a pedagogical material type
      responses:
        "200":
          description: Educational resources from the stored catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoveredResource"
        "400":
          description: Missing query
        "401":
          description: Sign-in required when the stored catalog has no results and AI discovery is used
        "402":
          description: Casparel Plus or Pro subscription required for AI discovery fallback
        "502":
          description: Search failed

  /resources/recommendations:
    get:
      operationId: getResourceRecommendations
      tags: [resources]
      summary: Get personalised resource recommendations (based on review history if authenticated, top-rated otherwise)
      responses:
        "200":
          description: Recommended resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /resources/featured:
    get:
      operationId: listFeaturedResources
      tags: [resources]
      summary: Get featured and popular resources
      responses:
        "200":
          description: Featured resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /resources/{id}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a resource by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Not found
    patch:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
    delete:
      operationId: deleteResource
      tags: [resources]
      summary: Delete a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /resources/{id}/source-review:
    get:
      operationId: getResourceSourceReview
      tags: [resources]
      summary: Research and summarise the resource's source/uploader
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [quick, deep]
            default: quick
          description: >
            quick — use maintained source provenance without AI;
            deep — authenticated live web research; cached for 90 days and subject to daily/monthly usage limits
      responses:
        "200":
          description: Source review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceReview"
        "404":
          description: Resource not found
        "402":
          description: Casparel Plus or Pro subscription required for deep AI research
        "502":
          description: Source research failed

  # ── Reviews ───────────────────────────────────────────────────────────────
  /resources/{id}/reviews:
    get:
      operationId: listResourceReviews
      tags: [reviews]
      summary: List reviews for a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createResourceReview
      tags: [reviews]
      summary: Submit a review for a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /resources/{id}/reviews/{reviewId}:
    delete:
      operationId: deleteResourceReview
      tags: [reviews]
      summary: Delete a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Resource Lists ─────────────────────────────────────────────────────────
  /resources/{resourceId}/list-memberships:
    get:
      operationId: listResourceListMemberships
      tags: [lists]
      summary: List the current user's learning lists that contain one resource
      parameters:
        - name: resourceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Current live list memberships, newest save first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ResourceListMembership" }
        "400": { description: Invalid resource ID }
        "401": { description: Not authenticated }

  /lists:
    get:
      operationId: listResourceLists
      tags: [lists]
      summary: List resource lists for the current user
      responses:
        "200":
          description: Lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceList"
    post:
      operationId: createResourceList
      tags: [lists]
      summary: Create a new resource list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceListInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"

  /lists/public/{token}:
    get:
      operationId: getPublicResourceList
      tags: [lists]
      summary: Open a publicly shared resource list without an account
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 20, maxLength: 100 }
      responses:
        "200":
          description: Public resource list with verified items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicResourceList"
        "404":
          description: Share link not found or revoked

  /lists/{id}/public-share:
    get:
      operationId: getPublicListShare
      tags: [lists]
      summary: Get the current public-share state as the list owner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current public-share token, or null when private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListShare"
        "403": { description: List owner required }
        "404": { description: List not found }
    post:
      operationId: createPublicListShare
      tags: [lists]
      summary: Create an idempotent public link as the list owner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Existing public link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListShare"
        "201":
          description: Public link created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicListShare"
        "403": { description: List owner required }
        "404": { description: List not found }
    delete:
      operationId: revokePublicListShare
      tags: [lists]
      summary: Revoke the current public link as the list owner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Public link revoked }
        "403": { description: List owner required }
        "404": { description: List not found }

  /lists/{id}:
    get:
      operationId: getResourceList
      tags: [lists]
      summary: Get a resource list with its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource list with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListWithItems"
        "404":
          description: Not found
    patch:
      operationId: updateResourceList
      tags: [lists]
      summary: Update a resource list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceListPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
    delete:
      operationId: deleteResourceList
      tags: [lists]
      summary: Delete a resource list
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /lists/{id}/items:
    post:
      operationId: addListItem
      tags: [lists]
