        - name: subject
          in: query
          schema:
            type: string
          description: Match profile subjects, bio, or grade and department
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
          description: Maximum number of matching accounts to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of matching accounts to skip
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicUser"
        "401":
          description: Not authenticated

  # ── Google Classroom ──────────────────────────────────────────────────────
  /auth/google:
    get:
      operationId: getGCAuthUrl
      tags: [google-classroom]
      summary: Get the Google OAuth authorization URL to connect Google Classroom
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCAuthUrl"
        "503":
          description: Google OAuth not configured
    delete:
      operationId: disconnectGoogle
      tags: [google-classroom]
      summary: Disconnect Google Classroom and revoke tokens
      responses:
        "204":
          description: Disconnected

  /google-classroom/status:
    get:
      operationId: getGCStatus
      tags: [google-classroom]
      summary: Check if the current user has connected Google Classroom
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCStatus"

  /google-classroom/courses:
    get:
      operationId: listGCCourses
      tags: [google-classroom]
      summary: List the teacher's active Google Classroom courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GCCourse"
        "401":
          description: Not connected or token revoked

  /google-classroom/share:
    post:
      operationId: shareToGC
      tags: [google-classroom]
      summary: Post a resource list as an announcement to a Google Classroom course stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GCShareInput"
      responses:
        "200":
          description: Announcement posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCShareResult"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not the list owner or not a teacher

  /google-classroom/import-course:
    post:
      operationId: importGCCourse
      tags: [google-classroom]
      summary: Import a Google Classroom course as a new Casparel class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GCImportInput"
      responses:
        "201":
          description: Casparel class created from the Google Classroom course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not a teacher

  /google-classroom/courses/{courseId}/students:
    get:
      operationId: getGCCourseStudents
      tags: [google-classroom]
      summary: List students enrolled in a Google Classroom course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of enrolled students with EduHub link status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GCRosterStudent"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not a teacher of this course

  # ── Dashboard / Activity ──────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary stats for the current user
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /activity/recent:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed for the current user
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── Calendar ──────────────────────────────────────────────────────────────
  /calendar/status:
    get:
      operationId: getCalendarStatus
      tags: [calendar]
      summary: Get Google Calendar connection status and iCal secret
      responses:
        "200":
          description: Calendar status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarStatus"
        "401":
          description: Not authenticated

  /calendar/ical-url:
    get:
      operationId: getCalendarIcalUrl
      tags: [calendar]
      summary: Get the personal iCal subscription URL
      responses:
        "200":
          description: iCal feed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarIcalUrl"
        "401":
          description: Not authenticated

  /calendar/google/connect:
    get:
      operationId: getCalendarGoogleConnectUrl
      tags: [calendar]
      summary: Get the Google OAuth URL to connect Google Calendar
      responses:
        "200":
          description: OAuth authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarConnectUrl"
        "503":
          description: Google OAuth not configured

  /calendar/google/disconnect:
    delete:
      operationId: disconnectCalendarGoogle
      tags: [calendar]
      summary: Disconnect Google Calendar and remove stored tokens
      responses:
        "204":
          description: Disconnected
        "401":
          description: Not authenticated

  /schedule/{id}/export.ics:
    get:
      operationId: exportScheduleBlockIcs
      tags: [calendar]
      summary: Download a single schedule block as an .ics file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: iCal file
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Not authenticated
        "404":
          description: Block not found

  /study-sessions/{id}/export.ics:
    get:
      operationId: exportStudySessionIcs
      tags: [calendar]
      summary: Download a single study session as an .ics file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: iCal file
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Not authenticated
        "404":
          description: Session not found

  /learning-evidence:
    get:
      operationId: listLearningEvidence
      tags: [learning-goals]
      summary: List comprehension and reflection evidence for the current learner
      responses:
        "200":
          description: Learning evidence, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearningEvidence" }
    post:
      operationId: createLearningEvidence
      tags: [learning-goals]
      summary: Record a post-resource comprehension checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningEvidenceInput" }
      responses:
        "201":
          description: Recorded learning evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningEvidence" }

  /learning-signals:
    get:
      operationId: getLearningSignals
      tags: [learning-goals]
      summary: Get teacher-facing class learning signals from checkpoint evidence
      responses:
        "200":
          description: Aggregated learning signals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningSignals" }
        "403": { description: Teacher role required }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── Auth ────────────────────────────────────────────────────────────────
    User:
      type: object
      required:
        [
          id,
          email,
          name,
          role,
          profileVisibility,
          showBio,
          showSubjects,
          showGradeOrDept,
          showWebsite,
          createdAt,
        ]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
        activeRole: { type: string, enum: [student, teacher] }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        subjects: { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }
        timezone: { type: ["string", "null"] }
        websiteUrl: { type: ["string", "null"] }
        profileVisibility:
          { type: string, enum: [everyone, classmates, private] }
        libraryVisibility:
          { type: string, enum: [everyone, classmates, private] }
        showBio: { type: boolean }
        showSubjects: { type: boolean }
        showGradeOrDept: { type: boolean }
        showWebsite: { type: boolean }
        createdAt: { type: string }

    PublicUser:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
        websiteUrl: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        subjects: { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
        name: { type: string, minLength: 1 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        token: { type: string }

    UserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        profileVisibility:
          { type: string, enum: [everyone, classmates, private] }
        libraryVisibility:
          { type: string, enum: [everyone, classmates, private] }
        showBio: { type: boolean }
        showSubjects: { type: boolean }
        showGradeOrDept: { type: boolean }
        showWebsite: { type: boolean }
        bio: { type: ["string", "null"], maxLength: 300 }
        subjects: { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }
        timezone: { type: ["string", "null"] }
        websiteUrl: { type: ["string", "null"] }

    UserLibrary:
      type: object
      required: [resources, lists]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        lists:
          type: array
          items: { $ref: "#/components/schemas/ResourceList" }

    UserSafetyStatus:
      type: object
      required: [blocked]
      properties:
        blocked: { type: boolean }

    ReportUserInput:
      type: object
      required: [reason]
      properties:
        reason:
          {
            type: string,
            enum: [spam, harassment, impersonation, unsafe_content, other],
          }
        details: { type: ["string", "null"], maxLength: 1000 }

    ReportUserResponse:
      type: object
      required: [received]
      properties:
        received: { type: boolean }

    PresetAvatarInput:
      type: object
      required: [avatarId]
      properties:
        avatarId:
          type: string
          enum:
            [
              cosmic-cat,
              sunny-fox,
              clever-owl,
              ocean-otter,
              mint-panda,
              brave-lion,
              star-bunny,
              purple-koala,
              red-panda,
              sky-penguin,
              green-frog,
              moon-wolf,
            ]

    RoleSwitchInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [student, teacher] }

    AccountUsage:
      type: object
      required: [plan, tier, unlimited, aiSearch, deepResearch, capacity]
      properties:
        plan: { type: string }
        tier:
          description: >-
            Machine-readable tier. Role-specific plans only apply while the
            account's role matches; this field always reports the tier that is
            actually in effect.
          type: string
          enum:
            [
              free,
              plus,
              pro,
              student-plus,
              student-pro,
              teacher-plus,
              teacher-pro,
              institutional,
              administrator,
            ]
        unlimited: { type: boolean }
        aiSearch:
          type: object
          required: [used, limit, window]
          properties:
            used: { type: integer }
            limit: { type: ["integer", "null"] }
            window: { type: string, enum: [day] }
        deepResearch:
          type: object
          required: [used, limit, window]
          properties:
            used: { type: integer }
            limit: { type: ["integer", "null"] }
            window: { type: string, enum: [day] }
        capacity:
          description: >-
            Stored-data allowances for the plan. A null limit means uncapped.
            classMembers reports the per-class roster cap that applies to
            classes this account owns, so its used count is always 0.
          type: object
          required:
            [
              classesOwned,
              classMembers,
              studyActivities,
              resourceLists,
              learningGoals,
              canvases,
            ]
          properties:
            classesOwned: { $ref: "#/components/schemas/CapacityUsage" }
            classMembers: { $ref: "#/components/schemas/CapacityUsage" }
            studyActivities: { $ref: "#/components/schemas/CapacityUsage" }
            resourceLists: { $ref: "#/components/schemas/CapacityUsage" }
            learningGoals: { $ref: "#/components/schemas/CapacityUsage" }
            canvases: { $ref: "#/components/schemas/CapacityUsage" }

    CapacityUsage:
      type: object
      required: [used, limit]
      properties:
        used: { type: integer }
        limit: { type: ["integer", "null"] }

    AdminAiFeatureUsage:
      type: object
      required: [total, month, estimatedCostUsd]
      properties:
        total: { type: integer }
        month: { type: integer }
        estimatedCostUsd: { type: number }

    AdminUserAiUsage:
      type: object
      required:
        [
          userId,
          name,
          email,
          searches,
          quickReviews,
          deepResearch,
          metadata,
          total,
          estimatedCostUsd,
        ]
      properties:
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        searches: { type: integer }
        quickReviews: { type: integer }
        deepResearch: { type: integer }
        metadata: { type: integer }
        total: { type: integer }
        estimatedCostUsd: { type: number }

    AdminOverview:
      type: object
      required:
        [
          users,
          students,
          teachers,
          admins,
          goals,
          resources,
          cachedResearchReports,
          plan,
          usage,
          workflow,
        ]
      properties:
        users: { type: integer }
        students: { type: integer }
        teachers: { type: integer }
        admins: { type: integer }
        goals: { type: integer }
        resources: { type: integer }
        cachedResearchReports: { type: integer }
        plan:
          type: object
          required: [name, status, aiSearchLimit, deepResearchDailyLimit]
          properties:
            name: { type: string }
            status: { type: string, enum: [active] }
            aiSearchLimit: { type: ["integer", "null"] }
            deepResearchDailyLimit: { type: ["integer", "null"] }
        usage:
          type: object
          required:
            [
              aiSearchesToday,
              deepResearchToday,
              totalAiRequests,
              estimatedCostUsd,
              byFeature,
              byUser,
            ]
          properties:
            aiSearchesToday: { type: integer }
            deepResearchToday: { type: integer }
            totalAiRequests: { type: integer }
            estimatedCostUsd: { type: number }
            byFeature:
              type: object
              required: [search, quick-review, deep-research, metadata]
              properties:
                search: { $ref: "#/components/schemas/AdminAiFeatureUsage" }
                quick-review:
                  { $ref: "#/components/schemas/AdminAiFeatureUsage" }
                deep-research:
                  { $ref: "#/components/schemas/AdminAiFeatureUsage" }
                metadata: { $ref: "#/components/schemas/AdminAiFeatureUsage" }
            byUser:
              type: array
              items: { $ref: "#/components/schemas/AdminUserAiUsage" }
        workflow:
          type: object
          required: [funnel, engagement]
          properties:
            funnel:
              type: object
              required:
                [
                  viewed,
                  reviewed,
                  saved,
                  activityCreated,
                  classShared,
                  assignmentCreated,
                  completedJourneys,
                  viewToReviewRate,
                  reviewToSaveRate,
                  saveToActivityRate,
                  activityToClassRate,
                  classToAssignmentRate,
                ]
              properties:
                viewed: { type: integer }
                reviewed: { type: integer }
                saved: { type: integer }
                activityCreated: { type: integer }
                classShared: { type: integer }
                assignmentCreated: { type: integer }
                completedJourneys: { type: integer }
                viewToReviewRate: { type: number }
                reviewToSaveRate: { type: number }
                saveToActivityRate: { type: number }
                activityToClassRate: { type: number }
                classToAssignmentRate: { type: number }
            engagement:
              type: object
              required:
                [
                  activeUsers7d,
                  activeUsers30d,
                  weeklyActiveClasses,
                  avgMinutesToFirstActivity,
                  inviteAcceptanceRate,
                  assignmentCompletionRate,
                  remixRate,
                  teacherApprovalRate,
                  reportsPerThousand,
                  estimatedStoredMb,
                ]
              properties:
                activeUsers7d: { type: integer }
                activeUsers30d: { type: integer }
                weeklyActiveClasses: { type: integer }
                avgMinutesToFirstActivity: { type: number }
                inviteAcceptanceRate: { type: number }
                assignmentCompletionRate: { type: number }
                remixRate: { type: number }
                teacherApprovalRate: { type: number }
                reportsPerThousand: { type: number }
                estimatedStoredMb: { type: number }

    LearningGoal:
      type: object
      required:
        [
          id,
          userId,
          title,
          subject,
          level,
          status,
          pathSteps,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        userId: { type: integer }
        title: { type: string }
        subject: { type: string }
        description: { type: ["string", "null"] }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        preferredFormats:
          type: ["array", "null"]
          items:
            {
              type: string,
              enum: [article, video, pdf, podcast, interactive, other],
            }
        targetDate: { type: ["string", "null"], format: date }
        status: { type: string, enum: [active, paused, completed] }
        pathSteps:
          type: array
          items: { $ref: "#/components/schemas/LearningPathStep" }
        createdAt: { type: string }
        updatedAt: { type: string }

    StudentLearningGoal:
      allOf:
        - $ref: "#/components/schemas/LearningGoal"
        - type: object
          required: [studentName, classId]
          properties:
            studentName: { type: string }
            classId: { type: integer }

    LearningGoalInput:
      type: object
      required: [title, subject, level]
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        subject: { type: string, minLength: 1, maxLength: 100 }
        description: { type: ["string", "null"], maxLength: 1000 }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        preferredFormats:
          type: array
          maxItems: 6
          items:
            {
              type: string,
              enum: [article, video, pdf, podcast, interactive, other],
            }
        targetDate: { type: ["string", "null"], format: date }

    LearningGoalPatch:
      type: object
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        subject: { type: string, minLength: 1, maxLength: 100 }
        description: { type: ["string", "null"], maxLength: 1000 }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        preferredFormats:
          type: ["array", "null"]
          maxItems: 6
          items:
            {
              type: string,
              enum: [article, video, pdf, podcast, interactive, other],
            }
        targetDate: { type: ["string", "null"], format: date }
        status: { type: string, enum: [active, paused, completed] }
        pathSteps:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/LearningPathStep" }

    LearningPathStep:
      type: object
      required: [id, title, query, completed]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 200 }
        query: { type: string, minLength: 1, maxLength: 300 }
        completed: { type: boolean }

    # ── Classes ─────────────────────────────────────────────────────────────
    Class:
      type: object
      required: [id, name, subject, gradeLevel, teacherId, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        subject: { type: string }
        gradeLevel: { type: string }
        description: { type: ["string", "null"] }
        seatingRows: { type: integer }
        seatingColumns: { type: integer }
        teacherId: { type: integer }
        memberCount: { type: integer }
        createdAt: { type: string }

    ClassWithMembers:
      type: object
      required: [id, name, subject, gradeLevel, teacherId, createdAt, members]
      properties:
        id: { type: integer }
        name: { type: string }
        subject: { type: string }
        gradeLevel: { type: string }
        description: { type: ["string", "null"] }
        seatingRows: { type: integer }
        seatingColumns: { type: integer }
        teacherId: { type: integer }
        memberCount: { type: integer }
        createdAt: { type: string }
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClassMember"
        mySeat:
          $ref: "#/components/schemas/MyClassSeat"

    ClassInput:
      type: object
      required: [name, subject, gradeLevel]
      properties:
        name: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1 }
        gradeLevel: { type: string, minLength: 1 }
        description: { type: string }

    ClassPatch:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        subject: { type: string }
        gradeLevel: { type: string }
        description: { type: string }

    MyClassSeat:
      type: object
      required:
        [
          assigned,
          layoutMode,
          row,
          column,
          deskId,
          deskLabel,
          deskSeat,
          relativePosition,
        ]
      properties:
        assigned: { type: boolean }
        layoutMode: { type: string, enum: [grid, custom] }
        row: { type: ["integer", "null"] }
        column: { type: ["integer", "null"] }
        deskId: { type: ["string", "null"] }
        deskLabel: { type: ["string", "null"] }
        deskSeat: { type: ["integer", "null"] }
        relativePosition:
          { type: ["string", "null"], enum: [front, middle, back, null] }

    ClassMember:
      type: object
      required: [userId, classId, role, joinedAt, user]
      properties:
        userId: { type: integer }
        classId: { type: integer }
        role: { type: string, enum: [student, teacher] }
        customRole: { type: ["string", "null"], maxLength: 60 }
        joinedAt: { type: string }
        user: { $ref: "#/components/schemas/PublicUser" }

    ClassroomDesk:
      type: object
      required: [id, shape, x, y, width, height, rotation, capacity, label]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        kind:
          description: >-
            What this element is. Tables (desk) and chairs seat students;
            the teacher place, podium, board and text are room furniture and
            carry no seats.
            Absent means desk, which keeps every stored layout valid.
          type: string
          enum: [desk, chair, teacherDesk, podium, board, text]
        shape:
          { type: string, enum: [rectangle, polygon, round, oval, trapezoid] }
        angle: { type: number, minimum: 25, maximum: 85 }
        sides: { type: integer, minimum: 3, maximum: 12 }
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        width: { type: number, minimum: 4, maximum: 60 }
        height: { type: number, minimum: 4, maximum: 60 }
        rotation: { type: number, minimum: -180, maximum: 180 }
        capacity: { type: integer, minimum: 0, maximum: 8 }
        chairPositions:
          description: >-
            Optional angles for the chairs connected to a desk. Each angle is
            measured around the desk; the chair automatically faces inward.
            The array order matches seating-position indexes.
          type: array
          maxItems: 8
