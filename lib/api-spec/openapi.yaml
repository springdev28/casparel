        subject: { type: ["string", "null"] }
        gradeLevel: { type: ["string", "null"] }
        previewTitle: { type: ["string", "null"] }
        previewDescription: { type: ["string", "null"] }
        previewImageUrl: { type: ["string", "null"] }
        previewAuthor: { type: ["string", "null"] }
        previewPublisher: { type: ["string", "null"] }
        previewPublishedAt: { type: ["string", "null"] }
        previewUpdatedAt: { type: ["string", "null"] }
        previewFaviconUrl: { type: ["string", "null"] }
