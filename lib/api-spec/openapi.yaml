                items:
                  $ref: "#/components/schemas/ResourceList"

  # ── Schedule ──────────────────────────────────────────────────────────────
  /schedule:
    get:
      operationId: listScheduleBlocks
      tags: [schedule]
      summary: List schedule blocks for the current user
      parameters:
        - name: weekStart
          in: query
          schema:
            type: string
            format: date
          description: ISO date of the Monday to load (YYYY-MM-DD)
      responses:
        "200":
          description: Schedule blocks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleBlock"
    post:
      operationId: createScheduleBlock
      tags: [schedule]
      summary: Create a schedule block
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBlockInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleBlock"

  /schedule/{id}:
    patch:
      operationId: updateScheduleBlock
      tags: [schedule]
      summary: Update a schedule block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBlockPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleBlock"
    delete:
      operationId: deleteScheduleBlock
      tags: [schedule]
      summary: Delete a schedule block
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Study Sessions ────────────────────────────────────────────────────────
  # Study activities: the flashcard, quiz and practice sets a person builds
  # from a resource or from scratch. These have been served since the feature
  # shipped and were never described here, so the generated clients could not
  # reach them at all and the phone app -- which has no hand-written API layer
  # -- simply did not have the feature.
  /study-activities:
    get:
      operationId: listStudyActivities
      tags: [study-activities]
      summary: List your own study activities, or a class's
      parameters:
        - name: classId
          in: query
          required: false
          schema: { type: integer }
          description: >-
            A class you belong to or teach. Without it, your own activities in
            the workspace role you are currently in.
      responses:
        "200":
          description: Study activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudyActivity"
        "401": { description: Not authenticated }
        "403": { description: Not a member of this class }
    post:
      operationId: createStudyActivity
      tags: [study-activities]
      summary: Create a study activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyActivityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyActivity"
        "400": { description: Needs a title and at least two complete cards }
        "401": { description: Not authenticated }
        "403": { description: Not a member of this class }

  /study-activities/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    patch:
      operationId: updateStudyActivity
      tags: [study-activities]
      summary: Replace a study activity's title, subject, mode and cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyActivityInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyActivity"
        "400": { description: Invalid study activity }
        "401": { description: Not authenticated }
        "403": { description: Not yours to edit }
        "404": { description: No such activity }
    delete:
      operationId: deleteStudyActivity
      tags: [study-activities]
      summary: Delete a study activity
      responses:
        "204": { description: Deleted }
        "401": { description: Not authenticated }
        "403": { description: Not yours to delete }
        "404": { description: No such activity }

  /study-activities/{id}/copy:
    post:
      operationId: copyStudyActivity
      tags: [study-activities]
      summary: Copy someone else's activity into your own workspace
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Your copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyActivity"
        "400": { description: Invalid activity id }
        "401": { description: Not authenticated }
        "403": { description: You do not have access to this activity }
        "404": { description: No such activity }

  /study-activities/{id}/publish:
    post:
      operationId: publishStudyActivity
      tags: [study-activities]
      summary: Share an activity to the catalogue or the forum
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                destination:
                  type: string
                  enum: [catalog, forum]
                  default: catalog
      responses:
        "201":
          description: Published
          content:
            application/json:
              schema:
                type: object
                required: [materialId, shareToken, destination]
                properties:
                  materialId: { type: integer }
                  shareToken: { type: string }
                  destination:
                    type: string
                    enum: [catalog, forum]
        "401": { description: Not authenticated }
        "404": { description: No such activity }

  /study-activities/shared/{token}:
    get:
      operationId: getSharedStudyActivity
      tags: [study-activities]
      summary: Read a published activity by its share token, without an account
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The shared activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedStudyActivity"
        "404": { description: Shared activity not found }

  /study-sessions:
    get:
      operationId: listStudySessions
      tags: [study-sessions]
      summary: List study sessions for the current user (organised + invited)
      responses:
        "200":
          description: Study sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
    post:
      operationId: createStudySession
      tags: [study-sessions]
      summary: Create a study session and invite participants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated

  /study-sessions/{id}:
    get:
      operationId: getStudySession
      tags: [study-sessions]
      summary: Get a study session by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Study session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
        "403":
          description: Not a participant or organiser
        "404":
          description: Not found
    patch:
      operationId: updateStudySession
      tags: [study-sessions]
      summary: Update a study session (organiser only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
        "403":
          description: Not the organiser
        "404":
          description: Not found
    delete:
      operationId: deleteStudySession
      tags: [study-sessions]
      summary: Cancel a study session (organiser only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cancelled
        "401":
          description: Not authenticated
        "403":
          description: Not the organiser
        "404":
          description: Not found

  /study-sessions/{id}/rsvp:
    patch:
      operationId: rsvpStudySession
      tags: [study-sessions]
      summary: Accept or decline an invitation to a study session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySessionRsvp"
      responses:
        "200":
          description: RSVP recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySessionWithParticipants"
        "401":
          description: Not authenticated
        "403":
          description: Not an invitee
        "404":
          description: Not found

  /users/search:
    get:
      operationId: searchUsers
      tags: [auth]
      summary: Search users who share a class with the requester
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Name search query
        - name: classId
          in: query
          schema:
            type: integer
          description: Restrict to a specific class
        - name: scope
          in: query
          schema:
            type: string
            enum: [shared, all]
            default: shared
          description: Search shared-class users or all discoverable profiles
        - name: role
          in: query
          schema:
            type: string
            enum: [student, teacher]
          description: Filter by student or teacher role
        - name: subject
          in: query
          schema:
            type: string
          description: Match profile subjects, bio, or grade and department
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
          description: Maximum number of matching accounts to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of matching accounts to skip
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicUser"
        "401":
          description: Not authenticated

  # ── Google Classroom ──────────────────────────────────────────────────────
  /auth/google:
    get:
      operationId: getGCAuthUrl
      tags: [google-classroom]
      summary: Get the Google OAuth authorization URL to connect Google Classroom
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCAuthUrl"
        "503":
          description: Google OAuth not configured
    delete:
      operationId: disconnectGoogle
      tags: [google-classroom]
      summary: Disconnect Google Classroom and revoke tokens
      responses:
        "204":
          description: Disconnected

  /google-classroom/status:
    get:
      operationId: getGCStatus
      tags: [google-classroom]
      summary: Check if the current user has connected Google Classroom
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCStatus"

  /google-classroom/courses:
    get:
      operationId: listGCCourses
      tags: [google-classroom]
      summary: List the teacher's active Google Classroom courses
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GCCourse"
        "401":
          description: Not connected or token revoked

  /google-classroom/share:
    post:
      operationId: shareToGC
      tags: [google-classroom]
      summary: Post a resource list as an announcement to a Google Classroom course stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GCShareInput"
      responses:
        "200":
          description: Announcement posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GCShareResult"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not the list owner or not a teacher

  /google-classroom/import-course:
    post:
      operationId: importGCCourse
      tags: [google-classroom]
      summary: Import a Google Classroom course as a new Casparel class
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GCImportInput"
      responses:
        "201":
          description: Casparel class created from the Google Classroom course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not a teacher

  /google-classroom/courses/{courseId}/students:
    get:
      operationId: getGCCourseStudents
      tags: [google-classroom]
      summary: List students enrolled in a Google Classroom course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of enrolled students with EduHub link status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GCRosterStudent"
        "401":
          description: Not connected or token revoked
        "403":
          description: Not a teacher of this course

  # ── Dashboard / Activity ──────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary stats for the current user
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /activity/recent:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed for the current user
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  # ── Calendar ──────────────────────────────────────────────────────────────
  /calendar/status:
    get:
      operationId: getCalendarStatus
      tags: [calendar]
      summary: Get Google Calendar connection status and iCal secret
      responses:
        "200":
          description: Calendar status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarStatus"
        "401":
          description: Not authenticated

  /calendar/ical-url:
    get:
      operationId: getCalendarIcalUrl
      tags: [calendar]
      summary: Get the personal iCal subscription URL
      responses:
        "200":
          description: iCal feed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarIcalUrl"
        "401":
          description: Not authenticated

  /calendar/google/connect:
    get:
      operationId: getCalendarGoogleConnectUrl
      tags: [calendar]
      summary: Get the Google OAuth URL to connect Google Calendar
      responses:
        "200":
          description: OAuth authorization URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarConnectUrl"
        "503":
          description: Google OAuth not configured

  /calendar/google/disconnect:
    delete:
      operationId: disconnectCalendarGoogle
      tags: [calendar]
      summary: Disconnect Google Calendar and remove stored tokens
      responses:
        "204":
          description: Disconnected
        "401":
          description: Not authenticated

  /schedule/{id}/export.ics:
    get:
      operationId: exportScheduleBlockIcs
      tags: [calendar]
      summary: Download a single schedule block as an .ics file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: iCal file
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Not authenticated
        "404":
          description: Block not found

  /study-sessions/{id}/export.ics:
    get:
      operationId: exportStudySessionIcs
      tags: [calendar]
      summary: Download a single study session as an .ics file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: iCal file
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Not authenticated
        "404":
          description: Session not found

  /learning-evidence:
    get:
      operationId: listLearningEvidence
      tags: [learning-goals]
      summary: List comprehension and reflection evidence for the current learner
      responses:
        "200":
          description: Learning evidence, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearningEvidence" }
    post:
      operationId: createLearningEvidence
      tags: [learning-goals]
      summary: Record a post-resource comprehension checkpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningEvidenceInput" }
      responses:
        "201":
          description: Recorded learning evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningEvidence" }

  /learning-signals:
    get:
      operationId: getLearningSignals
      tags: [learning-goals]
      summary: Get teacher-facing class learning signals from checkpoint evidence
      responses:
        "200":
          description: Aggregated learning signals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningSignals" }
        "403": { description: Teacher role required }

  # ── Direct messages ───────────────────────────────────────────────────────
  #
  # Served since the feature shipped and described nowhere, so the generated
  # clients could not reach them and the phone app simply did not have
  # messages. Same shape of gap as study-activities, found the same way: by
  # holding the routes the server registers against the paths this file names.
  # See contractDescribesEveryRoute.test.ts.
  /direct-messages/conversations:
    get:
      operationId: listConversations
      tags: [direct-messages]
      summary: Your conversations, most recently active first
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401": { description: Not authenticated }
    post:
      operationId: openConversation
      tags: [direct-messages]
      summary: Open a conversation with somebody, optionally with a first message
      description: >-
        Returns the existing conversation when there is one. A new conversation
        starts as a request the other person has to accept, unless an
        administrator opens it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenConversationInput"
      responses:
        "201":
          description: The conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400": { description: Choose another user }
        "401": { description: Not authenticated }
        "403": { description: This account is not accepting messages }
        "404": { description: No such user }
        "422": { description: The first message was rejected by proactive safety moderation }
        "503": { description: Message safety moderation is temporarily unavailable }

  /direct-messages/conversations/{id}:
    get:
      operationId: getConversation
      tags: [direct-messages]
      summary: One conversation and its messages
      description: >-
        Reading a conversation marks the other person's messages read, so this
        is not a safe request to repeat for polling.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The conversation, with its messages oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationThread"
        "401": { description: Not authenticated }
        "404": { description: Conversation not found }

  /direct-messages/conversations/{id}/messages:
    post:
      operationId: sendMessage
      tags: [direct-messages]
      summary: Send a message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: The message that was stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectMessage"
        "400": { description: A message is between 1 and 4000 characters }
        "401": { description: Not authenticated }
        "403": { description: Waiting for this request to be accepted }
        "404": { description: Conversation not found }
        "422": { description: The message was rejected by proactive safety moderation }
        "503": { description: Message safety moderation is temporarily unavailable }

  /direct-messages/conversations/{id}/request:
    patch:
      operationId: answerConversationRequest
      tags: [direct-messages]
      summary: Accept or decline a message request somebody sent you
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRequestAnswer"
      responses:
        "200":
          description: The conversation, in its new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400": { description: Choose accept or decline }
        "401": { description: Not authenticated }
        "404": { description: "No such request, or it is not yours to answer" }

  /resources/{id}/recommend:
    post:
      # Not `recommendResource`: there is already a class-level
      # recommendation, and the generated names would collide in any file that
      # does both.
      operationId: recommendResourceToPerson
      tags: [resources]
      summary: Send a resource to one person, with an optional note
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientId]
              properties:
                recipientId: { type: integer }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [sent]
                properties:
                  sent: { type: boolean }
        "400":
          {
            description: "A valid resource and a different recipient are required",
          }
        "401": { description: Not authenticated }
        "404": { description: No such resource or recipient }

  /resources/oembed:
    get:
      operationId: getOembedThumbnail
      tags: [resources]
      summary: A thumbnail for a URL, from the provider's own oEmbed endpoint
      description: >-
        Fetched server-side against a strict hostname allowlist, so the client
        neither picks the provider nor makes the outbound request. A URL from
        anywhere else answers `null` rather than an error: not having a
        thumbnail is a normal outcome, not a failure.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        "200":
          description: The thumbnail, if the provider has one
          content:
            application/json:
              schema:
                type: object
                required: [thumbnailUrl]
                properties:
                  thumbnailUrl: { type: ["string", "null"], format: uri }
        "400":
          { description: "The url is missing, unparseable, or not http(s)" }

  /assignments/today:
    get:
      operationId: listMyAssignments
      tags: [classes]
      summary: Everything set for you across your classes, soonest due first
      description: >-
        Across every class this account belongs to, with the class named on
        each row and whether this account has marked it done. Assignments with
        no due date sort last by when they were set, not first -- an
        undated task is not urgent.
      responses:
        "200":
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignedWork"
        "401": { description: Not authenticated }

  /assignments/{id}/completion:
    patch:
      operationId: setAssignmentCompletion
      tags: [classes]
      summary: Mark an assignment done, or not done after all
      description: >-
        Completion is per person, not per assignment: a teacher marking their
        own copy does not mark it for the class.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean }
      responses:
        "200":
          description: The state it is now in
          content:
            application/json:
              schema:
                type: object
                required: [completed]
                properties:
                  completed: { type: boolean }
        "401": { description: Not authenticated }
        "403": { description: Not a member of the class this belongs to }

  /learning-goal-templates:
    get:
      operationId: listCommunityPaths
      tags: [learning-goals]
      summary: Paths other people have published, most used first
      responses:
        "200":
          description: Community paths
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunityPath"
        "401": { description: Not authenticated }
    post:
      operationId: publishGoalAsPath
      tags: [learning-goals]
      summary: Publish one of your own goals as a path others can clone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goalId]
              properties:
                goalId: { type: integer }
      responses:
        "201":
          description: The published path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPath"
        "400": { description: A valid goal is required }
        "401": { description: Not authenticated }
        "404": { description: "No such goal, or it is not yours" }

  /learning-goal-templates/{id}/clone:
    post:
      operationId: cloneCommunityPath
      tags: [learning-goals]
      summary: Take a copy of somebody's path as a goal of your own
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: The goal this created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGoal"
        "400": { description: Invalid community path }
        "401": { description: Not authenticated }
        "404": { description: Community path not found }

  /users/me/access:
    get:
      operationId: getMyAccess
      tags: [auth]
      summary: Whether this account is allowed to use Casparel at all
      description: >-
        Checked on load, because a ban applied while somebody is signed in has
        to reach them without waiting for their next request to fail. Carries
        the address to appeal to, since being told you are banned and not told
        who to ask is not an answer.
      responses:
        "200":
          description: The account's standing
          content:
            application/json:
              schema:
                type: object
                required: [banned, bannedAt, bannedReason, adminContact]
                properties:
                  banned: { type: boolean }
                  bannedAt: { type: ["string", "null"], format: date-time }
                  bannedReason: { type: ["string", "null"] }
                  adminContact:
                    type: string
                    description: Where to appeal.
        "401": { description: Not authenticated }

  /users/me/preferences:
    get:
      operationId: getMyPreferences
      tags: [auth]
      summary: Everything this account has chosen about how Casparel behaves
      description: >-
        Returns defaults for an account that has never set anything, rather
        than 404, so a client can read this before the user has touched a
        single setting.
      responses:
        "200":
          description: The account's preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "401": { description: Not authenticated }
    patch:
      operationId: updateMyPreferences
      tags: [auth]
      summary: Change some of them
      description: >-
        Only the keys present are changed. Unknown keys are rejected rather
        than ignored, so a typo in a client is a 400 here instead of a setting
        that silently never applies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPatch"
      responses:
        "200":
          description: The preferences, as they now stand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          { description: "A value was out of range, or a key is not known" }
        "401": { description: Not authenticated }
        "413": { description: Preferences payload is too large }

components:
  schemas:
    AssignedWork:
      type: object
      description: >-
        One assignment as the person it was set for sees it -- which is why the
        class is named here rather than left as an id, and why `completed` is
        this account's answer rather than the class's.
      required:
        [
          id,
          classId,
          className,
          title,
          instructions,
          resourceId,
          activityId,
          dueAt,
          completedAt,
          completed,
        ]
      properties:
        id: { type: integer }
        classId: { type: integer }
        className: { type: string }
        title: { type: string }
        instructions: { type: ["string", "null"] }
        resourceId: { type: ["integer", "null"] }
        activityId: { type: ["integer", "null"] }
        dueAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        completed:
          type: boolean
          description: Whether this account has marked it done.

    CommunityPath:
      type: object
      description: >-
        A goal somebody published for other people to clone. `creatorName` is
        stored on the row rather than joined, so a path stays attributed after
        the account that made it is deleted.
      required:
        [
          id,
          creatorId,
          creatorName,
          sourceGoalId,
          title,
          subject,
          description,
          level,
          pathSteps,
          useCount,
          createdAt,
        ]
      properties:
        id: { type: integer }
        creatorId: { type: integer }
        creatorName: { type: string }
        sourceGoalId: { type: integer }
        title: { type: string }
        subject: { type: string }
        description: { type: ["string", "null"] }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        pathSteps:
          type: array
          items:
            type: object
            required: [id, title, query, completed]
            properties:
              id: { type: string }
              title: { type: string }
              query: { type: string }
              completed: { type: boolean }
        useCount: { type: integer }
        createdAt: { type: string, format: date-time }

    InterfaceColors:
      type: object
      required: [background, surface, primary, accent]
      properties:
        background:
          { type: string, pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$" }
        surface: { type: string, pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$" }
        primary: { type: string, pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$" }
        accent: { type: string, pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$" }

    SearchHistoryEntry:
      type: object
      required: [query, searchedAt]
      properties:
        query: { type: string, maxLength: 300 }
        searchedAt: { type: string, format: date-time }
        filters:
          type: object
          description: >-
            What the search ran with. Without it a recent search replays as its
            words alone.
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
              - { type: boolean }

    PendingCheckIn:
      type: object
      required: [concept, prompt]
      properties:
        concept: { type: string, maxLength: 300 }
        prompt: { type: string, maxLength: 600 }

    UserPreferences:
      type: object
      description: >-
        Read by the web app, the phone app and the desktop shell. The phone
        reached it with a hand-rolled fetch for as long as it was undescribed,
        which is what the contract-route test exists to stop.
      # All of them: the server fills every key from a default for an account
      # that has never set anything, so a client never has to tell "absent"
      # from "null". Leaving the nullable ones out of `required` would generate
      # `string | null | undefined` for a field that is only ever the first two.
      required:
        [
          userId,
          language,
          interfaceColors,
          ambientStyle,
          ambientIntensity,
          readNotificationIds,
          dashboardGoalIds,
          continueStudying,
          pendingCheckIns,
          searchHistory,
          resourceSearchState,
          allowMessageRequests,
          tutorialSeen,
          updatedAt,
        ]
      properties:
        userId: { type: integer }
        language:
          type: ["string", "null"]
          enum: [en, tr, null]
          description: >-
            Null when the account has never chosen. A client falls back to the
            device's language then, not to English.
        interfaceColors:
          oneOf:
            - $ref: "#/components/schemas/InterfaceColors"
            - type: "null"
        ambientStyle:
          type: ["string", "null"]
          enum: [off, net, globe, halo, cells, rings, topology, null]
        ambientIntensity: { type: ["number", "null"], minimum: 0.5, maximum: 2 }
        readNotificationIds:
          type: array
          items: { type: integer }
        dashboardGoalIds:
          type: object
          additionalProperties: { type: integer }
        continueStudying:
          type: object
          additionalProperties:
            type: array
            items: { type: integer }
        pendingCheckIns:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PendingCheckIn"
        searchHistory:
          type: array
          items:
            $ref: "#/components/schemas/SearchHistoryEntry"
        resourceSearchState:
          type: ["object", "null"]
          additionalProperties: true
        allowMessageRequests: { type: boolean }
        tutorialSeen: { type: boolean }
        updatedAt: { type: string, format: date-time }

    UserPreferencesPatch:
      type: object
      description: Only the keys present are changed.
      additionalProperties: false
      properties:
        language: { type: string, enum: [en, tr] }
        interfaceColors:
          oneOf:
            - $ref: "#/components/schemas/InterfaceColors"
            - type: "null"
        ambientStyle:
          type: string
          enum: [off, net, globe, halo, cells, rings, topology]
        ambientIntensity: { type: number, minimum: 0.5, maximum: 2 }
        readNotificationIds:
          type: array
          maxItems: 500
          items: { type: integer }
        dashboardGoalIds:
          type: object
          additionalProperties: { type: integer }
        continueStudying:
          type: object
          additionalProperties:
            type: array
            maxItems: 6
            items: { type: integer }
        pendingCheckIns:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/PendingCheckIn"
        searchHistory:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/SearchHistoryEntry"
        resourceSearchState:
          type: ["object", "null"]
          additionalProperties: true
        allowMessageRequests: { type: boolean }
        tutorialSeen: { type: boolean }

    ConversationParticipant:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string }
        avatarUrl: { type: ["string", "null"] }

    DirectMessage:
      type: object
      required: [id, conversationId, senderId, body, isAdminMessage, createdAt]
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        senderId: { type: integer }
        body: { type: string }
        isAdminMessage: { type: boolean }
        readAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }

    Conversation:
      type: object
      required:
        [
          id,
          firstUserId,
          secondUserId,
          requestedById,
          status,
          createdAt,
          updatedAt,
          other,
          lastMessage,
          unreadCount,
          incomingRequest,
        ]
      properties:
        id: { type: integer }
        firstUserId: { type: integer }
        secondUserId: { type: integer }
        requestedById: { type: integer }
        status: { type: string, enum: [pending, accepted, declined] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        other:
          $ref: "#/components/schemas/ConversationParticipant"
        lastMessage:
          oneOf:
            - $ref: "#/components/schemas/DirectMessage"
            - type: "null"
        unreadCount: { type: integer }
        incomingRequest:
          type: boolean
          description: >-
            A pending request somebody else sent you, so it is yours to accept
            or decline rather than one you are waiting on.

    ConversationThread:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/DirectMessage"

    OpenConversationInput:
      type: object
      required: [userId]
      properties:
        userId: { type: integer }
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: An optional first message, sent with the request.

    SendMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }

    ConversationRequestAnswer:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, decline] }

    HealthStatus:
      type: object
      description: >-
        What /healthz answers. It described only `status` while the server sent
        three top-level fields, so anybody reading production health -- which
        is the point of the endpoint -- was reading undocumented JSON and
        guessing at what the values meant.
      required: [status, schema, ai]
      properties:
        status:
          type: string
          description: >-
            "ok" whenever the process can answer at all. The status *code* is
            503 when the schema has failed; this field is deliberately not
            where that distinction lives.
        schema:
          type: object
          description: >-
            Whether migrations have run. A failed migration leaves the server
            able to answer requests while parts of the app are broken, so "ok"
            alone would be misleading.
          required: [state, checkedAt]
          properties:
            state: { type: string, enum: [pending, ready, failed] }
            checkedAt: { type: ["string", "null"], format: date-time }
            error:
              type: string
              description: >-
                Names the missing relation or column. Present only when the
                state is "failed".
        ai:
          $ref: "#/components/schemas/AiHealth"

    AiHealth:
      type: object
      description: >-
        The outcome of the AI calls the product already makes -- no probe, no
        cost -- so a wrong key or an unreachable provider is visible here
        rather than only in a log nobody is tailing. It never changes the
        status code: the catalogue, classes, schedules and the quick source
        check all work without AI.
      required: [state, checkedAt]
      properties:
        state:
          type: string
          enum: [ok, failing, unknown]
        reason:
          type: string
          enum: [never-attempted, last-result-expired]
          description: >-
            Which kind of "unknown", because there are two and they are
            different news: nothing has been attempted since this process
            started, or a result was recorded and has aged out. Present only
            when the state is "unknown". Without it, telling them apart meant
            noticing that checkedAt was null and trusting the implication.
        checkedAt: { type: ["string", "null"], format: date-time }
        lastOperation:
          type: string
          description: The AI call the recorded result came from.
        lastState:
          type: string
          enum: [ok, failing]
          description: >-
            What the aged-out result said. A provider that was failing an hour
            ago is a different starting point from one that was fine.
        error: { type: string }

    # ── Auth ────────────────────────────────────────────────────────────────
    User:
      type: object
      required:
        [
          id,
          email,
          name,
          role,
          profileVisibility,
          showBio,
          showSubjects,
          showGradeOrDept,
          showWebsite,
          createdAt,
        ]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
        activeRole: { type: string, enum: [student, teacher] }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        subjects: { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }
        timezone: { type: ["string", "null"] }
        websiteUrl: { type: ["string", "null"] }
        profileVisibility:
          { type: string, enum: [everyone, classmates, private] }
        libraryVisibility:
          { type: string, enum: [everyone, classmates, private] }
        showBio: { type: boolean }
        showSubjects: { type: boolean }
        showGradeOrDept: { type: boolean }
        showWebsite: { type: boolean }
        createdAt: { type: string }

    PublicUser:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [student, teacher, admin] }
        websiteUrl: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        subjects: { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8 }
        name: { type: string, minLength: 1 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    ResetAccountInput:
      type: object
      additionalProperties: false
      required: [password, confirmation]
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
        confirmation: { type: string, enum: [RESET] }

    DeleteAccountInput:
      type: object
      additionalProperties: false
      required: [password, confirmation]
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
        confirmation: { type: string, enum: [DELETE] }

    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        token: { type: string }

    UserUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        profileVisibility:
          { type: string, enum: [everyone, classmates, private] }
        libraryVisibility:
          { type: string, enum: [everyone, classmates, private] }
        showBio: { type: boolean }
        showSubjects: { type: boolean }
        showGradeOrDept: { type: boolean }
        showWebsite: { type: boolean }
        bio: { type: ["string", "null"], maxLength: 300 }
        subjects: { type: array, items: { type: string }, nullable: true }
        gradeOrDept: { type: ["string", "null"] }
        timezone: { type: ["string", "null"] }
        websiteUrl: { type: ["string", "null"] }

    UserLibrary:
      type: object
      required: [resources, lists]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        lists:
          type: array
          items: { $ref: "#/components/schemas/ResourceList" }

    UserSafetyStatus:
      type: object
      required: [blocked]
      properties:
        blocked: { type: boolean }

    ReportUserInput:
      type: object
      required: [reason]
      properties:
        reason:
          {
            type: string,
            enum: [spam, harassment, impersonation, unsafe_content, other],
          }
        details: { type: ["string", "null"], maxLength: 1000 }

    ReportUserResponse:
      type: object
      required: [received]
      properties:
        received: { type: boolean }

    PresetAvatarInput:
      type: object
      required: [avatarId]
      properties:
        avatarId:
          type: string
          enum:
            [
              cosmic-cat,
              sunny-fox,
              clever-owl,
              ocean-otter,
              mint-panda,
              brave-lion,
              star-bunny,
              purple-koala,
              red-panda,
              sky-penguin,
              green-frog,
              moon-wolf,
            ]

    RoleSwitchInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [student, teacher] }

    AccountUsage:
      type: object
      required: [plan, tier, unlimited, aiSearch, deepResearch, capacity]
      properties:
        plan: { type: string }
        tier:
          description: >-
            Machine-readable tier. Role-specific plans only apply while the
            account's role matches; this field always reports the tier that is
            actually in effect.
          type: string
          enum:
            [
              free,
              plus,
              pro,
              student-plus,
              student-pro,
              teacher-plus,
              teacher-pro,
              institutional,
              administrator,
            ]
        unlimited: { type: boolean }
        aiSearch:
          type: object
          required: [used, limit, window]
          properties:
            used: { type: integer }
            limit: { type: ["integer", "null"] }
            window: { type: string, enum: [day] }
        deepResearch:
          description: >-
            The deep-research allowance and how much of it is spent. `window`
            is the one that actually binds, which is not always a day: Free's
            taste is two reports per rolling thirty days, so telling a free
            account it has "two remaining today" overstates what it has by a
            factor of thirty.
          type: object
          required: [used, limit, window]
          properties:
            used: { type: integer }
            limit: { type: ["integer", "null"] }
            window: { type: string, enum: [day, month] }
        capacity:
          description: >-
            Stored-data allowances for the plan. A null limit means uncapped.
            classMembers reports the per-class roster cap that applies to
            classes this account owns, so its used count is always 0.
          type: object
          required:
            [
              classesOwned,
              classMembers,
              studyActivities,
              resourceLists,
              learningGoals,
              canvases,
            ]
          properties:
            classesOwned: { $ref: "#/components/schemas/CapacityUsage" }
            classMembers: { $ref: "#/components/schemas/CapacityUsage" }
            studyActivities: { $ref: "#/components/schemas/CapacityUsage" }
            resourceLists: { $ref: "#/components/schemas/CapacityUsage" }
            learningGoals: { $ref: "#/components/schemas/CapacityUsage" }
            canvases: { $ref: "#/components/schemas/CapacityUsage" }

    CapacityUsage:
      type: object
      required: [used, limit]
      properties:
        used: { type: integer }
        limit: { type: ["integer", "null"] }

    AdminAiFeatureUsage:
      type: object
      required: [total, month, estimatedCostUsd]
      properties:
        total: { type: integer }
        month: { type: integer }
        estimatedCostUsd: { type: number }

    AdminUserAiUsage:
      type: object
      required:
        [
          userId,
          name,
          email,
          searches,
          quickReviews,
          deepResearch,
          metadata,
          total,
          estimatedCostUsd,
        ]
      properties:
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        searches: { type: integer }
        quickReviews: { type: integer }
        deepResearch: { type: integer }
        metadata: { type: integer }
        total: { type: integer }
        estimatedCostUsd: { type: number }

    AdminOverview:
      type: object
      required:
        [
          users,
          students,
          teachers,
          admins,
          goals,
          resources,
          cachedResearchReports,
          plan,
          usage,
          workflow,
        ]
      properties:
        users: { type: integer }
        students: { type: integer }
        teachers: { type: integer }
        admins: { type: integer }
        goals: { type: integer }
        resources: { type: integer }
        cachedResearchReports: { type: integer }
        plan:
          type: object
          required: [name, status, aiSearchLimit, deepResearchDailyLimit]
          properties:
            name: { type: string }
            status: { type: string, enum: [active] }
            aiSearchLimit: { type: ["integer", "null"] }
            deepResearchDailyLimit: { type: ["integer", "null"] }
        usage:
          type: object
          required:
            [
              aiSearchesToday,
              deepResearchToday,
              totalAiRequests,
              estimatedCostUsd,
              byFeature,
              byUser,
            ]
          properties:
            aiSearchesToday: { type: integer }
            deepResearchToday: { type: integer }
            totalAiRequests: { type: integer }
            estimatedCostUsd: { type: number }
            byFeature:
              type: object
              required: [search, quick-review, deep-research, metadata]
              properties:
                search: { $ref: "#/components/schemas/AdminAiFeatureUsage" }
                quick-review:
                  { $ref: "#/components/schemas/AdminAiFeatureUsage" }
                deep-research:
                  { $ref: "#/components/schemas/AdminAiFeatureUsage" }
                metadata: { $ref: "#/components/schemas/AdminAiFeatureUsage" }
            byUser:
              type: array
              items: { $ref: "#/components/schemas/AdminUserAiUsage" }
        workflow:
          type: object
          required: [funnel, engagement]
          properties:
            funnel:
              type: object
              required:
                [
                  viewed,
                  reviewed,
                  saved,
                  activityCreated,
                  classShared,
                  assignmentCreated,
                  completedJourneys,
                  viewToReviewRate,
                  reviewToSaveRate,
                  saveToActivityRate,
                  activityToClassRate,
                  classToAssignmentRate,
                ]
              properties:
                viewed: { type: integer }
                reviewed: { type: integer }
                saved: { type: integer }
                activityCreated: { type: integer }
                classShared: { type: integer }
                assignmentCreated: { type: integer }
                completedJourneys: { type: integer }
                viewToReviewRate: { type: number }
                reviewToSaveRate: { type: number }
                saveToActivityRate: { type: number }
                activityToClassRate: { type: number }
                classToAssignmentRate: { type: number }
            engagement:
              type: object
              required:
                [
                  activeUsers7d,
                  activeUsers30d,
                  weeklyActiveClasses,
                  avgMinutesToFirstActivity,
                  inviteAcceptanceRate,
                  assignmentCompletionRate,
                  remixRate,
                  teacherApprovalRate,
                  reportsPerThousand,
                  estimatedStoredMb,
                ]
              properties:
                activeUsers7d: { type: integer }
                activeUsers30d: { type: integer }
                weeklyActiveClasses: { type: integer }
                avgMinutesToFirstActivity: { type: number }
                inviteAcceptanceRate: { type: number }
                assignmentCompletionRate: { type: number }
                remixRate: { type: number }
                teacherApprovalRate: { type: number }
                reportsPerThousand: { type: number }
                estimatedStoredMb: { type: number }

    LearningGoal:
      type: object
      required:
        [
          id,
          userId,
          title,
          subject,
          level,
          status,
          pathSteps,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: integer }
        userId: { type: integer }
        title: { type: string }
        subject: { type: string }
        description: { type: ["string", "null"] }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        preferredFormats:
          type: ["array", "null"]
          items:
            {
              type: string,
              enum: [article, video, pdf, podcast, interactive, other],
            }
        targetDate: { type: ["string", "null"], format: date }
        status: { type: string, enum: [active, paused, completed] }
        pathSteps:
          type: array
          items: { $ref: "#/components/schemas/LearningPathStep" }
        createdAt: { type: string }
        updatedAt: { type: string }

    StudentLearningGoal:
      allOf:
        - $ref: "#/components/schemas/LearningGoal"
        - type: object
          required: [studentName, classId]
          properties:
            studentName: { type: string }
            classId: { type: integer }

    LearningGoalInput:
      type: object
      required: [title, subject, level]
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        subject: { type: string, minLength: 1, maxLength: 100 }
        description: { type: ["string", "null"], maxLength: 1000 }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        preferredFormats:
          type: array
          maxItems: 6
          items:
            {
              type: string,
              enum: [article, video, pdf, podcast, interactive, other],
            }
        targetDate: { type: ["string", "null"], format: date }

    LearningGoalPatch:
      type: object
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        subject: { type: string, minLength: 1, maxLength: 100 }
        description: { type: ["string", "null"], maxLength: 1000 }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        preferredFormats:
          type: ["array", "null"]
          maxItems: 6
          items:
            {
              type: string,
              enum: [article, video, pdf, podcast, interactive, other],
            }
        targetDate: { type: ["string", "null"], format: date }
        status: { type: string, enum: [active, paused, completed] }
        pathSteps:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/LearningPathStep" }

    LearningPathStep:
      type: object
      required: [id, title, query, completed]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, minLength: 1, maxLength: 200 }
        query: { type: string, minLength: 1, maxLength: 300 }
        completed: { type: boolean }

    # ── Classes ─────────────────────────────────────────────────────────────
    Class:
      type: object
      required: [id, name, subject, gradeLevel, teacherId, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        subject: { type: string }
        gradeLevel: { type: string }
        description: { type: ["string", "null"] }
        seatingRows: { type: integer }
        seatingColumns: { type: integer }
        teacherId: { type: integer }
        memberCount: { type: integer }
        createdAt: { type: string }

    ClassWithMembers:
      type: object
      required: [id, name, subject, gradeLevel, teacherId, createdAt, members]
      properties:
        id: { type: integer }
        name: { type: string }
        subject: { type: string }
        gradeLevel: { type: string }
        description: { type: ["string", "null"] }
        seatingRows: { type: integer }
        seatingColumns: { type: integer }
        teacherId: { type: integer }
        memberCount: { type: integer }
        createdAt: { type: string }
        members:
          type: array
          items:
            $ref: "#/components/schemas/ClassMember"
        mySeat:
          $ref: "#/components/schemas/MyClassSeat"

    ClassInput:
      type: object
      required: [name, subject, gradeLevel]
      properties:
        name: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1 }
        gradeLevel: { type: string, minLength: 1 }
        description: { type: string }

    ClassPatch:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        subject: { type: string }
        gradeLevel: { type: string }
        description: { type: string }

    MyClassSeat:
      type: object
      required:
        [
          assigned,
          layoutMode,
          row,
          column,
          deskId,
          deskLabel,
          deskSeat,
          relativePosition,
        ]
      properties:
        assigned: { type: boolean }
        layoutMode: { type: string, enum: [grid, custom] }
        row: { type: ["integer", "null"] }
        column: { type: ["integer", "null"] }
        deskId: { type: ["string", "null"] }
        deskLabel: { type: ["string", "null"] }
        deskSeat: { type: ["integer", "null"] }
        relativePosition:
          { type: ["string", "null"], enum: [front, middle, back, null] }

    ClassMember:
      type: object
      required: [userId, classId, role, joinedAt, user]
      properties:
        userId: { type: integer }
        classId: { type: integer }
        role: { type: string, enum: [student, teacher] }
        customRole: { type: ["string", "null"], maxLength: 60 }
        joinedAt: { type: string }
        user: { $ref: "#/components/schemas/PublicUser" }

    ClassroomDesk:
      type: object
      required: [id, shape, x, y, width, height, rotation, capacity, label]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        kind:
          description: >-
            What this element is. Tables (desk) and chairs seat students;
            the teacher place, podium, board and text are room furniture and
            carry no seats.
            Absent means desk, which keeps every stored layout valid.
          type: string
          enum: [desk, chair, teacherDesk, podium, board, text]
        shape:
          { type: string, enum: [rectangle, polygon, round, oval, trapezoid] }
        angle: { type: number, minimum: 25, maximum: 85 }
        sides: { type: integer, minimum: 3, maximum: 12 }
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        width: { type: number, minimum: 4, maximum: 60 }
        height: { type: number, minimum: 4, maximum: 60 }
        rotation: { type: number, minimum: -180, maximum: 180 }
        capacity: { type: integer, minimum: 0, maximum: 8 }
        chairPositions:
          description: >-
            Optional angles for the chairs connected to a desk. Each angle is
            measured around the desk; the chair automatically faces inward.
            The array order matches seating-position indexes.
          type: array
          maxItems: 8
          items: { type: number, minimum: -180, maximum: 180 }
        label: { type: string, maxLength: 80 }
        text: { type: ["string", "null"], maxLength: 300 }

    SeatingStudent:
      type: object
      required: [userId, name]
      properties:
        userId: { type: integer }
        name: { type: string }
        avatarUrl: { type: ["string", "null"] }
        gradeOrDept: { type: ["string", "null"] }
        teacherNote: { type: ["string", "null"] }
        customRole: { type: ["string", "null"], maxLength: 60 }
        seatRow: { type: ["integer", "null"] }
        seatColumn: { type: ["integer", "null"] }
        seatDeskId: { type: ["string", "null"] }
        seatPosition: { type: ["integer", "null"] }

    SeatingChart:
      type: object
      required: [classId, rows, columns, layoutMode, desks, students]
      properties:
        classId: { type: integer }
        rows: { type: integer }
        columns: { type: integer }
        layoutMode: { type: string, enum: [grid, custom] }
        desks:
          type: array
          items: { $ref: "#/components/schemas/ClassroomDesk" }
        students:
          type: array
          items: { $ref: "#/components/schemas/SeatingStudent" }

    SeatingPlanSuggestionInput:
      type: object
      properties:
        priorities: { type: ["string", "null"], maxLength: 1000 }

    ExplainedSeatingAssignment:
      type: object
      required: [userId, row, column, deskId, deskSeat, reason]
      properties:
        userId: { type: integer }
        row: { type: ["integer", "null"] }
        column: { type: ["integer", "null"] }
        deskId: { type: ["string", "null"] }
        deskSeat: { type: ["integer", "null"] }
        reason: { type: string }

    SeatingPlanSuggestion:
      type: object
      required:
        [rows, columns, layoutMode, desks, summary, considerations, assignments]
      properties:
        rows: { type: integer }
        columns: { type: integer }
        layoutMode: { type: string, enum: [grid, custom] }
        desks:
          type: array
          items: { $ref: "#/components/schemas/ClassroomDesk" }
        summary: { type: string }
        considerations:
          type: array
          items: { type: string }
        assignments:
          type: array
          items: { $ref: "#/components/schemas/ExplainedSeatingAssignment" }

    SeatingAssignment:
      type: object
      required: [userId]
      properties:
        userId: { type: integer }
        row: { type: ["integer", "null"] }
        column: { type: ["integer", "null"] }
        deskId: { type: ["string", "null"] }
        deskSeat: { type: ["integer", "null"] }

    SeatingChartInput:
      type: object
      required: [rows, columns, layoutMode, desks, assignments]
      properties:
        rows: { type: integer, minimum: 1, maximum: 10 }
        columns: { type: integer, minimum: 1, maximum: 10 }
        layoutMode: { type: string, enum: [grid, custom] }
        desks:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/ClassroomDesk" }
        assignments:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/SeatingAssignment" }

    StudentNoteInput:
      type: object
      required: [note]
      properties:
        note: { type: ["string", "null"], maxLength: 2000 }

    StudentRoleInput:
      type: object
      required: [role]
      properties:
        role: { type: ["string", "null"], maxLength: 60 }

    ClassMemberInput:
      type: object
      required: [email]
      properties:
        email: { type: string }
        role: { type: string, enum: [student, teacher] }

    # ── Resources ───────────────────────────────────────────────────────────
    PrefetchResourceBody:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1 }

    PrefetchResourceResponse:
      type: object
      required: [title, description, format]
      properties:
        title: { type: string }
        description: { type: string }
        format:
          {
            type: string,
            enum: [article, video, pdf, podcast, interactive, other],
          }
        thumbnailUrl: { type: ["string", "null"] }

    ProvenanceShowcaseEntry:
      type: object
      description: >-
        One source and what the provenance check says about it. Mirrors the
        registry-based classification used on resource pages; never AI output.
      required:
        [id, title, host, provenanceLevel, provenanceSignals, savedCount]
      properties:
        id: { type: integer }
        title: { type: string }
        host:
          type: string
          description: Display host, e.g. "ocw.mit.edu".
        subject: { type: ["string", "null"] }
        provenanceLevel:
          type: string
          enum: [institutional, established, independent, unknown]
        provenanceSignals:
          type: array
          items: { type: string }
        savedCount:
          type: integer
          description: How many lists across the platform hold this resource.
        language:
          type: ["string", "null"]
          description: >-
            The source's language as read from its address, or null when the
            address does not say. Null is not "English": it means the language
            was not established, and a client should not claim one.

    Resource:
      type: object
      required:
        [
          id,
          title,
          url,
          format,
          subject,
          gradeLevel,
          submittedById,
          avgRating,
          reviewCount,
          createdAt,
        ]
      properties:
        id: { type: integer }
        title: { type: string }
        url: { type: string }
        description: { type: ["string", "null"] }
        format:
          {
            type: string,
            enum: [article, video, pdf, podcast, interactive, other],
          }
        subject: { type: string }
        gradeLevel: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        submittedById: { type: integer }
        avgRating: { type: number }
        reviewCount: { type: integer }
        createdAt: { type: string }
        # Trust state for user-submitted resources. Optional so that older
        # producers and cached clients keep working; computed server-side and
        # never accepted from the client (absent from ResourceInput).
        verificationStatus:
          { type: string, enum: [unverified, verified, rejected] }
        verificationNote: { type: ["string", "null"] }

    ResourceInput:
      type: object
      required: [title, url, format, subject, gradeLevel]
      properties:
        title: { type: string, minLength: 1 }
        url: { type: string, minLength: 1 }
        description: { type: string }
        format:
          {
            type: string,
            enum: [article, video, pdf, podcast, interactive, other],
          }
        subject: { type: string, minLength: 1 }
        gradeLevel: { type: string, minLength: 1 }
        thumbnailUrl: { type: string }

    ResourcePatch:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        format:
          {
            type: string,
            enum: [article, video, pdf, podcast, interactive, other],
          }
        subject: { type: string }
        gradeLevel: { type: string }
        thumbnailUrl: { type: string }

    DiscoveredResource:
      type: object
      required: [title, url, description, format, source]
      properties:
        title: { type: string }
        url: { type: string }
        description: { type: string }
        format:
          {
            type: string,
            enum: [article, video, pdf, podcast, interactive, other],
          }
        source: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        subject: { type: ["string", "null"] }
        gradeLevel: { type: ["string", "null"] }
        language:
          {
            type: ["string", "null"],
            enum: [en, es, fr, de, pt, tr, multilingual, other, null],
          }

        cursor:
          type: string
          description: >-
            Where this result sits in the ranking for the query that returned it.
            Sortable as plain text, so a client asking for more results sends
            back the largest cursor it holds as the `after` parameter. Absent on
            results that did not come from the stored catalog.
        catalogId:
          type: integer
          description: >-
            The stored catalog row this result came from. A client asking for more
            results sends back the largest one it holds as `sinceId`, so works
            stored while it was reading are offered even though they rank above
            the point it has read to. Absent on results that did not come from the
            stored catalog.
        provenanceLevel:
          {
            type: string,
            enum: [institutional, established, independent, unknown],
          }
        provenanceSignals:
          type: array
          items: { type: string }
        linkChecked: { type: boolean }
        checkedAt: { type: string }
    SourceReviewLink:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string }

    SourceReviewMention:
      type: object
      required: [summary, url, sourceType, sentiment]
      properties:
        summary: { type: string }
        url: { type: string, format: uri }
        sourceType:
          {
            type: string,
            enum: [forum, comments, review, article, social, official, other],
          }
        sentiment: { type: string, enum: [positive, mixed, negative, neutral] }

    SourceReview:
      type: object
      required: [sourceName, sourceType, summary, trustLevel, mode]
      properties:
        sourceName: { type: string }
        sourceType: { type: string }
        description: { type: ["string", "null"] }
        founded: { type: ["string", "null"] }
        headquarters: { type: ["string", "null"] }
        trustLevel: { type: string, enum: [high, medium, low, unknown] }
        trustReason: { type: ["string", "null"] }
        summary: { type: string }
        reputationAnalysis: { type: ["string", "null"] }
        audienceSentiment: { type: ["string", "null"] }
        contentQuality: { type: ["string", "null"] }
        currencyAssessment: { type: ["string", "null"] }
        researchScope: { type: ["string", "null"] }
        strengths:
          type: array
          items: { type: string }
        concerns:
          type: array
          items: { type: string }
        limitations:
          type: array
          items: { type: string }
        links:
          type: array
          items:
            $ref: "#/components/schemas/SourceReviewLink"
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/SourceReviewMention"
        mode: { type: string, enum: [quick, deep] }

    # ── Reviews ─────────────────────────────────────────────────────────────
    Review:
      type: object
      required: [id, resourceId, userId, rating, createdAt, user]
      properties:
        id: { type: integer }
        resourceId: { type: integer }
        userId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: ["string", "null"] }
        createdAt: { type: string }
        user: { $ref: "#/components/schemas/PublicUser" }

    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }

    AssignResourceBody:
      type: object
      required: [resourceId]
      properties:
        resourceId: { type: integer }

    AssignResourceResponse:
      type: object
      required: [listId]
      properties:
        listId: { type: integer }

    # ── Resource Lists ───────────────────────────────────────────────────────
    ResourceList:
      type: object
      required: [id, name, ownerId, itemCount, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        ownerId: { type: integer }
        classId: { type: ["integer", "null"] }
        itemCount: { type: integer }
        createdAt: { type: string }

    ResourceListWithItems:
      type: object
      required: [id, name, ownerId, itemCount, createdAt, items]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        ownerId: { type: integer }
        classId: { type: ["integer", "null"] }
        itemCount: { type: integer }
        createdAt: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ListItem"

    ResourceListInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }

    ResourceListPatch:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }

    ListItem:
      type: object
      required: [id, listId, resourceId, addedAt, position, resource]
      properties:
        id: { type: integer }
        listId: { type: integer }
        resourceId: { type: integer }
        note: { type: ["string", "null"] }
        addedAt: { type: string }
        position: { type: integer }
        resource: { $ref: "#/components/schemas/Resource" }
        alreadyPresent:
          type: boolean
          description: >-
            Present on add responses. True means the resource was already in
            the list and the existing item was returned without changing order.

    ListItemInput:
      type: object
      required: [resourceId]
      properties:
        resourceId: { type: integer }
        note: { type: string }

    ReorderListItemsInput:
      type: object
      required: [itemIds]
      properties:
        itemIds:
          type: array
          items: { type: integer }
          description: Ordered array of list item IDs — first element gets position 0

    ShareListInput:
      type: object
      required: [classId]
      properties:
        classId: { type: integer }

    # ── Study Sessions ───────────────────────────────────────────────────────
    StudySessionParticipant:
      type: object
      required: [userId, status]
      properties:
        userId: { type: integer }
        status: { type: string, enum: [pending, accepted, declined] }
        name: { type: ["string", "null"] }
        avatarUrl: { type: ["string", "null"] }
        respondedAt: { type: ["string", "null"] }

    StudySession:
      type: object
      required:
        [
          id,
          organizerId,
          title,
          startsAt,
          durationMinutes,
          meetingUrl,
          createdAt,
        ]
      properties:
        id: { type: integer }
        organizerId: { type: integer }
        title: { type: string }
        startsAt: { type: string }
        durationMinutes: { type: integer }
        topic: { type: ["string", "null"] }
        resourceId: { type: ["integer", "null"] }
        meetingUrl: { type: string }
        createdAt: { type: string }

    StudySessionWithParticipants:
      allOf:
        - $ref: "#/components/schemas/StudySession"
        - type: object
          required: [participants, myStatus]
          properties:
            participants:
              type: array
              items:
                $ref: "#/components/schemas/StudySessionParticipant"
            myStatus: { type: ["string", "null"] }

    # One card in a study activity. `choices` and `correctChoiceIndex` are only
    # meaningful for the quiz modes; flashcards carry a term and an answer.
    StudyActivityCard:
      type: object
      required: [id, term, answer]
      properties:
        id: { type: string, maxLength: 80 }
        term: { type: string, maxLength: 500 }
        answer: { type: string, maxLength: 1000 }
        choices:
          type: array
          items: { type: string }
        correctChoiceIndex: { type: integer }
        imageData: { type: ["string", "null"] }
        imageAlt: { type: ["string", "null"] }

    StudyActivity:
      type: object
      required:
        [id, ownerId, workspaceRole, title, mode, cards, createdAt, updatedAt]
      properties:
        id: { type: integer }
        ownerId: { type: integer }
        workspaceRole: { type: string, enum: [student, teacher] }
        classId: { type: ["integer", "null"] }
        title: { type: string }
        subject: { type: ["string", "null"] }
        mode:
          type: string
          enum:
            [
              all,
              flashcards,
              practice,
              quiz,
              true-false,
              match,
              scramble,
              missing-word,
              random,
            ]
        shareToken: { type: ["string", "null"] }
        cards:
          type: array
          items: { $ref: "#/components/schemas/StudyActivityCard" }
        createdAt: { type: string }
        updatedAt: { type: string }

    # What a reader without an account gets: the set itself, and nothing about
    # who owns it or which class it belongs to.
    SharedStudyActivity:
      type: object
      required: [id, title, mode, cards, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        subject: { type: ["string", "null"] }
        mode:
          type: string
          enum:
            [
              all,
              flashcards,
              practice,
              quiz,
              true-false,
              match,
              scramble,
              missing-word,
              random,
            ]
        classId: { type: ["integer", "null"] }
        cards:
          type: array
          items: { $ref: "#/components/schemas/StudyActivityCard" }
        createdAt: { type: string }
        updatedAt: { type: string }

    StudyActivityInput:
      type: object
      required: [title, cards]
      properties:
        title: { type: string, minLength: 2, maxLength: 160 }
        subject: { type: string }
        mode:
          type: string
          enum:
            [
              all,
              flashcards,
              practice,
              quiz,
              true-false,
              match,
              scramble,
              missing-word,
              random,
            ]
          default: flashcards
        classId: { type: ["integer", "null"] }
        sourceResourceId: { type: integer }
        sourceActivityId: { type: integer }
        remixedFromActivityId: { type: integer }
        cards:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/StudyActivityCard" }

    StudySessionInput:
      type: object
      required: [title, startsAt, durationMinutes, meetingUrl]
      properties:
        title: { type: string, minLength: 1 }
        startsAt: { type: string }
        durationMinutes: { type: integer, minimum: 5 }
        topic: { type: string }
        resourceId: { type: integer }
        meetingUrl: { type: string, minLength: 1, pattern: "^https?://" }
