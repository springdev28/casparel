  # ── Resources ─────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
  /resources:
    get:
      operationId: listResources
      tags: [resources]
      summary: List and search resources
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Free-text search
        - name: format
          in: query
          schema:
            type: string
            enum: [article, video, pdf, podcast, interactive, other]
        - name: subject
          in: query
          schema:
            type: string
        - name: gradeLevel
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [newest, top_rated, most_reviewed]
          description: Sort order for results
        - name: minRating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Only return resources with avgRating >= this value
        - name: exactPhrase
          in: query
          schema:
            type: string
          description: Title, description or subject must contain this phrase, truncated to 160 characters
        - name: exclude
          in: query
          schema:
            type: string
          description: Space-separated words to exclude, truncated to 160 characters; the first eight are applied
        - name: source
          in: query
          schema:
            type: string
          description: Restrict to resources whose link contains this text, truncated to 160 characters
        - name: excludeSource
          in: query
          schema:
            type: string
          description: Drop resources whose link contains this text, truncated to 160 characters
        - name: dateAdded
          in: query
          schema:
            type: string
            enum: [week, month, year]
          description: Only resources added within this window
        - name: minReviews
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
          description: Minimum number of reviews
        - name: hasThumbnail
          in: query
          schema:
            type: boolean
          description: Require, or require the absence of, a thumbnail. Sent as the string true or false
        - name: librarySort
          in: query
          schema:
            type: string
          description: Secondary ordering applied within the library listing
        - name: verification
          in: query
          schema:
            type: string
            enum: [pending, rejected]
          description: >-
            Narrow to the caller's own submissions awaiting review or rejected.
            Asking for anyone else's returns nothing rather than leaking them
        - name: limit
          in: query
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 50
          description: Maximum number of results to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of results to skip
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
    post:
      operationId: createResource
      tags: [resources]
      summary: Submit a new resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "200":
          description: The resource was already present in this user's library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"

  /resources/prefetch:
    post:
      operationId: prefetchResourceMetadata
      tags: [resources]
      summary: Fetch metadata (title, description, format, thumbnail) for a given URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrefetchResourceBody"
      responses:
        "200":
          description: Extracted metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrefetchResourceResponse"
        "400":
          description: Missing or invalid URL
        "502":
          description: Failed to fetch metadata

  /resources/discover:
    get:
      operationId: discoverResources
      tags: [resources]
      summary: Search the stored catalog and, when requested, the live public web
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          description: Search query. Blank queries are rejected with 400
        - name: format
          in: query
          schema:
            type: string
          description: >-
            Formats wanted, comma-separated from article, video, pdf, podcast,
            interactive and other. One value behaves as it always did; several
            widen, because a reader who wants a video or a pdf should not have
            to search twice
        - name: subject
          in: query
          schema:
            type: string
        - name: gradeLevel
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: string
            enum: [any, en, es, fr, de, pt, tr]
            default: en
          description: Required result language, or any to allow all languages
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: >-
            Page number. Each page resumes where the previous one ended, so a
            page past the stored results returns an empty list rather than
            repeating earlier ones
        - name: resultType
          in: query
          schema:
            type: string
            enum: [content, source, people]
            default: content
          description: Return specific learning content, direct publisher websites and channels, or public social, scholarly, or university profiles for people discovery
        - name: includeWeb
          in: query
          schema: { type: boolean, default: false }
          description: >-
            Search the live public web in addition to the stored catalog. Signed-in
            requests use their AI discovery allowance; anonymous requests continue
            to receive stored-catalog results without spending AI capacity.
        - name: exactPhrase
          in: query
          schema:
            type: string
          description: Title or description must contain this phrase, truncated to 160 characters
        - name: exclude
          in: query
          schema:
            type: string
          description: Space-separated words to exclude, truncated to 160 characters; the first eight are applied
        - name: source
          in: query
          schema:
            type: string
          description: Restrict to providers whose name contains this text, truncated to 160 characters
        - name: excludeSource
          in: query
          schema:
            type: string
          description: >-
            Drop results whose provider, link or provider site contains this
            text, truncated to 160 characters. Matched against all three so
            "Wikipedia" and "wikipedia.org" exclude the same results
        - name: material
          in: query
          schema:
            type: string
          description: >-
            Kinds of material wanted, comma-separated: book, course, reference,
            paper, primary, video. The catalog holds all six and a revision
            search and a research search want opposite ends of that list. Results stored
            before their source declared a material are absent from a filtered
            result rather than guessed into one
        - name: excludeSubjects
          in: query
          schema:
            type: string
          description: >-
            Comma-separated subjects to drop, up to twelve. Distinct from
            `exclude`, which matches anywhere: this one is about how a work is
            filed
        - name: author
          in: query
          schema:
            type: string
          description: Author or contributor name to match, truncated to 160 characters
        - name: titleOnly
          in: query
          schema:
            type: boolean
          description: >-
            Require the query to match a work's own title or subject rather than
            its description, so the topic is what the work is about instead of
            something it mentions. Sent as the string true or false
        - name: hasThumbnail
          in: query
          schema:
            type: boolean
          description: >-
            Require, or require the absence of, a preview image. Sent as the
            string true or false
        - name: publishedFrom
          in: query
          schema:
            type: integer
            minimum: 1000
            maximum: 2200
          description: >-
            Earliest publication year, inclusive. Works with no recorded
            publication date are excluded rather than assumed recent
        - name: publishedTo
          in: query
          schema:
            type: integer
            minimum: 1000
            maximum: 2200
          description: Latest publication year, inclusive
        - name: after
          in: query
          schema:
            type: string
            maxLength: 40
          description: >-
            Resume after this point in the ranking, as the largest `cursor` the
            client already holds. Preferred over `page` for reading further into
            the stored catalog: the catalog grows while a reader pages, and a
            positional offset then hands back results an earlier page already
            showed. Ignored when it does not parse
        - name: sinceId
          in: query
          schema:
            type: integer
            minimum: 0
          description: >-
            The largest `catalogId` the client already holds. Sent with `after`:
            works stored while the client was reading can rank above the point it
            has read to, and would otherwise never be offered. Rows newer than
            this are returned whatever their rank
        - name: freshness
          in: query
          schema:
            type: string
            enum: [week, month, year, three_years]
          description: >-
            How recent a result must be. The stored catalog filters on year and
            three_years; the shorter windows only steer AI discovery
        - name: sourceQuality
          in: query
          schema:
            type: string
            enum: [academic, institutional, established, independent]
          description: Required source credibility
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [beginner, intermediate, advanced, mixed]
          description: Difficulty hint; applies to AI discovery only, content results only
        - name: accessType
          in: query
          schema:
            type: string
            enum: [free, no_account, open]
          description: >-
            Access requirement, content results only. The stored catalog filters
            on free and open; no_account only steers AI discovery
        - name: license
          in: query
          schema:
            type: string
            enum: [known, reusable]
          description: Require a stated licence, or one that permits reuse. Content results only
        - name: contentLength
          in: query
          schema:
            type: string
            enum: [short, medium, long]
          description: Length hint; applies to AI discovery only, content results only
        - name: captions
          in: query
          schema:
            type: boolean
          description: Require captions, sent as the string true or false. Applies to AI discovery only, content results only
        - name: transcript
          in: query
          schema:
            type: boolean
          description: Require a transcript, sent as the string true or false. Applies to AI discovery only, content results only
      responses:
        "200":
          description: Educational resources from the stored catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoveredResource"
        "400":
          description: Missing query
        "401":
          description: Sign-in required when the stored catalog has no results and AI discovery is used
        "502":
          description: Search failed

  /resources/recommendations:
    get:
      operationId: getResourceRecommendations
      tags: [resources]
      summary: Get personalised resource recommendations (based on review history if authenticated, top-rated otherwise)
      responses:
        "200":
          description: Recommended resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /resources/featured:
    get:
      operationId: listFeaturedResources
      tags: [resources]
      summary: Get featured and popular resources
      responses:
        "200":
          description: Featured resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"

  /resources/provenance-showcase:
    get:
      operationId: listProvenanceShowcase
      tags: [resources]
      summary: Sources with their provenance verdicts, for the landing hero
      description: >-
        Real catalogue sources with the same registry-based provenance verdict
        the resource pages show. Personalised to the caller's own saved
        resources when an auth header is present, otherwise the most-saved
        resources across the platform. Public and unauthenticated-safe: it
        returns only fields already public on a resource, and no AI is
        involved (provenance is a deterministic registry check).

        Entries whose address establishes a different language are excluded.
        Sources whose language cannot be established remain eligible; the
        client falls back to its built-in example when no suitable real source
        exists.
      parameters:
        - name: language
          in: query
          required: false
          description: >-
            The reader's interface language, as a two-letter code. Known
            mismatches are excluded. Defaults to `en`.
          schema: { type: string, pattern: "^[a-z]{2}$" }
      responses:
        "200":
          description: Showcase entries, most relevant first
          content:
            application/json:
              schema:
                type: object
                required: [personalised, entries]
                properties:
                  personalised:
                    type: boolean
                    description: True when drawn from the caller's own saves.
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProvenanceShowcaseEntry"

  /resources/{id}:
    get:
      operationId: getResource
      tags: [resources]
      summary: Get a resource by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          description: Not found
    patch:
      operationId: updateResource
      tags: [resources]
      summary: Update a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
    delete:
      operationId: deleteResource
      tags: [resources]
      summary: Delete a resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /source-review:
    get:
      operationId: reviewASource
      tags: [resources]
      summary: Research and summarise a source that is not saved yet
      description: >-
        The same review as /resources/{id}/source-review, for a resource
        nobody has added: the library runs this before you save something, so
        the decision to save is made with the provenance in front of you. It
        was served from the same handler and described nowhere, so the web app
        reached it through a hand-rolled fetch and no other surface could.
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: title
          in: query
          required: true
          schema: { type: string, maxLength: 300 }
        - name: subject
          in: query
          required: false
          schema: { type: string }
        - name: gradeLevel
          in: query
          required: false
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string }
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [quick, deep]
            default: quick
          description: >
            quick — maintained source provenance, no AI, no account needed;
            deep — authenticated live web research, cached for 90 days and
            subject to daily and monthly usage limits
      responses:
        "200":
          description: Source review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceReview"
        "400": { description: A valid source URL and title are required }
        "401": { description: Deep review needs an account }
        "502": { description: The research provider could not be reached }

  /resources/{id}/source-review:
    get:
      operationId: getResourceSourceReview
      tags: [resources]
      summary: Research and summarise the resource's source/uploader
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [quick, deep]
            default: quick
          description: >
            quick — use maintained source provenance without AI;
            deep — authenticated live web research; cached for 90 days and subject to daily/monthly usage limits
      responses:
        "200":
          description: Source review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceReview"
        "404":
          description: Resource not found
        "502":
          description: Source research failed

