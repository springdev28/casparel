# @fileOverview: Contract role: defines the OpenAPI source of truth used to generate client hooks and runtime Zod schemas.
# System connection: codegen feeds lib/api-client-react and lib/api-zod; Express handlers must implement the same operations.
# The source of truth. Everything the clients are built from -- the React
# hooks, the zod schemas, the types -- is generated out of this file, so a
# route that is not described here is a route no client can call. See
# artifacts/api-server/src/lib/contractDescribesEveryRoute.test.ts, which
# holds this file against the routes the server actually registers.
#
# Regenerate after any change:
#   pnpm --filter @workspace/api-spec run codegen
#
# One trap, hit three times while this file was being extended: a comma inside
# a flow mapping starts another key. `{ description: Not found, or not yours }`
# parses as two keys, and the validator's complaint names neither the comma nor
# the line. Quote any inline description containing a comma.
openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Casparel API — student/teacher productivity platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and user management
  - name: learning-goals
    description: Personal learning goals and coordinated next steps
  - name: classes
    description: Class management
  - name: resources
    description: Learning resource discovery
  - name: reviews
    description: Resource reviews and ratings
  - name: lists
    description: Resource lists
  - name: schedule
    description: Study schedule blocks
  - name: study-sessions
    description: Collaborative study sessions
  - name: dashboard
    description: Dashboard summary and activity
  - name: google-classroom
    description: Google Classroom integration
  - name: calendar
    description: Google Calendar sync and iCal feed
  - name: direct-messages
    description: One-to-one conversations, and the request that opens one
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out the current user
      responses:
        "204":
          description: Logged out

  /discover/capabilities:
    get:
      operationId: getDiscoverCapabilities
      tags: [resources]
      summary: Which discovery searches this server can actually run
      description: >-
        Both AI-backed searches are behind server flags that default to off.
        Without this the app cannot tell "switched off" from "found nothing",
        and reported an empty result for a search it never ran.
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                type: object
                required: [publicProfileSearch, resourceSearch]
                properties:
                  publicProfileSearch:
                    type: boolean
                    description: AI search of public profiles on the open web.
                  resourceSearch:
                    type: boolean
                    description: AI fallback when the stored catalog has no match.
  /users/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
    patch:
      operationId: updateMe
      tags: [auth]
      summary: Update the authenticated user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteMe
      tags: [auth]
      summary: Permanently delete the authenticated account
      description: >-
        Verifies the current password, clears private workspace data,
        anonymises shared contributions, and permanently disables the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInput"
      responses:
        "204":
          description: Account deleted
        "400":
          description: Invalid confirmation
        "401":
          description: Not authenticated or current password is incorrect

  /users/me/reset:
    post:
      operationId: resetMe
      tags: [auth]
      summary: Reset the authenticated account's private workspace
      description: >-
        Verifies the current password, deletes private learning data and saved
        preferences, and restores profile defaults. The login, subscription,
        classes, messages, submitted resources, and public contributions remain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetAccountInput"
      responses:
        "204":
          description: Account reset
        "400":
          description: Invalid confirmation
        "401":
          description: Not authenticated or current password is incorrect

  /users/me/avatar:
    post:
      operationId: uploadAvatar
      tags: [auth]
      summary: Upload an avatar image for the current user
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Avatar uploaded; returns the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: No file provided or invalid image
        "401":
          description: Not authenticated

  /users/me/avatar/preset:
    put:
      operationId: setPresetAvatar
      tags: [auth]
      summary: Select an expressive preset avatar as the current user profile picture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresetAvatarInput"
      responses:
        "200":
          description: Avatar selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid avatar

  /users/{id}/library:
    get:
      operationId: getUserLibrary
      tags: [auth]
      summary: Get a user library when the viewer has permission
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: User library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserLibrary" }
        "403": { description: Library is not visible to this viewer }
        "404": { description: User not found }

  /users/{id}:
    get:
      operationId: getPublicProfile
      tags: [auth]
      summary: Get a public profile for any signed-in user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
        "401":
          description: Not authenticated
        "404":
          description: User not found

  /users/{id}/safety:
    get:
      operationId: getUserSafetyStatus
      tags: [auth]
      summary: Check whether the current user has blocked another user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Safety relationship
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSafetyStatus" }
    put:
      operationId: blockUser
      tags: [auth]
      summary: Block a user from profile access and collaboration
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: User blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSafetyStatus" }
    delete:
      operationId: unblockUser
      tags: [auth]
      summary: Unblock a user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: User unblocked }

  /users/{id}/report:
    post:
      operationId: reportUser
      tags: [auth]
      summary: Privately report a user for moderation review
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportUserInput" }
      responses:
        "201":
          description: Report received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportUserResponse" }

  /users/me/role:
    patch:
      operationId: switchRole
      tags: [auth]
      summary: Switch the active role for the current user (student ↔ teacher)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleSwitchInput"
      responses:
        "200":
          description: Role updated — returns a fresh auth token and the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid role value
        "401":
          description: Not authenticated

  /users/me/usage:
    get:
      operationId: getMyUsage
      tags: [auth]
      summary: Get the current account plan and AI usage
      responses:
        "200":
          description: Current plan and usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountUsage" }
        "401": { description: Not authenticated }

  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get administrator usage and content totals
      responses:
        "200":
          description: Administrator overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401": { description: Not authenticated }
        "403": { description: Administrator role required }

  /learning-goals:
    get:
      operationId: listLearningGoals
      tags: [learning-goals]
      summary: List the current user learning goals
      responses:
        "200":
          description: Learning goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LearningGoal"
    post:
      operationId: createLearningGoal
      tags: [learning-goals]
      summary: Create a learning goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningGoalInput"
      responses:
        "201":
          description: Created learning goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGoal"
        "402": { description: "Plan capacity reached (PLAN_LIMIT_REACHED)" }

  /learning-goals/{id}:
    patch:
      operationId: updateLearningGoal
      tags: [learning-goals]
      summary: Update a learning goal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningGoalPatch"
      responses:
        "200":
          description: Updated learning goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningGoal"
        "404": { description: Goal not found }
    delete:
      operationId: deleteLearningGoal
      tags: [learning-goals]
      summary: Delete a learning goal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Goal deleted }

  # ── Classes ───────────────────────────────────────────────────────────────
  /classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List classes the current user belongs to
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Class"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a new class (teacher only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
        "402": { description: "Plan capacity reached (PLAN_LIMIT_REACHED)" }

  /classes/{id}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get a class by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassWithMembers"
        "404":
          description: Not found
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Update a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Class"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Delete a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /classes/{id}/members:
    get:
      operationId: listClassMembers
      tags: [classes]
      summary: List members of a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassMember"

  /classes/{id}/members/bulk-invite:
    post:
      operationId: bulkInviteClassMembers
      tags: [classes]
      summary: Bulk-add students to a class by email (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInviteInput"
      responses:
        "200":
          description: Bulk invite result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkInviteResult"
        "403":
          description: Not the class teacher
        "402": { description: "Plan capacity reached (PLAN_LIMIT_REACHED)" }

  /classes/{id}/members/{userId}:
    delete:
      operationId: removeClassMember
      tags: [classes]
      summary: Remove a member from a class
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /classes/{id}/seating-chart:
    get:
      operationId: getSeatingChart
      tags: [classes]
      summary: Get the visual classroom seating chart (class members; private notes only for teacher)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Seating chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingChart"
        "403": { description: Not the class teacher }
    put:
      operationId: updateSeatingChart
      tags: [classes]
      summary: Update classroom dimensions and all student seat assignments (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatingChartInput"
      responses:
        "200":
          description: Updated seating chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingChart"

  /classes/{id}/seating-suggestions:
    post:
      operationId: submitSeatingSuggestion
      tags: [classes]
      summary: Submit a student's seating suggestion to the class teacher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "201":
          description: Suggestion sent to the teacher
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
        "403": { description: Not a student in this class }

  /classes/{id}/students/{userId}/note:
    put:
      operationId: updateStudentNote
      tags: [classes]
      summary: Save a private teacher note for a student
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentNoteInput"
      responses:
        "200":
          description: Updated student seating record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingStudent"

  /classes/{id}/students/{userId}/role:
    put:
      operationId: updateStudentRole
      tags: [classes]
      summary: Assign, edit or remove a custom class role for a student (teacher only)
      description: >-
        Custom roles are short labels like "Group Leader" chosen by the
        teacher. Unlike private notes they are visible to the whole class.
        Sending null removes the role.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: userId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentRoleInput"
      responses:
        "200":
          description: Updated student record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingStudent"
        "403": { description: Only the class teacher can manage roles }
        "404": { description: Student not found in class }

  /classes/{id}/seating-plan/suggest:
    post:
      operationId: suggestSeatingPlan
      tags: [classes]
      summary: Suggest an explainable seating plan from private teacher notes without applying it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatingPlanSuggestionInput"
      responses:
        "200":
          description: Reviewable seating suggestion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatingPlanSuggestion"
        "403": { description: Not the class teacher }
        "402":
          {
            description: "Casparel Teacher Pro (or legacy Pro) subscription required",
          }

  /classes/{id}/student-goals:
    get:
      operationId: listClassStudentGoals
      tags: [learning-goals]
      summary: List learning goals for students in a teacher-owned class
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Student goals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StudentLearningGoal" }
        "403": { description: Not the class teacher }

  /classes/{id}/student-goals/{goalId}:
    patch:
      operationId: updateClassStudentGoal
      tags: [learning-goals]
      summary: Update a student learning goal as their class teacher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: goalId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearningGoalPatch" }
      responses:
        "200":
          description: Updated student goal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentLearningGoal" }
        "403": { description: Not the class teacher }
        "404": { description: Student goal not found }

  /classes/{id}/resources-list:
    get:
      operationId: getClassResourcesList
      tags: [classes]
      summary: Get the class resources list with items (teachers and members)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class resources list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceListWithItems"
        "403":
          description: Not a class member

  /classes/{id}/assign:
    post:
      operationId: assignResourceToClass
      tags: [classes]
      summary: Assign a resource to the class list (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignResourceBody"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignResourceResponse"
        "403":
          description: Not the class teacher
        "404":
          description: Resource not found

  /classes/{id}/resources-list/items/{resourceId}:
    delete:
      operationId: removeClassResource
      tags: [classes]
      summary: Remove a resource from the class list (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: resourceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "403":
          description: Not the class teacher

  /classes/{id}/leave:
    delete:
      operationId: leaveClass
      tags: [classes]
      summary: Leave a class; owners transfer ownership to another teacher
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Left class }
        "409": { description: Owner must add another teacher first }

  /classes/{id}/resource-recommendations:
    get:
      operationId: listClassResourceRecommendations
      tags: [classes]
      summary: List student resource recommendations
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: "#/components/schemas/ClassResourceRecommendation" }
    post:
      operationId: recommendResourceToClass
      tags: [classes]
      summary: Recommend a resource for teacher approval (students only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ClassResourceRecommendationInput" }
      responses:
        "201":
          description: Recommendation created
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ClassResourceRecommendation" }

  /classes/{id}/resource-recommendations/{recommendationId}:
    patch:
      operationId: reviewClassResourceRecommendation
      tags: [classes]
      summary: Approve or decline a student resource recommendation (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: recommendationId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ClassResourceRecommendationReview" }
      responses:
        "200":
          description: Reviewed recommendation
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ClassResourceRecommendation" }

  /classes/{id}/invitations:
    get:
      operationId: listClassInvitations
      tags: [classes]
      summary: List pending invitations for a class (teacher only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassInvitation" }
        "403": { description: Only the class teacher can view invitations }
    post:
      operationId: inviteClassMember
      tags: [classes]
      summary: Invite an existing account to a class by email (teacher only)
      description: >-
        Creates a pending invitation the invitee must accept; role is derived
        from the invitee account, any role sent in the body is ignored.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassInvitationInput" }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassInvitation" }
        "403": { description: Only the class teacher can invite members }
        "404": { description: No account with that email }
        "409": { description: This user is already a class member }
        "402": { description: "Plan capacity reached (PLAN_LIMIT_REACHED)" }

