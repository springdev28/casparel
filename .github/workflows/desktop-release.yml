name: Desktop release

# Builds the Casparel desktop installers. electron-builder can only produce
# macOS targets on macOS and (reliably) Windows targets on Windows, so this is
# a matrix with one runner per platform rather than a single job.
#
# Two ways to start it:
#
#   • push a tag like `desktop-v1.0.0`
#   • run it from the Actions tab. Leave "release" unchecked to just build and
#     keep the installers on the run; check it to tag this commit and publish.
#     The second exists because a release needs a tag and not everyone who can
#     run a workflow can push one.
#
# Optional repository secrets, all absent by default:
#   CSC_LINK, CSC_KEY_PASSWORD                  code-signing certificate
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
#   APPLE_TEAM_ID                               macOS notarisation
#
# Without them the build produces unsigned installers, which are fine for local
# testing and for recording a demo. Shipping to real users needs signing:
# unsigned builds trip Gatekeeper on macOS and SmartScreen on Windows.
#
# "Absent" is doing real work in that sentence. An absent secret reaches a step
# as the empty string, and electron-builder reads an empty CSC_LINK as a
# certificate that was supplied -- so passing these through unconditionally
# failed the macOS build outright rather than building it unsigned. See the
# build step.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Tag this commit and publish a release (otherwise just build)'
        type: boolean
        default: false

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # One platform failing should not throw away installers that other
      # platforms already produced.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: build:mac
            artifact: macos
          - os: windows-latest
            target: build:win
            artifact: windows
          - os: ubuntu-latest
            target: build:linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        working-directory: artifacts/desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An absent secret arrives as the EMPTY STRING, not as an unset
          # variable, and electron-builder treats an empty CSC_LINK as a
          # certificate that WAS supplied -- "allow to specify as empty
          # string", in its own source. So the macOS build took the signing
          # path with nothing to sign with, and died resolving a certificate
          # that was never there:
          #
          #   • empty password will be used for code signing
          #   ⨯ /Users/runner/work/casparel/casparel/artifacts/desktop not a file
          #
          # The variables have to be absent rather than empty, and YAML cannot
          # leave a key out conditionally. This shell is the build's parent
          # process, so what it unsets the build never inherits.
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID \
                      APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          if [ -z "${CSC_LINK:-}" ]; then
            # Nothing to sign with. Say so once, and stop electron-builder
            # searching the keychain for an identity it will not find, so the
            # result is an unsigned build rather than a failed one.
            echo "::notice title=Unsigned build::No signing certificate configured. Gatekeeper (macOS) and SmartScreen (Windows) will warn on first launch."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm run ${{ matrix.target }}

      # What the installers CONTAIN, which a successful build says nothing
      # about. The applications-menu entry, the icon sizes, the deep-link
      # scheme registration and the declared licence are all things that are
      # only wrong once somebody installs the thing.
      - name: Check what the Linux packages contain
        if: matrix.artifact == 'linux'
        working-directory: artifacts/desktop
        run: pnpm run verify:package

      # The macOS half of the same idea, and it was missing entirely. This
      # mounts the .dmg, checks the bundle's identity and architecture, copies
      # the app out of the read-only image, and starts it against a local
      # stand-in for casparel.com -- so a green leg means a window that reached
      # a page, not a build that produced a file.
      #
      # Once per image, because the release ships two and "the one this machine
      # matches" is one. 1.0.1's Intel .dmg was published having never been
      # opened by anything: the runner is Apple Silicon, so the arm64 image got
      # all fourteen checks and the x64 image got none. Both are inspected now;
      # the Intel one is also launched when the runner has Rosetta 2, and named
      # as a skip with its reason when it does not, because a runner without a
      # translator is a fact about the runner and not a defect in the build.
      - name: Check the macOS app runs
        if: matrix.artifact == 'macos'
        working-directory: artifacts/desktop
        shell: bash
        run: |
          shopt -s nullglob
          images=(release/*.dmg)
          if [ ${#images[@]} -eq 0 ]; then
            echo "::error title=No disk image::the build produced no .dmg to check."
            exit 1
          fi
          # Both are reported before the step fails, so a red run says whether
          # one architecture broke or every one of them did.
          status=0
          for image in "${images[@]}"; do
            echo "::group::$(basename "$image")"
            node scripts/verify-app-macos.mjs "$image" || status=1
            echo "::endgroup::"
          done
          exit $status

      # And the third platform, which was the last one where nothing had ever
      # run what ships. It installs the .exe silently, reads the metadata
      # Windows shows in a file's Properties, checks the scheme registration
      # and the uninstaller, then starts the installed application.
      - name: Check the Windows app runs
        if: matrix.artifact == 'windows'
        working-directory: artifacts/desktop
        run: node scripts/verify-app-windows.mjs

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: casparel-desktop-${{ matrix.artifact }}
          # Only the distributables. The unpacked app directories are build
          # intermediates and would multiply the upload size for nothing.
          path: |
            artifacts/desktop/release/*.dmg
            artifacts/desktop/release/*.exe
            artifacts/desktop/release/*.AppImage
            artifacts/desktop/release/*.deb
          if-no-files-found: error

  # Tagging from CI exists because a release needs a tag and not everyone who
  # can run this workflow can push one. It runs AFTER the build on purpose: a
  # tag is a permanent claim that a commit was released, and it should not be
  # made for a commit whose installers do not build. A matrix leg failing
  # fails `build`, which skips this job, which skips the release.
  #
  # The tag it pushes will NOT re-trigger this workflow. GitHub refuses to
  # start workflow runs from pushes made with the automatic GITHUB_TOKEN, to
  # stop a workflow from triggering itself forever. That is why the release
  # job below has to run in THIS run rather than waiting to be woken by the
  # tag: written the obvious way, this job would create a tag and nothing at
  # all would happen next.
  tag:
    if: inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      name: ${{ steps.create.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Create and push the tag
        id: create
        run: |
          version=$(node -p "require('./artifacts/desktop/package.json').version")
          name="desktop-v${version}"

          # Never move an existing tag. A released version is a fixed point;
          # re-pointing it silently changes what everyone who already
          # downloaded it thinks they have.
          if git ls-remote --exit-code --tags origin "refs/tags/${name}" >/dev/null 2>&1; then
            echo "::error title=Tag already exists::${name} is already published. Bump the version in artifacts/desktop/package.json and run this again."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ${{ github.sha }} explicitly, not HEAD: this is the commit the
          # matrix above actually built, and the branch may have moved since.
          git tag -a "${name}" "${{ github.sha }}" \
            -m "Casparel desktop ${version}" \
            -m "Built and released from ${{ github.ref_name }} by ${{ github.workflow }} run ${{ github.run_number }}."
          git push origin "refs/tags/${name}"

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "Tagged ${{ github.sha }} as ${name}." >> "$GITHUB_STEP_SUMMARY"

  release:
    # Two ways in: somebody pushed a desktop-v* tag, or this run just made one.
    needs: [build, tag]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/desktop-v') || needs.tag.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A job output, not a step output. The first version added a step that
    # wrote this to $GITHUB_OUTPUT and pointed tag_name at it -- which made
    # publishing, the one step here that must never break, depend on plumbing
    # that had never run. A job output is evaluated from the same expression
    # directly, so the publish step below is left exactly as it was and the
    # verify jobs still get one canonical answer.
    #
    # On a tag push github.ref_name IS the tag. On a dispatch it is the branch,
    # so the name has to come from the job that made the tag.
    outputs:
      tag: ${{ needs.tag.outputs.name || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.name || github.ref_name }}
          files: installers/*
          generate_release_notes: true

  # Every release is now installed and run before anyone downloads it.
  #
  # The build legs above check what they just built, each on the one runner that
  # built it -- so macOS Intel and Windows arm64 were never covered, and neither
  # was the published file itself as opposed to the one still sitting on the
  # build machine. These jobs download what was actually published and run it on
  # a machine of each architecture.
  #
  # They run after publishing rather than before because there is nothing to
  # download until the release exists. A failure here does not unpublish
  # anything; it turns the run red and names what is wrong with a release that
  # is already out, which is the difference between finding out today and
  # finding out from a user.
  verify-macos:
    needs: release
    uses: ./.github/workflows/desktop-verify-macos.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  verify-windows:
    needs: release
    uses: ./.github/workflows/desktop-verify-windows.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
