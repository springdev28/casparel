# @fileOverview: Repository role: implements or configures Desktop Verify Windows.
# System connection: see docs/codebase-guide.md and docs/source-file-index.md for its package boundary and consumers.
name: Verify the Windows app

# Installs a published .exe on a real Windows machine and checks the app it
# installs starts.
#
# The counterpart of "Verify the macOS app", and the platform where this matters
# most: nobody on this project has a Windows machine, so a hosted runner is not
# just the convenient way to answer the question, it is the only way. Until this
# existed, the Windows installer was the one artifact that had been produced and
# never run.
#
# Run it from the Actions tab against any published tag. Both architectures are
# checked: the arm64 installer had been built by every release and run by
# nothing, because no machine in this project can execute it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. desktop-v1.0.0)'
        type: string
        required: true
        default: desktop-v1.0.0
  # Called by the release workflow, so every release is checked without anybody
  # remembering to. `inputs.tag` reads the same either way.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to verify'
        type: string
        required: true

concurrency:
  # Keyed on the tag, not the ref. A release calling this must not cancel
  # somebody's manual verification of a different version, and two runs against
  # the same tag are genuinely redundant.
  group: desktop-verify-windows-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Both architectures, because an x64 machine cannot run an arm64 binary --
    # the emulation only goes the other way. Verifying the arm64 installer needs
    # an arm64 Windows machine, and GitHub's are free for public repositories.
    #
    # fail-fast is off so one architecture failing still reports the other:
    # "arm64 is broken" and "both are broken" are different findings.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    name: verify (${{ matrix.arch }})
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No pnpm install: the check is plain Node with no dependencies, and it
      # deliberately tests the SHIPPED installer rather than anything built
      # here. Installing the workspace would only add a way for this to pass
      # while the released artifact is broken.
      - name: Download the released installer
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#desktop-v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          # The installer this machine can actually execute, so "it installs and
          # starts" is a real result rather than a skipped one.
          asset="Casparel-${version}-${{ matrix.arch }}.exe"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}"
          echo "Fetching ${asset}"
          if ! curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/app.exe" "$url"; then
            echo "::error title=Asset not found::${url} could not be downloaded. Check the tag and the asset name."
            exit 1
          fi
          ls -l "$RUNNER_TEMP/app.exe"
          sha256sum "$RUNNER_TEMP/app.exe"

      - name: Install it, inspect it, run it
        working-directory: artifacts/desktop
        run: node scripts/verify-app-windows.mjs "$env:RUNNER_TEMP\app.exe" "--expect-version=$env:VERSION"
