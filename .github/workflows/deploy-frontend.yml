name: Deploy to Hostinger

# On this host a single Passenger-managed Node app serves BOTH /api and the
# SPA (Express serves the built frontend from artifacts/api-server/dist/public).
# So "deploying" means: build the web app, bundle it into the API build, upload
# that build to the app directory, and restart Passenger. Uploading the
# frontend to public_html does nothing here — the app never reads it.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    FTP host/IP (Hostinger: hPanel → Files → FTP Accounts)
#   FTP_USERNAME  FTP account username
#   FTP_PASSWORD  FTP account password
#
# Repository variables (optional — sensible defaults for this host are baked in):
#   SITE_URL         canonical origin for the sitemap / robots.txt
#                    (default: https://casparel.com)
#   VITE_IOS_APP_URL          App Store listing, once it is live
#   VITE_ANDROID_APP_URL      Google Play listing, once it is live
#   VITE_DESKTOP_DOWNLOAD_URL desktop releases page, once there is one
#                    All three are unset by default, which is what makes the
#                    landing page say "coming soon" instead of linking nowhere.
#   FTP_APP_DIR      the app's build dir, relative to the FTP home, trailing
#                    slash. Default: hbuilds/current/nodejs/artifacts/api-server/dist/
#   FTP_RESTART_DIR  the Passenger restart dir, trailing slash.
#                    Default: hbuilds/current/nodejs/tmp/

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/app/**'
      - 'artifacts/api-server/**'
      - 'lib/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Nothing here runs Electron, and the desktop types ship in the package
      # regardless, so skip the ~100MB runtime download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      # The upload, the restart and the smoke check used to be guarded on
      # `if: env.FTP_SERVER != ''`, so a missing or renamed secret skipped all
      # three together and the job went green having deployed nothing. A
      # deploy that cannot deploy is a failure, not a no-op. The credentials
      # are checked once, here, before ~10 minutes of build time is spent, and
      # nothing downstream is conditional any more.
      - name: Require deploy credentials
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=()
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error title=Deploy secrets missing::${missing[*]} not set. Add them under Settings → Secrets and variables → Actions. This job will not report success without deploying."
            exit 1
          fi
          echo "FTP credentials present."

      # Presence is not validity: after a day of 530s at the very end of
      # six-minute runs, the login itself is now proven in seconds, before any
      # build time is spent. curl separates the failure modes the deploy
      # action reports as one: 67 = the server answered and refused the pair,
      # 6/7/28 = the host itself is wrong or unreachable.
      - name: Verify FTP login (fail fast)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL || 'https://casparel.com' }}
        run: |
          host="${FTP_SERVER#ftps://}"; host="${host#ftp://}"; host="${host%%/*}"
          probe() { timeout 6 bash -c "</dev/tcp/${1}/${2}" 2>/dev/null && echo open || echo closed; }

          # "The configured host answers nothing" always leads to the same
          # question -- then what SHOULD it be? -- and this runner is the one
          # machine in the loop that can answer it, because it can open port 21
          # outbound where a laptop behind a firewall (or an agent sandbox)
          # cannot. So on failure, probe the hostnames Hostinger actually hands
          # out for this domain and name the one that works. Fixing the secret
          # should be a copy, not a guess followed by another six-minute run.
          suggest_host() {
            domain="${SITE_URL#https://}"; domain="${domain#http://}"; domain="${domain%%/*}"
            found=""
            {
              echo "### Which host answers FTP"
              echo
              echo "| Candidate | Port 21 |"
              echo "| --- | --- |"
            } >> "$GITHUB_STEP_SUMMARY"
            for candidate in "ftp.${domain}" "${domain}"; do
              state=$(probe "$candidate" 21)
              printf '| `%s` | %s |\n' "$candidate" "$state" >> "$GITHUB_STEP_SUMMARY"
              if [ "$state" = "open" ] && [ -z "$found" ]; then found="$candidate"; fi
            done
            if [ -n "$found" ]; then
              echo "::error title=Set FTP_SERVER to ${found}::That host answers on port 21. Paste it exactly -- no ftp:// prefix, no path, no trailing slash -- under Settings > Secrets and variables > Actions."
            else
              echo "::error title=No candidate answered::Neither ftp.${domain} nor ${domain} answers on port 21 either, so the host is not derivable from the domain. Read it from hPanel > Files > FTP Accounts. If FTP is disabled on the plan, this deploy has to move to SFTP instead."
            fi
          }

          # Wait out a host that is briefly not there.
          #
          # This scan is a gate: everything below it, including the login
          # rounds that already retry for a fresh password, only runs once a
          # port answers. So a Hostinger blip failed the whole deploy in twelve
          # seconds and the retries underneath never got the chance — which is
          # exactly what happened twice in one evening, each time clearing on
          # its own a few minutes later with nothing changed.
          #
          # Waiting only ever delays a verdict that was going to be reached
          # anyway: a wrong FTP_SERVER still ends up unreachable, just five
          # minutes later, and that is a secret nobody edits twice a day. A
          # deploy failing on a healthy release is the more expensive mistake,
          # because it needs a person to notice and re-run it.
          #
          # Port 21 answering is the only thing worth waiting for. The scan
          # stops the moment it does.
          scan_deadline=$(( SECONDS + 300 ))
          while :; do
            p21=$(probe "$host" 21); p22=$(probe "$host" 22)
            [ "$p21" = "open" ] && break
            [ "$SECONDS" -ge "$scan_deadline" ] && break
            echo "Port 21 is ${p21} and 22 is ${p22}; the host may be between restarts. Retrying in 20s ($(( scan_deadline - SECONDS ))s left)."
            sleep 20
          done
          echo "Port scan on the configured host: 21 (FTP) is ${p21}, 22 (SFTP/SSH) is ${p22}."
          if [ "$p21" = "closed" ] && [ "$p22" = "open" ]; then
            echo "::error title=Host is SFTP-only::The configured host answered SSH/SFTP (22) but not FTP (21), for five minutes. Either FTP is disabled on this server — the deploy must switch to SFTP — or FTP_SERVER points at the wrong machine for FTP."
            suggest_host
            exit 1
          fi
          if [ "$p21" = "closed" ] && [ "$p22" = "closed" ]; then
            echo "::error title=Host unreachable::Neither FTP (21) nor SSH (22) answered on the configured host across a five minute window, so this is not a passing blip. FTP_SERVER is likely the wrong host/IP entirely; copy it from the same hPanel page as the username."
            suggest_host
            exit 1
          fi
          # Hostinger servers accept exactly one of two username forms — the
          # bare account id (u123456789) or id.domain — and a freshly changed
          # password can take minutes to propagate. Try both forms, three
          # rounds apart, and hand the working one to the upload steps below.
          candidates=("${FTP_USERNAME}")
          if [[ "${FTP_USERNAME}" == *.* ]]; then
            candidates+=("${FTP_USERNAME%%.*}")
          else
            candidates+=("${FTP_USERNAME}.casparel.com")
          fi
          labels=("as stored in the secret" "alternate Hostinger form")
          for candidate in "${candidates[@]}"; do
            echo "::add-mask::${candidate}"
          done
          for round in 1 2 3; do
            for i in 0 1; do
              candidate="${candidates[$i]}"
              set +e
              curl -sS --connect-timeout 15 --max-time 60 \
                --user "${candidate}:${FTP_PASSWORD}" \
                "ftp://${host}/" --list-only -o /dev/null
              code=$?
              set -e
              if [ "$code" -eq 0 ]; then
                echo "FTP login OK using the username ${labels[$i]}."
                echo "FTP_USERNAME_EFFECTIVE=${candidate}" >> "$GITHUB_ENV"
                exit 0
              fi
              echo "Round ${round}: username ${labels[$i]} rejected (curl ${code})."
            done
            [ "$round" -lt 3 ] && { echo "Waiting 25s in case a fresh password is still propagating…"; sleep 25; }
          done
          echo "::error title=FTP login rejected::Both username forms were refused across three rounds. The password in the secret does not match the server. Verify the pair once in an FTP client (FileZilla) against this host; if it works there, re-save the GitHub secret watching for stray spaces."
          exit 1

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This job used to build and upload with no gate at all, which is how
      # regressions reached casparel.com. Everything below the build must pass
      # before a single file is sent to the host.
      - name: Typecheck every package
        run: pnpm run typecheck

      - name: API tests
        run: pnpm --filter @workspace/api-server exec vitest run

      # The API build copies artifacts/app/dist/public into its own bundle, so
      # the web app must be built first.
      - name: Build web app
        run: pnpm --filter @workspace/app run build
        env:
          NODE_ENV: production
          SITE_URL: ${{ vars.SITE_URL || 'https://casparel.com' }}
          # Where the app can be installed from. Vite inlines these at build
          # time, so a store approval reaches the site by setting the variable
          # and redeploying — no code change, and an unset one keeps the
          # landing page honestly saying "coming soon" rather than shipping a
          # link that 404s. See artifacts/app/src/lib/downloads.ts.
          VITE_IOS_APP_URL: ${{ vars.VITE_IOS_APP_URL }}
          VITE_ANDROID_APP_URL: ${{ vars.VITE_ANDROID_APP_URL }}
          VITE_DESKTOP_DOWNLOAD_URL: ${{ vars.VITE_DESKTOP_DOWNLOAD_URL }}

      # A real browser catches what types and unit tests cannot: text that
      # fails contrast against its actual background, content left at opacity 0
      # by reveal-on-scroll, overflow, and uncaught page errors.
      - name: Install Playwright
        # Bounded and retried, which it was not. This step normally costs
        # about a minute; on 19 August one slow mirror spent fifteen here and
        # took the whole `flows` budget with it. That job does its real work in
        # under three minutes, so the entire ceiling went to a step that tests
        # nothing, and the run reported as cancelled with every actual check
        # marked "skipped" -- a shape that reads like "the tests did not run"
        # rather than "the download was slow", and sends you looking in the
        # wrong place.
        #
        # The bound is this step's own timeout-minutes, not a cap around each
        # command. The first version capped both halves and retried both, which
        # turned a slow mirror into a hard failure -- see the note in the script
        # below. Only a download is retried either way: no product failure can
        # be retried into passing from here.
        timeout-minutes: 11
        run: |
          # Only the npm download is retried. `playwright install --with-deps`
          # shells out to apt-get as root, and `timeout` kills playwright
          # without killing that grandchild -- so the orphan keeps
          # /var/lib/dpkg/lock-frontend and the second attempt dies instantly
          # on "Unable to acquire the dpkg frontend lock", exit 100. The retry
          # that was meant to heal a slow mirror was manufacturing the failure
          # it then reported. The step's own timeout-minutes is the bound.
          fetch_package() {
            timeout 120 npm i --prefix "$RUNNER_TEMP/pw" --no-save playwright
          }
          if ! fetch_package; then
            echo "::warning title=Playwright package retried::The first npm attempt failed or ran over its cap."
            sleep 10
            fetch_package || {
              echo "::error title=Playwright package failed twice::This is the npm download, not a product failure."
              exit 1
            }
          fi

          # No --with-deps, and that flag is the whole story of this step.
          #
          # It shells out to apt-get for fonts and shared libraries that the
          # GitHub runner image already carries -- it ships Chrome and Edge, so
          # the browser libraries are there -- and the Ubuntu mirror it uses has
          # been taking minutes per package. That is where all eleven minutes
          # went on the runs that timed out, and it was failing roughly half of
          # them, on main as much as on branches. Capping it turned a slow
          # mirror into a hard failure; uncapping it moved the failure to the
          # step's own ceiling. Removing the apt path removes both.
          #
          # The browser itself comes from Playwright's CDN and takes seconds.
          # If a library really is missing, Chromium fails to launch on the
          # first audit and says which one, which is a better failure than a
          # ten-minute timeout that says nothing at all.
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium
          mkdir -p artifacts/app/node_modules
          ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright-core" \
            artifacts/app/node_modules/playwright-core

      # The built index.html IS the search result: the app renders client-side,
      # so these tags are all a crawler reads. Check the key phrase survived the
      # build, that the share card agrees with it, and that nothing is long
      # enough for Google to truncate mid-word.
      - name: Check the search preview
        working-directory: artifacts/app
        run: node scripts/seo-check.mjs

      - name: Audit the app in a real browser
        working-directory: artifacts/app
        run: node scripts/audit-pages.mjs

      # The page audit renders pages; this one drives the search and checks what
      # the reader ends up with. Both failures it exists for were invisible to
      # an API check: a first page of sixteen results rendered fourteen cards,
      # and appending a page put the loading placeholders above the results
      # already on screen, shoving them off the page.
      - name: Audit search results
        working-directory: artifacts/app
        run: node scripts/audit-search-results.mjs

      # An empty state must never stand in for a loading one: "Your library is
      # empty" is a claim about the account, and painting it mid-load tells a
      # returning user their work is gone.
      - name: Audit loading states
        working-directory: artifacts/app
        run: node scripts/audit-loading.mjs

      # Separate from the page audit: this one drives auth state rather than
      # rendering, and checks that an expired or server-rejected session
      # actually returns the user to the login page.
      - name: Audit session handling
        working-directory: artifacts/app
        run: node scripts/audit-session.mjs

      - name: Build API (bundles the SPA into dist/public)
        run: pnpm --filter @workspace/api-server run build
        env:
          NODE_ENV: production
          SITE_URL: ${{ vars.SITE_URL || 'https://casparel.com' }}

      - name: Guard against a missing build
        run: |
          test -f artifacts/app/dist/public/index.html
          test -f artifacts/api-server/dist/index.mjs
          test -f artifacts/api-server/dist/public/index.html

      # Ask the live site how it is BEFORE anything is uploaded, and record
      # the answer. This is what lets the post-deploy check tell "my release
      # will not boot" from "the host's edge is down": both look like a 503
      # with no application behind it, but only one of them was also true a
      # minute before the upload. It never fails the job — it only reports
      # what it saw, and a missing/skipped reading is treated as "not the
      # host" downstream.
      - name: Probe the site before deploying
        id: baseline
        run: node scripts/smoke-check.mjs --probe "${{ vars.SITE_URL || 'https://casparel.com' }}"

      # Upload the self-contained esbuild output (index.mjs + workers +
      # migrations + the bundled SPA in public/) into the running app dir.
      # node_modules at the app root is left untouched — the build changes no
      # externalized native deps. Longer timeout to ride out slow FTP control
      # sockets on this host.
      - name: Deploy app over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME_EFFECTIVE }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./artifacts/api-server/dist/
          server-dir: ${{ vars.FTP_APP_DIR || 'hbuilds/current/nodejs/artifacts/api-server/dist/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      # Restart Passenger by writing tmp/restart.txt. Use the deploy action
      # (not curl) because it creates the tmp/ dir if it does not exist and
      # traverses the `current` symlink the same way the app upload did. The
      # timestamped body changes every run so the file is always re-uploaded
      # (fresh mtime), which is what triggers the reload. dangerous-clean-slate
      # stays false so nothing else in tmp/ is removed.
      - name: Prepare restart marker
        run: |
          mkdir -p .deploy-restart
          echo "restarted by GitHub Actions at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .deploy-restart/restart.txt

      - name: Restart Passenger app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME_EFFECTIVE }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./.deploy-restart/
          server-dir: ${{ vars.FTP_RESTART_DIR || 'hbuilds/current/nodejs/tmp/' }}
          dangerous-clean-slate: false

      # Everything above proves the build was good and that files were
      # uploaded. Neither proves the running site works: a deploy has gone
      # green while every data-backed route returned 500, because the database
      # was unreachable and because a connection string was wrong. This asks
      # the live site, retrying while Passenger restarts, and fails the job if
      # the release is live but broken.
      - name: Smoke-check the deployed site
        env:
          # "true" if the site was answering before this upload, "false" if it
          # was already dark, "" if the probe never ran. Only an explicit
          # "false" lets a total blackout be blamed on the host.
          SMOKE_BASELINE_REACHABLE: ${{ steps.baseline.outputs.reachable }}
        run: node scripts/smoke-check.mjs "${{ vars.SITE_URL || 'https://casparel.com' }}"
