name: Deploy to Hostinger

# On this host a single Passenger-managed Node app serves BOTH /api and the
# SPA (Express serves the built frontend from artifacts/api-server/dist/public).
# So "deploying" means: build the web app, bundle it into the API build, upload
# that build to the app directory, and restart Passenger. Uploading the
# frontend to public_html does nothing here — the app never reads it.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    FTP host/IP (Hostinger: hPanel → Files → FTP Accounts)
#   FTP_USERNAME  FTP account username
#   FTP_PASSWORD  FTP account password
#
# Repository variables (optional — sensible defaults for this host are baked in):
#   SITE_URL         canonical origin for the sitemap
#                    (default: the current hostingersite.com domain)
#   FTP_APP_DIR      the app's build dir, relative to the FTP home, trailing
#                    slash. Default: hbuilds/current/nodejs/artifacts/api-server/dist/
#   FTP_RESTART_DIR  the Passenger restart dir, trailing slash.
#                    Default: hbuilds/current/nodejs/tmp/

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/app/**'
      - 'artifacts/api-server/**'
      - 'lib/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API build copies artifacts/app/dist/public into its own bundle, so
      # the web app must be built first.
      - name: Build web app
        run: pnpm --filter @workspace/app run build
        env:
          NODE_ENV: production
          SITE_URL: ${{ vars.SITE_URL || 'https://lightgrey-oyster-122608.hostingersite.com' }}

      - name: Build API (bundles the SPA into dist/public)
        run: pnpm --filter @workspace/api-server run build
        env:
          NODE_ENV: production
          SITE_URL: ${{ vars.SITE_URL || 'https://lightgrey-oyster-122608.hostingersite.com' }}

      - name: Guard against a missing build
        run: |
          test -f artifacts/app/dist/public/index.html
          test -f artifacts/api-server/dist/index.mjs
          test -f artifacts/api-server/dist/public/index.html

      # Upload the self-contained esbuild output (index.mjs + workers +
      # migrations + the bundled SPA in public/) into the running app dir.
      # node_modules at the app root is left untouched — the build changes no
      # externalized native deps. Longer timeout to ride out slow FTP control
      # sockets on this host.
      - name: Deploy app over FTP
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./artifacts/api-server/dist/
          server-dir: ${{ vars.FTP_APP_DIR || 'hbuilds/current/nodejs/artifacts/api-server/dist/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      # Touch <restart-dir>restart.txt via a single-file upload (not a sync) so
      # Passenger reloads the new build without disturbing anything else in tmp/.
      - name: Restart Passenger app
        if: ${{ env.FTP_SERVER != '' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_RESTART_DIR: ${{ vars.FTP_RESTART_DIR || 'hbuilds/current/nodejs/tmp/' }}
        run: |
          echo "restarted by GitHub Actions at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > restart.txt
          curl -sS --show-error --fail --connect-timeout 60 --max-time 120 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T restart.txt \
            "ftp://$FTP_SERVER/${FTP_RESTART_DIR}restart.txt"
          echo "Touched ${FTP_RESTART_DIR}restart.txt — Passenger will reload on the next request."
