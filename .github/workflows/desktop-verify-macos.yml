name: Verify the macOS app

# Opens a published .dmg on a real Mac and checks the app inside it starts.
#
# This exists because "the build succeeded" and "the application runs" are
# different claims, and only the first one was ever being made. The Linux .deb
# has been unpacked and inspected since the packaging defects it found; the
# macOS image had nothing equivalent, and the desktop smoke test does not count
# -- it launches node_modules/electron, the development runtime, not the bundle
# that ships.
#
# Neither macOS nor Windows can be built or run anywhere else in this project,
# so a hosted runner is the only machine that can answer the question at all.
#
# Run it from the Actions tab against any published tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. desktop-v1.0.0)'
        type: string
        required: true
        default: desktop-v1.0.0

concurrency:
  group: desktop-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No pnpm install: the check is plain Node with no dependencies, and it
      # deliberately tests the SHIPPED bundle rather than anything built here.
      # Installing the workspace would only add a way for this to pass while
      # the released artifact is broken.
      - name: Download the released disk image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#desktop-v}"
          # Both, not the one matching this machine. A release ships an arm64
          # and an x64 image, and taking only the host's arch meant the Intel
          # one was never opened -- which is how 1.0.1 shipped an Intel .dmg
          # nothing had ever looked inside. Both are inspected either way; the
          # Intel one is also launched when the runner has Rosetta 2, and named
          # as a skip with its reason when it does not.
          echo "Runner is $(uname -m); fetching both images"
          for arch in arm64 x64; do
            asset="Casparel-${version}-${arch}.dmg"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}"
            if ! curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/${arch}.dmg" "$url"; then
              echo "::error title=Asset not found::${url} could not be downloaded. Check the tag and the asset name."
              exit 1
            fi
            ls -lh "$RUNNER_TEMP/${arch}.dmg"
            shasum -a 256 "$RUNNER_TEMP/${arch}.dmg"
          done

      - name: Mount them, inspect them, run them
        working-directory: artifacts/desktop
        run: |
          # Both are reported before the step fails. Stopping at the first bad
          # image hides the state of the other one, and "did this break one
          # architecture or all of them" is the first question anybody asks.
          status=0
          for arch in arm64 x64; do
            echo "::group::${arch}"
            node scripts/verify-app-macos.mjs "$RUNNER_TEMP/${arch}.dmg" || status=1
            echo "::endgroup::"
          done
          exit $status
