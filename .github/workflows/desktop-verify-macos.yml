# @fileOverview: Repository role: implements or configures Desktop Verify Macos.
# System connection: see docs/codebase-guide.md and docs/source-file-index.md for its package boundary and consumers.
name: Verify the macOS app

# Opens a built .dmg on a real Mac and checks the app inside it starts.
#
# This exists because "the build succeeded" and "the application runs" are
# different claims, and only the first one was ever being made. The Linux .deb
# has been unpacked and inspected since the packaging defects it found; the
# macOS image had nothing equivalent, and the desktop smoke test does not count
# -- it launches node_modules/electron, the development runtime, not the bundle
# that ships.
#
# Neither macOS nor Windows can be built or run anywhere else in this project,
# so a hosted runner is the only machine that can answer the question at all.
#
# Both architectures are checked: an Intel Mac runs the x64 binary on an Intel
# CPU, which no Apple Silicon runner reproduces and which the build runner can
# therefore only inspect.
#
# The release workflow calls this on the images it just built, before it tags
# anything, and it is the only thing in the release that launches a macOS app.
# Run it from the Actions tab against a published tag to audit a release that is
# already out.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. desktop-v1.0.0)'
        type: string
        required: true
        default: desktop-v1.0.0
  # Called by the release workflow, so every release is checked without anybody
  # remembering to.
  #
  # Two sources, because the same checks are wanted at two different moments and
  # running them twice was the actual state of this repository for a release:
  # the Intel image was launched once from the build's artifacts and again from
  # the published assets, on two separate Intel runners, proving the same thing
  # about the same bytes.
  #
  #   artifact  the images the build just produced, BEFORE anything is
  #             published. This is how the release gates itself: a .dmg nobody
  #             can open should not become a permanent tag.
  #   tag       the assets attached to a published release. This is the manual
  #             path, for auditing something already out.
  #
  # Exactly one. The version comes from whichever was given -- from the tag when
  # auditing a release, because the working tree may have moved on since; from
  # package.json when gating, because there the tree IS what is being released.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to verify (omit when passing an artifact)'
        type: string
        required: false
      artifact:
        description: 'Build artifact holding the .dmg files (omit when passing a tag)'
        type: string
        required: false

concurrency:
  # Keyed on whichever source was named, not on the ref. A release gating itself
  # must not cancel somebody's manual verification of a different version, and
  # two runs against the same images are genuinely redundant.
  group: desktop-verify-macos-${{ inputs.tag || format('{0}-{1}', github.run_id, inputs.artifact) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Both architectures. An Apple Silicon machine can run the x64 image under
    # Rosetta, but that proves the wrong thing: what an Intel owner runs is the
    # x64 binary on an Intel CPU, and only an Intel runner tests that. The x64
    # .dmg had been built by every release and run by nothing.
    #
    # fail-fast is off so one architecture failing still reports the other:
    # "Intel is broken" and "both are broken" are different findings.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # macos-13 is retired. The Intel labels that still exist are
          # macos-15-intel and macos-26-intel; a retired label does not fail,
          # it queues until the job times out, which is why this is pinned to a
          # live one rather than left to a guess.
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    name: verify (${{ matrix.arch }})
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No pnpm install: the check is plain Node with no dependencies, and it
      # deliberately tests the SHIPPED bundle rather than anything built here.
      # Installing the workspace would only add a way for this to pass while
      # the released artifact is broken.
      - name: Refuse an ambiguous request
        run: |
          # One source or the other. Given both, "which did it check?" has no
          # answer anybody could read off the run, and given neither there is
          # nothing to check at all -- either way, silently picking one would
          # make a green run mean nothing in particular.
          tag='${{ inputs.tag }}'
          artifact='${{ inputs.artifact }}'
          if [ -n "$tag" ] && [ -n "$artifact" ]; then
            echo "::error title=Ambiguous input::Pass a tag or an artifact, not both."
            exit 1
          fi
          if [ -z "$tag" ] && [ -z "$artifact" ]; then
            echo "::error title=Nothing to verify::Pass either a tag or an artifact."
            exit 1
          fi

      # Gating a release: the images the build just made, before publication.
      - uses: actions/download-artifact@v4
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
          path: images

      - name: Pick the disk image this leg tests
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # The runner has to BE the architecture this leg claims to test.
          # Apple Silicon runs x64 binaries under Rosetta perfectly well, so if
          # a label quietly moved to Apple Silicon this leg would sail through
          # while proving nothing about an Intel Mac -- a false assurance is
          # worse than the gap it claims to close.
          expected=$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo x86_64)
          actual=$(uname -m)
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Wrong runner architecture::This leg tests ${{ matrix.arch }} and expected uname -m to say ${expected}, but the runner says ${actual}. Testing the ${{ matrix.arch }} image here would not exercise the CPU it is built for."
            exit 1
          fi
          echo "Runner is ${actual}, as expected for ${{ matrix.arch }}."

          if [ -n "${TAG}" ]; then
            # Auditing a published release. The version comes from the tag,
            # never from the tree: the tree may have moved on since, and a
            # check that reads the wrong version passes for the wrong reasons.
            version="${TAG#desktop-v}"
            asset="Casparel-${version}-${{ matrix.arch }}.dmg"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}"
            echo "Fetching ${asset} from ${TAG}"
            if ! curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/app.dmg" "$url"; then
              echo "::error title=Asset not found::${url} could not be downloaded. Check the tag and the asset name."
              exit 1
            fi
          else
            # Gating a release. Nothing is published yet, so the tree is the
            # only statement of what version this is -- and it is the right one,
            # because the tree is what is about to be released.
            version=$(node -p "require('$GITHUB_WORKSPACE/artifacts/desktop/package.json').version")
            asset="Casparel-${version}-${{ matrix.arch }}.dmg"
            echo "Taking ${asset} from the build's artifacts"
            if [ ! -f "$GITHUB_WORKSPACE/images/${asset}" ]; then
              echo "::error title=No ${{ matrix.arch }} image::${asset} is not among the build's artifacts."
              ls -l "$GITHUB_WORKSPACE/images" || true
              exit 1
            fi
            cp "$GITHUB_WORKSPACE/images/${asset}" "$RUNNER_TEMP/app.dmg"
          fi

          echo "VERSION=${version}" >> "$GITHUB_ENV"
          ls -lh "$RUNNER_TEMP/app.dmg"
          shasum -a 256 "$RUNNER_TEMP/app.dmg"

      - name: Mount it, inspect it, run it
        working-directory: artifacts/desktop
        env:
          CASPAREL_EXPECT_SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: node scripts/verify-app-macos.mjs "$RUNNER_TEMP/app.dmg" "--expect-version=$VERSION"
