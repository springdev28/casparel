name: Verify the macOS app

# Opens a published .dmg on a real Mac and checks the app inside it starts.
#
# This exists because "the build succeeded" and "the application runs" are
# different claims, and only the first one was ever being made. The Linux .deb
# has been unpacked and inspected since the packaging defects it found; the
# macOS image had nothing equivalent, and the desktop smoke test does not count
# -- it launches node_modules/electron, the development runtime, not the bundle
# that ships.
#
# Neither macOS nor Windows can be built or run anywhere else in this project,
# so a hosted runner is the only machine that can answer the question at all.
#
# Run it from the Actions tab against any published tag. Both architectures are
# checked: an Intel Mac runs the x64 binary on an Intel CPU, which no Apple
# Silicon runner reproduces.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (e.g. desktop-v1.0.0)'
        type: string
        required: true
        default: desktop-v1.0.0

concurrency:
  group: desktop-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Both architectures. An Apple Silicon machine can run the x64 image under
    # Rosetta, but that proves the wrong thing: what an Intel owner runs is the
    # x64 binary on an Intel CPU, and only an Intel runner tests that. The x64
    # .dmg had been built by every release and run by nothing.
    #
    # fail-fast is off so one architecture failing still reports the other:
    # "Intel is broken" and "both are broken" are different findings.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    name: verify (${{ matrix.arch }})
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No pnpm install: the check is plain Node with no dependencies, and it
      # deliberately tests the SHIPPED bundle rather than anything built here.
      # Installing the workspace would only add a way for this to pass while
      # the released artifact is broken.
      - name: Download the released disk image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#desktop-v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          # The image this machine can actually execute, so "it launches" is a
          # real result rather than a skipped one. Taken from the matrix rather
          # than from uname, so a runner label that silently changes
          # architecture cannot quietly test the same image twice.
          asset="Casparel-${version}-${{ matrix.arch }}.dmg"

          # The runner has to BE the architecture this leg claims to test.
          # Apple Silicon runs x64 binaries under Rosetta perfectly well, so if
          # a label quietly moved to Apple Silicon this leg would sail through
          # while proving nothing about an Intel Mac -- a false assurance is
          # worse than the gap it claims to close.
          expected=$([ "${{ matrix.arch }}" = "arm64" ] && echo arm64 || echo x86_64)
          actual=$(uname -m)
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Wrong runner architecture::This leg tests ${{ matrix.arch }} and expected uname -m to say ${expected}, but the runner says ${actual}. Testing the ${{ matrix.arch }} image here would not exercise the CPU it is built for."
            exit 1
          fi
          echo "Runner is ${actual}, as expected for ${{ matrix.arch }}; fetching ${asset}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${asset}"
          if ! curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/app.dmg" "$url"; then
            echo "::error title=Asset not found::${url} could not be downloaded. Check the tag and the asset name."
            exit 1
          fi
          ls -lh "$RUNNER_TEMP/app.dmg"
          shasum -a 256 "$RUNNER_TEMP/app.dmg"

      - name: Mount it, inspect it, run it
        working-directory: artifacts/desktop
        run: node scripts/verify-app-macos.mjs "$RUNNER_TEMP/app.dmg" "--expect-version=$VERSION"
